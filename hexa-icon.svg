<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#132a44"/>
      <stop offset="60%" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#c8f8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4df3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

    <!-- faint hex grid -->
    <g stroke="#4a82be" stroke-opacity="0.10" stroke-width="2" fill="none">
      <polygon points="80,20 132,50 132,110 80,140 28,110 28,50"/>
      <polygon points="184,20 236,50 236,110 184,140 132,110 132,50"/>
      <polygon points="288,20 340,50 340,110 288,140 236,110 236,50"/>
      <polygon points="392,20 444,50 444,110 392,140 340,110 340,50"/>
      <polygon points="496,20 548,50 548,110 496,140 444,110 444,50"/>
      <polygon points="28,140 80,170 80,230 28,260 -24,230 -24,170"/>
      <polygon points="132,140 184,170 184,230 132,260 80,230 80,170"/>
      <polygon points="236,140 288,170 288,230 236,260 184,230 184,170"/>
      <polygon points="340,140 392,170 392,230 340,260 288,230 288,170"/>
      <polygon points="444,140 496,170 496,230 444,260 392,230 392,170"/>
      <polygon points="80,260 132,290 132,350 80,380 28,350 28,290"/>
      <polygon points="184,260 236,290 236,350 184,380 132,350 132,290"/>
      <polygon points="288,260 340,290 340,350 288,380 236,350 236,290"/>
      <polygon points="392,260 444,290 444,350 392,380 340,350 340,290"/>
      <polygon points="28,380 80,410 80,470 28,500 -24,470 -24,410"/>
      <polygon points="132,380 184,410 184,470 132,500 80,470 80,410"/>
      <polygon points="236,380 288,410 288,470 236,500 184,470 184,410"/>
      <polygon points="340,380 392,410 392,470 340,500 288,470 288,410"/>
      <polygon points="444,380 496,410 496,470 444,500 392,470 392,410"/>
    </g>

    <!-- range ring -->
    <circle cx="256" cy="256" r="215" fill="none" stroke="#4df3ff" stroke-opacity="0.22"
            stroke-width="3" stroke-dasharray="14 18"/>

    <!-- incoming enemies -->
    <g filter="url(#glowSoft)">
      <rect x="72" y="72" width="42" height="42" fill="none" stroke="#ff2e4c" stroke-width="9"/>
      <rect x="404" y="398" width="38" height="38" fill="none" stroke="#ffa028" stroke-width="9"/>
    </g>

    <!-- tower: outer pointy-top hexagon -->
    <g filter="url(#glow)">
      <polygon points="256,106 386,181 386,331 256,406 126,331 126,181"
               fill="none" stroke="#4df3ff" stroke-width="20" stroke-linejoin="round"/>
    </g>

    <!-- tower: inner flat-top hexagon -->
    <polygon points="206,169 306,169 356,256 306,343 206,343 156,256"
             fill="none" stroke="#a5f2ff" stroke-opacity="0.75" stroke-width="10"
             stroke-linejoin="round" filter="url(#glowSoft)"/>

    <!-- pulsing core -->
    <circle cx="256" cy="256" r="58" fill="url(#core)"/>
  </g>
</svg>
