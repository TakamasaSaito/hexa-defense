<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HEXA">
<meta name="theme-color" content="#0a1626">
<link rel="icon" type="image/svg+xml" href="hexa-favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>HEXA DEFENSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#05090f; touch-action:none;
             font-family:'Rajdhani','Chakra Petch',-apple-system,sans-serif; }
#game { display:block; width:100%; height:100%; }
.fx { position:fixed; inset:0; pointer-events:none; z-index:5; }
.scanlines { background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 3px,rgba(10,20,40,0.13) 4px); }
.vignette { background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 45%,rgba(2,5,12,0.72) 100%); }
#ui { position:fixed; inset:0; pointer-events:none; z-index:10; color:#d8ecff; }

/* HUD */
.hud { position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); left:0; width:100%;
       padding:0 14px; display:flex; justify-content:space-between; align-items:flex-start; }
.panel { background:linear-gradient(180deg,rgba(10,24,44,0.88),rgba(6,14,28,0.88));
         border:1px solid rgba(77,243,255,0.35);
         clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
         padding:8px 16px 7px; box-shadow:0 0 18px rgba(77,243,255,0.12),inset 0 0 24px rgba(77,243,255,0.05); }
.wave-label { font-family:'Chakra Petch',sans-serif; font-size:10px; letter-spacing:3px; color:rgba(120,200,235,0.75); }
.wave-num { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:24px; letter-spacing:1px;
            color:#eaffff; text-shadow:0 0 14px rgba(77,243,255,0.8); line-height:1; }
.wave-num small { font-size:13px; color:rgba(140,210,240,0.7); }
.hud-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }

/* XP bar — SPECIALボタン直上 */
.xpwrap { position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 84px); left:50%; transform:translateX(-50%);
          width:140px; }
.xpbar { height:5px; background:rgba(20,40,66,0.9); border:1px solid rgba(77,243,255,0.25);
         clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%); overflow:hidden; }
.xpfill { height:100%; width:0%; background:linear-gradient(90deg,#2b9fff,#4df3ff);
          box-shadow:0 0 12px rgba(77,243,255,0.9); transition:width 0.3s; }
.xplabel { text-align:center; font-family:'Chakra Petch',sans-serif; font-size:9px; letter-spacing:3px;
           color:rgba(120,200,235,0.6); margin-top:4px; }

/* 必殺エリア */
#specialArea { pointer-events:none; position:absolute;
               bottom:calc(env(safe-area-inset-bottom,0px) + 18px); left:50%; transform:translateX(-50%);
               display:none; flex-direction:column; align-items:center; gap:5px;
               width:min(92vw,300px); }
.sp-gauge { width:100%; height:5px; background:rgba(20,40,66,0.9);
            border:1px solid rgba(77,243,255,0.25);
            clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%); overflow:hidden; }
.sp-gauge-fill { height:100%; width:0%; background:linear-gradient(90deg,#2b9fff,#4df3ff);
                 box-shadow:0 0 10px rgba(77,243,255,0.8); transition:width 0.15s; }
.sp-btns { display:flex; gap:6px; width:100%; }
.sp-btn { pointer-events:auto; flex:1; height:48px; border:none; cursor:pointer; position:relative;
          font-family:'Chakra Petch',sans-serif; font-weight:700;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
          color:rgba(140,200,255,0.5);
          background:linear-gradient(180deg,rgba(10,24,44,0.92),rgba(6,14,28,0.92));
          clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
          border-top:1px solid rgba(77,243,255,0.2); border-bottom:1px solid rgba(77,243,255,0.2); }
.sp-btn.ready { color:#eaffff; border-color:rgba(77,243,255,0.75);
                box-shadow:0 0 18px rgba(77,243,255,0.45),0 0 36px rgba(77,243,255,0.2);
                animation:sbpulse 1.2s ease-in-out infinite; }
.sp-btn.locked { opacity:0.28; cursor:not-allowed; pointer-events:none; }
.sp-btn.cooldown { opacity:0.5; cursor:not-allowed; pointer-events:none; }
.sp-btn.od-active { color:#ffd257; border-color:rgba(255,210,87,0.8);
                    box-shadow:0 0 20px rgba(255,210,87,0.5); animation:odpulse 0.6s ease-in-out infinite; }
@keyframes sbpulse { 0%,100%{box-shadow:0 0 14px rgba(77,243,255,0.35);} 50%{box-shadow:0 0 32px rgba(77,243,255,0.75);} }
@keyframes odpulse { 0%,100%{box-shadow:0 0 14px rgba(255,210,87,0.4);} 50%{box-shadow:0 0 32px rgba(255,210,87,0.85);} }
@keyframes bmpulse { 0%,100%{box-shadow:0 0 14px rgba(255,136,68,0.4);} 50%{box-shadow:0 0 32px rgba(255,136,68,0.9);} }
#beamBtn.od-active { color:#ff8844; border-color:rgba(255,136,68,0.8); box-shadow:0 0 20px rgba(255,136,68,0.5); animation:bmpulse 0.6s ease-in-out infinite; }
.sp-name { font-size:10px; letter-spacing:3px; }
.sp-cost { font-size:8px; color:rgba(120,190,230,0.55); }
.sp-cd { font-size:8px; color:rgba(255,120,120,0.85); position:absolute; bottom:3px; left:0; right:0; text-align:center; }

/* screens */
.screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; background:rgba(3,7,15,0.65);
          backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
          opacity:0; visibility:hidden; transition:opacity 0.3s; pointer-events:none; }
.screen.show { opacity:1; visibility:visible; pointer-events:auto; }

/* タイトル */
.logo { position:relative; font-family:'Chakra Petch',sans-serif; font-weight:700;
        font-size:clamp(40px,11vw,64px); letter-spacing:8px; line-height:1.05;
        text-align:center; color:#f2fdff;
        text-shadow:0 0 30px rgba(77,243,255,0.9),0 0 70px rgba(77,243,255,0.4); }
.logo::before { content:attr(data-t); position:absolute; inset:0; color:rgba(255,61,129,0.85);
                transform:translate(-2.5px,1.5px); z-index:-1; filter:blur(0.6px); }
.logo::after { content:attr(data-t); position:absolute; inset:0; color:rgba(77,243,255,0.85);
               transform:translate(2.5px,-1.5px); z-index:-2; filter:blur(0.6px); }
.logo-sub { margin-top:14px; font-family:'Chakra Petch',sans-serif; font-size:11px; letter-spacing:6px;
            color:rgba(140,215,245,0.85); }
.logo-rule { width:180px; height:1px; margin:22px 0 30px;
             background:linear-gradient(90deg,rgba(77,243,255,0),rgba(77,243,255,0.9),rgba(77,243,255,0)); }
.play-btn { pointer-events:auto; border:none; cursor:pointer;
            font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:22px; letter-spacing:5px;
            color:#03140a; padding:20px 66px;
            background:linear-gradient(180deg,#66ff9c,#25c95c);
            clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
            box-shadow:0 0 34px rgba(60,235,120,0.65); animation:btnbreath 2.4s ease-in-out infinite; }
@keyframes btnbreath { 0%,100%{box-shadow:0 0 24px rgba(60,235,120,0.45);} 50%{box-shadow:0 0 48px rgba(60,235,120,0.85);} }
.title-meta { margin-top:34px; display:flex; gap:28px; font-family:'Chakra Petch',sans-serif; }
.meta-item { text-align:center; }
.meta-item .v { font-size:20px; font-weight:700; color:#ffd257; text-shadow:0 0 12px rgba(255,210,87,0.6); }
.meta-item .k { font-size:9px; letter-spacing:3px; color:rgba(130,200,235,0.6); margin-top:3px; }

/* レベルアップ */
.lv-head { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:22px; letter-spacing:6px;
           color:#eaffff; text-shadow:0 0 20px rgba(77,243,255,0.8); }
.lv-sub { font-size:12px; letter-spacing:3px; color:rgba(140,210,240,0.7); margin:8px 0 26px;
          font-family:'Chakra Petch',sans-serif; }
.cards { display:flex; gap:12px; padding:0 12px; }
.card { pointer-events:auto; width:108px; padding:0 0 14px; cursor:pointer; position:relative;
        background:linear-gradient(180deg,rgba(14,30,54,0.96),rgba(8,16,32,0.96));
        border:1px solid rgba(77,243,255,0.4);
        clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
        transition:transform 0.15s; }
.card:active { transform:scale(0.96); }
.card .band { height:4px; background:linear-gradient(90deg,#2b9fff,#4df3ff); box-shadow:0 0 10px rgba(77,243,255,0.8); }
.card .tag { position:absolute; top:10px; right:8px; font-family:'Chakra Petch',sans-serif;
             font-size:8px; letter-spacing:2px; color:rgba(130,200,235,0.55); }
.card .icon { margin:20px auto 10px; width:44px; height:44px; display:flex; align-items:center;
              justify-content:center; font-size:24px;
              background:rgba(77,243,255,0.08); border:1px solid rgba(77,243,255,0.3);
              clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }
.card .cname { text-align:center; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; color:#eaffff; }
.card .cdesc { text-align:center; font-size:11px; color:rgba(150,200,235,0.75); margin-top:5px; line-height:1.5; padding:0 6px; }

/* ボスHPバー — 上部HUD直下 */
#bossBar { position:absolute; top:calc(env(safe-area-inset-top,0px) + 78px); left:50%; transform:translateX(-50%);
           width:min(70vw,260px); display:none; }
.boss-label { font-family:'Chakra Petch',sans-serif; font-size:9px; letter-spacing:4px;
              color:rgba(255,100,50,0.9); text-align:center; margin-bottom:3px; }
.boss-track { height:7px; background:rgba(20,40,66,0.9); border:1px solid rgba(77,243,255,0.35);
              clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%); overflow:hidden; }
.boss-fill { height:100%; width:100%; background:linear-gradient(90deg,#4df3ff,#ff3d81);
             box-shadow:0 0 10px rgba(77,243,255,0.7); transition:width 0.1s; }

/* 武器報酬画面 */
.wpn-head { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:20px; letter-spacing:5px;
            color:#ffd257; text-shadow:0 0 20px rgba(255,210,87,0.8); }
.wpn-sub { font-size:11px; letter-spacing:3px; color:rgba(200,180,100,0.7); margin:8px 0 26px;
           font-family:'Chakra Petch',sans-serif; }
.wpn-cards { display:flex; gap:10px; padding:0 10px; }
.wpn-card { pointer-events:auto; flex:1; min-width:0; padding:0 0 16px; cursor:pointer; position:relative;
            background:linear-gradient(180deg,rgba(30,20,10,0.97),rgba(16,12,6,0.97));
            border:1px solid rgba(255,210,87,0.45);
            clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
            transition:transform 0.15s; }
.wpn-card:active { transform:scale(0.96); }
.wpn-card.disabled { opacity:0.38; cursor:not-allowed; pointer-events:none; }
.wpn-card .band { height:4px; background:linear-gradient(90deg,#ffd257,#ffaa00); box-shadow:0 0 10px rgba(255,210,87,0.8); }
.wpn-card .tag { position:absolute; top:10px; right:8px; font-family:'Chakra Petch',sans-serif;
                 font-size:8px; letter-spacing:2px; color:rgba(255,210,87,0.6); }
.wpn-card .icon { margin:20px auto 10px; width:48px; height:48px; display:flex; align-items:center;
                  justify-content:center; font-size:26px;
                  background:rgba(255,210,87,0.1); border:1px solid rgba(255,210,87,0.35);
                  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }
.wpn-card .cname { text-align:center; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; color:#ffd257; }
.wpn-card .cdesc { text-align:center; font-size:11px; color:rgba(200,180,100,0.8); margin-top:5px; line-height:1.5; padding:0 6px; }

/* 倍速ボタン */
#speedBtn { pointer-events:auto; display:flex; align-items:center; justify-content:center;
            font-family:'Chakra Petch',sans-serif; font-size:12px; font-weight:700; letter-spacing:3px;
            color:rgba(140,210,240,0.7);
            background:rgba(77,243,255,0.05); border:1px solid rgba(77,243,255,0.28);
            padding:7px 16px; cursor:pointer;
            clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
            box-shadow:0 0 10px rgba(77,243,255,0.08); }
#speedBtn.active { color:#eaffff; border-color:rgba(77,243,255,0.75);
                   background:rgba(77,243,255,0.14);
                   box-shadow:0 0 18px rgba(77,243,255,0.35); }

/* コインHUD */
.coin { display:flex; align-items:center; gap:7px; font-family:'Chakra Petch',sans-serif; font-weight:700;
        font-size:19px; color:#ffd257; text-shadow:0 0 12px rgba(255,210,87,0.6); }
.chex { background:#ffd257;
        clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
        box-shadow:0 0 10px rgba(255,210,87,0.9); }

/* SHOPボタン */
.store-btn { pointer-events:auto; margin-top:8px; display:flex; align-items:center; gap:6px;
             font-family:'Chakra Petch',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px;
             color:#ffd257; background:rgba(255,210,87,0.08); border:1px solid rgba(255,210,87,0.45);
             padding:8px 14px; cursor:pointer;
             clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
             box-shadow:0 0 14px rgba(255,210,87,0.2); }

/* ショップ画面 */
.store-panel { width:min(88vw,340px); background:linear-gradient(180deg,rgba(10,22,42,0.97),rgba(6,12,26,0.97));
               border:1px solid rgba(77,243,255,0.35); padding:22px 18px 18px;
               clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px); }
.store-hdr { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; }
.store-hdr .st { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:17px; letter-spacing:4px; color:#eaffff; }
.s-item { pointer-events:auto; display:flex; align-items:center; gap:12px; padding:11px 10px; cursor:pointer;
          border:1px solid rgba(77,243,255,0.15); margin-bottom:8px; background:rgba(77,243,255,0.03); }
.s-item:active { background:rgba(77,243,255,0.1); }
.s-item.s-disabled { opacity:0.4; cursor:not-allowed; pointer-events:none; }
.s-ic { width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center;
        font-size:17px; background:rgba(77,243,255,0.07); border:1px solid rgba(77,243,255,0.25);
        clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }
.s-body { flex:1; }
.s-name { font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:13px; color:#eaffff; }
.s-lv { font-size:10px; color:rgba(140,210,240,0.6); letter-spacing:1px; margin-top:2px; }
.s-price { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:15px; color:#ffd257;
           text-shadow:0 0 10px rgba(255,210,87,0.5); display:flex; align-items:center; gap:5px; }
.store-close { pointer-events:auto; margin-top:10px; width:100%; padding:12px; border:1px solid rgba(77,243,255,0.4);
               background:rgba(77,243,255,0.06); color:#9fe8ff; font-family:'Chakra Petch',sans-serif; font-weight:700;
               font-size:12px; letter-spacing:4px; cursor:pointer; }

/* タイトル追加ボタン(UPGRADE/CONTINUE/SELECT WAVE) */
.title-sub-btn { pointer-events:auto; margin-top:12px; border:none; cursor:pointer;
  font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; letter-spacing:3px;
  color:#4df3ff; padding:11px 32px; display:block;
  background:rgba(77,243,255,0.06); border:1px solid rgba(77,243,255,0.45);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
.title-sub-btn:active { background:rgba(77,243,255,0.18); }

/* メタコイン獲得表示(リザルト) */
.meta-earned { margin:6px 0 16px; font-family:'Chakra Petch',sans-serif; font-size:14px;
  letter-spacing:3px; color:#ffd257; text-align:center; text-shadow:0 0 12px rgba(255,210,87,0.6); }

/* 恒久強化パネル */
.perma-panel { width:min(90vw,360px); max-height:80vh; overflow-y:auto;
  background:linear-gradient(180deg,rgba(10,22,42,0.97),rgba(6,12,26,0.97));
  border:1px solid rgba(77,243,255,0.35); padding:20px 16px 16px;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px); }
.perma-hdr { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
.perma-title-txt { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:16px;
  letter-spacing:4px; color:#eaffff; }
.perma-meta-bal { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:14px;
  color:#ffd257; display:flex; align-items:center; gap:5px; }
.perma-row { display:flex; align-items:center; gap:10px; padding:10px 8px; cursor:pointer;
  pointer-events:auto; border:1px solid rgba(77,243,255,0.12); margin-bottom:7px;
  background:rgba(77,243,255,0.02); }
.perma-row:active { background:rgba(77,243,255,0.1); }
.perma-row.maxed { opacity:0.45; pointer-events:none; cursor:default; }
.perma-row.cant-afford { opacity:0.5; pointer-events:none; cursor:not-allowed; }
.perma-icon { width:30px; height:30px; flex:none; display:flex; align-items:center;
  justify-content:center; font-size:15px; background:rgba(77,243,255,0.07);
  border:1px solid rgba(77,243,255,0.22);
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }
.perma-body { flex:1; }
.perma-name { font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:12px; color:#eaffff; }
.perma-pips { display:flex; gap:3px; margin-top:5px; }
.perma-pip { width:11px; height:5px; background:rgba(77,243,255,0.12); border:1px solid rgba(77,243,255,0.25); }
.perma-pip.on { background:#4df3ff; box-shadow:0 0 6px rgba(77,243,255,0.8); }
.perma-pip.on-late { background:#ffd257; box-shadow:0 0 6px rgba(255,210,87,0.85); }
.perma-lv-badge { font-family:'Chakra Petch',sans-serif; font-size:11px; color:#ffd257; font-weight:700; margin-left:6px; letter-spacing:1px; }
.perma-price-col { font-family:'Chakra Petch',sans-serif; font-size:13px; font-weight:700;
  color:#ffd257; white-space:nowrap; display:flex; align-items:center; gap:4px; }

/* チェックポイント選択パネル */
.cp-panel { width:min(88vw,320px); background:linear-gradient(180deg,rgba(10,22,42,0.97),rgba(6,12,26,0.97));
  border:1px solid rgba(77,243,255,0.35); padding:22px 16px 16px;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px); }
.cp-title { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:14px; letter-spacing:4px;
  color:#eaffff; text-align:center; margin-bottom:16px; }
.cp-wave-btn { pointer-events:auto; display:block; width:100%; padding:13px; margin-bottom:8px; border:none;
  cursor:pointer; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; letter-spacing:3px;
  color:#eaffff; background:rgba(77,243,255,0.04); border:1px solid rgba(77,243,255,0.32);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
.cp-wave-btn:active { background:rgba(77,243,255,0.18); }

/* ポーズパネル */

/* 5帯カーブ: ウェーブwでの累積スケーリング量を返す(scales=[W1-10, W11-20, W21-30, W31-40, W41-50]) */
function waveAccum(w, perWave, scales){
  var total = 0;
  for(var b = 0; b < 5; b++){
    var bandStart = b * 10 + 1;
    if(w < bandStart) break;
    var bandEnd = bandStart + 9;
    var wInBand = (w < bandEnd ? w : bandEnd) - bandStart + 1;
    total += wInBand * perWave * scales[b];
  }
  return total;
}

   StorageAdapter + SaveData
===================================================================== */
function defaultSaveData(){
  return {
    version: 1,
    metaCoins: 0,
    bestWave: 0,
    totalKills: 0,
    permanentUpgrades: { dmg: 0, rate: 0, hp: 0, range: 0, coinGain: 0, barriersStart: 0, gaugeRate: 0, elemStart: 0 },
    unlockedCheckpoints: [1],
    suspendedRun: null,
    settings: { mute: false, speedIdx: 1 }
  };
}

function migrateSave(data){
  if(!data || typeof data !== 'object') return defaultSaveData();
  var d = defaultSaveData();
  if(typeof data.metaCoins === 'number') d.metaCoins = data.metaCoins;
  if(typeof data.bestWave === 'number') d.bestWave = data.bestWave;
  if(typeof data.totalKills === 'number') d.totalKills = data.totalKills;
  if(data.permanentUpgrades && typeof data.permanentUpgrades === 'object'){
    var pu = data.permanentUpgrades;
    if(typeof pu.dmg === 'number') d.permanentUpgrades.dmg = pu.dmg;
    if(typeof pu.rate === 'number') d.permanentUpgrades.rate = pu.rate;
    if(typeof pu.hp === 'number') d.permanentUpgrades.hp = pu.hp;
    if(typeof pu.range === 'number') d.permanentUpgrades.range = pu.range;
    if(typeof pu.coinGain === 'number') d.permanentUpgrades.coinGain = pu.coinGain;
    if(typeof pu.barriersStart === 'number') d.permanentUpgrades.barriersStart = pu.barriersStart;
    if(typeof pu.gaugeRate === 'number') d.permanentUpgrades.gaugeRate = pu.gaugeRate;
    if(typeof pu.elemStart === 'number') d.permanentUpgrades.elemStart = pu.elemStart;
  }
  if(Array.isArray(data.unlockedCheckpoints)){
    var valid = [1, 10, 20, 30, 40];
    var cps = [];
    for(var ci = 0; ci < data.unlockedCheckpoints.length; ci++){
      for(var vi = 0; vi < valid.length; vi++){
        if(data.unlockedCheckpoints[ci] === valid[vi]){ cps.push(valid[vi]); break; }
      }
    }
    if(cps.length === 0) cps = [1];
    d.unlockedCheckpoints = cps;
  }
  if(data.suspendedRun && typeof data.suspendedRun === 'object') d.suspendedRun = data.suspendedRun;
  if(data.settings && typeof data.settings === 'object'){
    if(typeof data.settings.mute === 'boolean') d.settings.mute = data.settings.mute;
    if(typeof data.settings.speedIdx === 'number' &&
       data.settings.speedIdx >= 0 && data.settings.speedIdx < CFG.SPEED_STEPS.length){
      d.settings.speedIdx = data.settings.speedIdx;
    }
  }
  d.version = 1;
  return d;
}

function LocalStorageAdapter(){}
LocalStorageAdapter.prototype.load = function(){
  try {
    var raw = localStorage.getItem('hd_save');
    if(raw) return migrateSave(JSON.parse(raw));
    /* 旧キー(v0)からのマイグレーション */
    var oldBest = localStorage.getItem('hd_best_wave');
    var oldSet  = localStorage.getItem('hd_settings');
    if(oldBest || oldSet){
      var d = defaultSaveData();
      if(oldBest) d.bestWave = parseInt(oldBest, 10) || 0;
      if(oldSet){
        try {
          var os = JSON.parse(oldSet);
          if(os && typeof os.speedIdx === 'number' && os.speedIdx >= 0 &&
             os.speedIdx < CFG.SPEED_STEPS.length) d.settings.speedIdx = os.speedIdx;
        } catch(e2) {}
      }
      return d;
    }
  } catch(e) {}
  return defaultSaveData();
};
LocalStorageAdapter.prototype.save = function(data){
  try { localStorage.setItem('hd_save', JSON.stringify(data)); } catch(e) {}
};

/* =====================================================================
   サウンド(Web Audio API — 外部ファイル不使用)
===================================================================== */
function initAudio(){
  if(audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(err){ audioCtx = null; }
}

function resumeAudio(){
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(id){
  if(settings.mute) return;
  if(!audioCtx){ initAudio(); if(!audioCtx) return; }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  if(id === 'shoot')   sndShoot();
  else if(id === 'hit')     sndHit();
  else if(id === 'kill')    sndKill();
  else if(id === 'coin')    sndCoin();
  else if(id === 'levelup') sndLevelup();
  else if(id === 'pulse')    sndSpecial();
  else if(id === 'railgun')  sndRailgun();
  else if(id === 'overdrive')sndOverdrive();
  else if(id === 'boss')    sndBoss();
  else if(id === 'damage')  sndDamage();
  else if(id === 'barrier') sndBarrierBreak();
  else if(id === 'button')  sndButton();
  else if(id === 'rare')    sndRare();
}

function oscPlay(type, freq, freqEnd, gainStart, dur){
  var t = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if(freqEnd > 0) osc.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  g.gain.setValueAtTime(gainStart, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.01);
}

function noisePlay(gainStart, dur){
  var t = audioCtx.currentTime;
  var bufLen = Math.ceil(audioCtx.sampleRate * dur);
  var buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
  var d = buf.getChannelData(0);
  for(var ni = 0; ni < bufLen; ni++) d[ni] = Math.random() * 2 - 1;
  var src = audioCtx.createBufferSource();
  src.buffer = buf;
  var gn = audioCtx.createGain();
  gn.gain.setValueAtTime(gainStart, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(gn); gn.connect(audioCtx.destination);
  src.start(t); src.stop(t + dur + 0.01);
}

var RARE_EFFECT_POOL = ['attrPower', 'attrRange', 'orbital', 'field', 'satellite', 'barrier'];

function spawnRareItem(x, y){
  /* 効果プールを状況に合わせてフィルタ */
  var pool = [];
  var pi;
  for(pi = 0; pi < RARE_EFFECT_POOL.length; pi++){
    var ef = RARE_EFFECT_POOL[pi];
    if((ef === 'attrPower' || ef === 'attrRange') && !chosenElement) continue;
    if(ef === 'orbital'   && weapons.orbital   >= 6) continue;
    if(ef === 'satellite' && weapons.satellite  >= 5) continue;
    if(ef === 'field'     && weapons.field      >= 5) continue;
    pool.push(ef);
  }
  if(pool.length === 0) pool = ['barrier'];
  var effect = pool[Math.floor(Math.random() * pool.length)];
  rareItems.push({ x: x, y: y, life: CFG.DROP_RARE_LIFE, effect: effect });
}

function applyRareEffect(effect, ix, iy){
  var label = '';
  if(effect === 'attrPower' && chosenElement){
    var key = 'attr' + chosenElement.charAt(0).toUpperCase() + chosenElement.slice(1);
    var oldLv = weapons[key] || 0;
    weapons[key] = Math.min(3, oldLv + 1);
    label = chosenElement.toUpperCase() + ' PWR+';
  } else if(effect === 'attrRange'){
    attrRangeMult = attrRangeMult * 1.15;
    label = 'ATTR RNG+';
  } else if(effect === 'orbital'){
    weapons.orbital = Math.min(6, (weapons.orbital || 0) + 1);
    rebuildOrbitals();
    label = 'ORBITAL+1';
  } else if(effect === 'field'){
    if(weapons.field === 0){ fieldUsesLeft += CFG.FIELD_BASE_USES; }
    else { fieldUsesLeft += CFG.FIELD_EXTRA_USES; }
    weapons.field = Math.min(5, (weapons.field || 0) + 1);
    label = 'FIELD +USE';
  } else if(effect === 'satellite'){
    weapons.satellite = Math.min(5, (weapons.satellite || 0) + 1);
    rebuildSatellites();
    label = 'SATELLITE+1';
  } else if(effect === 'barrier'){
    barrierCount = Math.min(CFG.BARRIER_MAX, barrierCount + 1);
    label = 'BARRIER+1';
  }
  if(label !== '') floater(ix, iy - 20, label, '#ffd257');
  playSound('rare');
  burst(ix, iy, '#ffd257', 16);
}

===================================================================== */
function xpRequiredForLevel(lv){
  var req = CFG.XP_BASE;
  for(var i = 1; i < lv; i++){
    req = Math.min(CFG.XP_CAP, Math.floor(req * CFG.XP_SCALE));
  }
  return req;
}

function gainXP(amount){
  xp += amount;
  while(xp >= xpNext){
    xp -= xpNext;
    level++;
    xpNext = xpRequiredForLevel(level);
    pendingLevelUps++;
  }
  updateXPHud();
  if(pendingLevelUps > 0 && STATE === 'play') doLevelUp();
}

function updateXPHud(){
  var pct = Math.min(100, Math.floor(xp / xpNext * 100));
  document.getElementById('xpFill').style.width = pct + '%';
  document.getElementById('xpLabel').textContent =
    'LEVEL ' + level + ' — NEXT ' + (xpNext - xp) + ' XP';
}

function doLevelUp(){
  playSound('levelup');
  STATE = 'levelup';
  renderLvCards();
  showScreen('scrLevelup');
}

/* カードプールからランダム3択 */
function renderLvCards(){
  /* 属性未選択の場合は attrLv を除外 */
  var pool = [];
  var src = CFG.CARD_POOL;
  var si;
  for(si = 0; si < src.length; si++){
    if(src[si].id === 'attrLv' && !chosenElement) continue;
    pool.push(src[si]);
  }
  /* W11以降: サブウェポンカードを高重みで追加(上限済みは除外) */
  if(wave >= CFG.CARD_SUB_WAVE){
    var sub = CFG.CARD_POOL_SUB;
    for(si = 0; si < sub.length; si++){
      var c = sub[si];
      if(c.id === 'cardOrbital'   && weapons.orbital   >= 6) continue;
      if(c.id === 'cardSatellite' && weapons.satellite  >= 5) continue;
      if(c.id === 'cardField'     && weapons.field      >= 5) continue;
      if(c.id === 'cardTurret'    && weapons.subTurret  >= 4) continue;
      var wt = CFG.CARD_SUB_WEIGHT, wi;
      for(wi = 0; wi < wt; wi++) pool.push(c);
    }
  }
  /* shuffle */
  for(var i = pool.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var chosen = pool.slice(0, 3);
  var container = document.getElementById('lvCards');
  container.innerHTML = '';
  for(var c = 0; c < chosen.length; c++){
    var card = chosen[c];
    var div = document.createElement('div');
    div.className = 'card';
    div.innerHTML =
      '<div class="band"></div>' +
      '<div class="tag">COMMON</div>' +
      '<div class="icon">' + card.icon + '</div>' +
      '<div class="cname">' + card.name + '</div>' +
      '<div class="cdesc">' + card.desc + '</div>';
    div.setAttribute('data-up', card.id);
    div.addEventListener('click', onCardClick);
    container.appendChild(div);
  }
}

  var id = this.getAttribute('data-up');

function applyUpgrade(id){
  if(id === 'rate')    { tower.fireInterval = tower.fireInterval * 0.8; }
  if(id === 'dmg')     { tower.dmg = tower.dmg * 1.4; }
  if(id === 'range'){
    var rIdx = Math.min(upgradeCounts.range, CFG.TOWER_RANGE_SHOP_STEPS.length - 1);
    tower.range = tower.range * (1 + CFG.TOWER_RANGE_SHOP_STEPS[rIdx]);
    var rangeCap = Math.min(W, H) * CFG.TOWER_RANGE_MAX;
    if(tower.range > rangeCap) tower.range = rangeCap;
  }
  if(id === 'speed')   { tower.bulletSpeed = tower.bulletSpeed * 1.15; }
  if(id === 'heal')    { tower.hp = Math.min(tower.maxHp, tower.hp + 30); }
  if(id === 'barrier') { barrierCount = Math.min(CFG.BARRIER_MAX, barrierCount + 1); }
  if(id === 'attrLv' && chosenElement){
    var attrKey = 'attr' + chosenElement.charAt(0).toUpperCase() + chosenElement.slice(1);
    weapons[attrKey] = Math.min(3, (weapons[attrKey] || 0) + 1);
  }
  if(id === 'attrRange'){ attrRangeMult = attrRangeMult * 1.20; }
  if(id === 'cardOrbital')  { weapons.orbital   = Math.min(6, (weapons.orbital  ||0)+1); rebuildOrbitals();  }
  if(id === 'cardSatellite'){ weapons.satellite  = Math.min(5, (weapons.satellite||0)+1); rebuildSatellites(); }
  if(id === 'cardField')    {
    if(weapons.field === 0){ fieldUsesLeft += CFG.FIELD_BASE_USES; }
    else { fieldUsesLeft += CFG.FIELD_EXTRA_USES; }
    weapons.field = Math.min(5, (weapons.field||0)+1);
  }
  if(id === 'cardTurret')   { weapons.subTurret  = Math.min(4, (weapons.subTurret||0)+1); }
  if(typeof upgradeCounts[id] !== 'undefined') upgradeCounts[id]++;
}

function firePulse(){

  specials.pulse.cd = CFG.PULSE_CD;

  var dmg = tower.dmg * CFG.PULSE_BULLET_DMG_MULT;
  var pierceMax = CFG.PIERCE_LV[Math.min(weapons.pierce, CFG.PIERCE_LV.length - 1)];
  var count = CFG.PULSE_BULLET_COUNT;
  var pAttr = getBulletAttrColor('#4df3ff', '#57d8ff');
  for(var k = 0; k < count; k++){
    var a = Math.PI * 2 / count * k;
    bullets.push({
      x: cx(), y: cy(),
      vx: Math.cos(a) * CFG.PULSE_BULLET_SPEED,
      vy: Math.sin(a) * CFG.PULSE_BULLET_SPEED,
      life: CFG.BULLET_LIFE, dmg: dmg, pierceLeft: pierceMax,
      r: 5, bcolor: pAttr.c, bglow: pAttr.g, exploded: false
    });

  flashTimer = CFG.PULSE_FLASH_DUR;
  shakeTimer = CFG.PULSE_SHAKE_DUR;

  playSound('pulse');

  }
}

function fireRailgun(){
  if(!specials.railgun.unlocked || specials.railgun.cd > 0 || STATE !== 'play') return;
  if(specialGauge < CFG.RAILGUN_COST) return;
  if(railgunCharge) return;

  /* ボス優先→最HP敵 */
  var target = boss || null;
  if(!target){
    var maxHp = -1, i;
    for(i = 0; i < enemies.length; i++){
      if(enemies[i].hp > maxHp){ maxHp = enemies[i].hp; target = enemies[i]; }
    }
  }
  if(!target) return;

  specialGauge -= CFG.RAILGUN_COST;
  specials.railgun.cd = CFG.RAILGUN_CD;
  updateSpecialHud();

  var ang = Math.atan2(target.y - cy(), target.x - cx());
  railgunCharge = { timer: 0, maxTimer: CFG.RAILGUN_CHARGE_DUR, ang: ang };
  sndRailgunCharge();
}

function executeRailgunBeam(ang){
  var ca = Math.cos(ang), sa = Math.sin(ang);
  var normalDmg = tower.dmg * CFG.RAILGUN_DMG_MULT;
  var bossDmg   = normalDmg * CFG.RAILGUN_BOSS_DMG_MULT;
  var thr = CFG.RAILGUN_HIT_MARGIN;
  var beamLen = Math.sqrt(W * W + H * H);
  railgunBeam = { x1:cx(), y1:cy(), x2:cx()+ca*beamLen, y2:cy()+sa*beamLen,
                  timer: CFG.RAILGUN_BEAM_DUR, maxTimer: CFG.RAILGUN_BEAM_DUR };

  var i;
  for(i = enemies.length - 1; i >= 0; i--){
    var e = enemies[i];
    var t2 = (e.x - cx()) * ca + (e.y - cy()) * sa;
    if(t2 < 0) continue;
    var px = cx() + t2 * ca, py = cy() + t2 * sa;
    var dist = Math.sqrt((e.x-px)*(e.x-px) + (e.y-py)*(e.y-py));
    if(dist < thr + e.size * 0.5){
      e.hp -= normalDmg;
      floater(e.x, e.y - e.size, '-' + String(Math.round(normalDmg)), '#4df3ff');
      burst(e.x, e.y, '#4df3ff', 14);
      if(e.hp <= 0){
        kills++; gainXP(e.xpReward); gainCoin(e.coinReward || 1, e.x, e.y);
        enemies.splice(i, 1);
      }
    }
  }
  if(boss){
    var bt = (boss.x - cx()) * ca + (boss.y - cy()) * sa;
    if(bt > 0){
      var bpx = cx() + bt * ca, bpy = cy() + bt * sa;
      var bdist = Math.sqrt((boss.x-bpx)*(boss.x-bpx) + (boss.y-bpy)*(boss.y-bpy));
      if(bdist < thr + boss.size * 0.5){
        boss.hp -= bossDmg;
        floater(boss.x, boss.y - boss.size - 10,
                '-' + String(Math.round(bossDmg)), '#4df3ff', CFG.RAILGUN_BOSS_FLOATER_SZ);
        burst(boss.x, boss.y, '#4df3ff', 32);
        updateBossHpBar();
        if(boss.hp <= 0){
          burst(boss.x, boss.y, boss.color, 40);
          kills++; gainXP(boss.xpReward); gainCoin(boss.coinReward || 1, boss.x, boss.y);
          spawnRareItem(boss.x, boss.y);
          boss = null; hideBossBar();
        }
      }
    }
  }
  flashTimer = CFG.RAILGUN_FLASH_DUR;
  shakeTimer = CFG.RAILGUN_SHAKE_DUR;
  shakeMag   = CFG.RAILGUN_SHAKE_MAG;
  playSound('railgun');
}

function fireOverdrive(){
  if(!specials.overdrive.unlocked || specials.overdrive.cd > 0 || overdriveTimer > 0 || STATE !== 'play') return;
  if(specialGauge < CFG.OVERDRIVE_COST) return;
  specialGauge -= CFG.OVERDRIVE_COST;
  overdriveSavedInterval = tower.fireInterval;
  overdriveSavedDmg      = tower.dmg;
  overdriveSavedRange    = tower.range;
  tower.fireInterval = tower.fireInterval / CFG.OVERDRIVE_RATE_MULT;
  tower.dmg          = tower.dmg          * CFG.OVERDRIVE_DMG_MULT;
  tower.range        = tower.range        * CFG.OVERDRIVE_RANGE_MULT;
  overdriveTimer = CFG.OVERDRIVE_DUR;
  updateSpecialHud();
  playSound('overdrive');
  shakeTimer = 0.5; shakeMag = 16;
  for(var oi = 0; oi < 36; oi++){
    var oa = Math.PI * 2 / 36 * oi;
    particles.push({ x:cx(), y:cy(), vx:Math.cos(oa)*300, vy:Math.sin(oa)*300, life:0.7, maxLife:0.7, r:4, color:'#ffd257' });
  }
  for(var oi2 = 0; oi2 < 24; oi2++){
    var oa2 = Math.PI * 2 / 24 * oi2;
    particles.push({ x:cx(), y:cy(), vx:Math.cos(oa2)*160, vy:Math.sin(oa2)*160, life:1.0, maxLife:1.0, r:6, color:'#ffaa00' });
  }
}

function fireBeam(){
  if(!specials.beam.unlocked || specials.beam.cd > 0 || beamTimer > 0 || STATE !== 'play') return;
  if(specialGauge < CFG.BEAM_COST) return;
  specialGauge -= CFG.BEAM_COST;
  beamTimer = CFG.BEAM_DUR;
  /* 初期方向: タワーから一番近い敵 or 右向き */
  var initTarget = boss !== null ? boss : (enemies.length > 0 ? enemies[0] : null);
  if(initTarget){
    beamAngle = Math.atan2(initTarget.y - cy(), initTarget.x - cx());
  } else {
    beamAngle = 0;
  }
  flashTimer = CFG.BEAM_FLASH_DUR;
  updateSpecialHud();
  playSound('overdrive'); /* 既存OVERDRIVEサウンドを共用 */
}

/* =====================================================================
   ウェーブ管理
===================================================================== */
/* デバッグ: URLパラメータ ?wave=N でウェーブスキップ */
function getUrlParam(name){
  var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}

function resetGame(){
  wave = 1; kills = 0;
  xp = 0; level = 1; xpNext = CFG.XP_BASE;
  specialGauge = 0; pendingLevelUps = 0;
  specials.pulse.unlocked    = true;  specials.pulse.cd    = 0;
  specials.railgun.unlocked  = false; specials.railgun.cd  = 0;
  specials.overdrive.unlocked= false; specials.overdrive.cd= 0;
  specials.beam.unlocked     = false; specials.beam.cd     = 0;
  overdriveTimer = 0; beamTimer = 0;
  overdriveSavedInterval = 0; overdriveSavedDmg = 0; overdriveSavedRange = 0;
  railgunCharge = null; railgunBeam = null; specialHudTimer = 0;
  coins = 0; healItems = []; rareItems = [];
  upgradeCounts = { rate: 0, dmg: 0, range: 0, speed: 0, barrier: 0, heal: 0 };
  barrierCount = 0; barrierBreakTimer = 0;
  enemies = []; bullets = []; missiles = []; particles = []; floaters = []; enemyBullets = [];
  missileTimer = 0;
  boss = null; warningTimer = 0; bossSpawnFn = null; newEnemyAlert = null;
  weapons = { subTurret: 0, pierce: 0, attrFire: 0, attrIce: 0, attrLightning: 0, orbital: 0, explosion: 0, satellite: 0, field: 0 };
  chosenElement = null;
  attrRangeMult = 1.0;
  subTurretAngles = [0, 0, 0, 0]; subTurretFireTimers = [0, 0, 0, 0];
  orbitals = []; lightningFlashes = []; explosionFlashes = [];
  satellites = []; fields = []; fieldCooldown = 0; fieldUsesLeft = 0;
  pendingSteps = 0;
  tower.hp          = CFG.TOWER_HP;
  tower.maxHp       = CFG.TOWER_HP;
  tower.dmg         = CFG.TOWER_DMG;
  tower.fireInterval= CFG.TOWER_FIRE_INTERVAL;
  tower.bulletSpeed = CFG.TOWER_BULLET_SPEED;
  tower.range       = Math.min(W, H) * CFG.TOWER_RANGE_RATIO;
  applyPermanentUpgrades();
  turretAngle = 0; fireTimer = 0;
  flashTimer = 0; shakeTimer = 0;
  hideBossBar();
  updateCoinHud();

  /* ?wave=N デバッグスキップ */
  var skipW = parseInt(getUrlParam('wave'));
  if(skipW >= 1 && skipW <= CFG.MAX_WAVE){ wave = skipW; }

  updateXPHud();
  updateSpecialHud();
  document.getElementById('waveNum').textContent = String(wave);
  document.getElementById('waveTotal').textContent = ' / ' + CFG.MAX_WAVE;
  /* startWave() は呼び出し元で行う(チェックポイント開始時に武器選択を挟むため) */
}

function startWave(){
  boss = null; hideBossBar(); enemyBullets = [];
  /* 新敵初登場告知(ゲーム継続) */
  if(wave === CFG.ENEMY_SNIPER_WAVE_START) triggerNewEnemyAlert('SNIPER', CFG.ENEMY_SNIPER_COLOR);
  if(wave === CFG.ENEMY_SPLIT_WAVE_START)  triggerNewEnemyAlert('SPLITTER', CFG.ENEMY_SPLIT_COLOR);
  if(wave === CFG.ENEMY_WEAVER_WAVE_START) triggerNewEnemyAlert('WEAVER', CFG.ENEMY_WEAVER_COLOR);
  if(wave === 5){
    spawnQueue = 0; spawnTimer = 0;
    triggerBossWarning('MINI BOSS', 'CHARGER', spawnMiniCharger);
  } else if(wave === 10 || wave === 25 || wave === 45){
    spawnQueue = 0; spawnTimer = 0;
    (function(_wc){ triggerBossWarning('BOSS', _wc === 45 ? 'CHARGER III' : _wc === 25 ? 'CHARGER II' : 'CHARGER', function(){ spawnCharger(_wc); }); })(wave);
  } else if(wave === 15 || wave === 35){
    spawnQueue = 0; spawnTimer = 0;
    (function(_wb){ triggerBossWarning('BOSS', _wb === 35 ? 'BARRAGE II' : 'BARRAGE', function(){ spawnBarrage(_wb); }); })(wave);
  } else if(wave === 20 || wave === 40 || wave === 50){
    spawnQueue = 0; spawnTimer = 0;
    (function(_ws){ triggerBossWarning('BOSS', _ws === 50 ? 'FINAL BOSS' : _ws === 40 ? 'SUMMONER II' : 'SUMMONER', function(){ spawnSummoner(_ws); }); })(wave);
  } else if(wave === 30){
    spawnQueue = 0; spawnTimer = 0;
    (function(_wd){ triggerBossWarning('BOSS', 'DIVIDER', function(){ spawnDivider(_wd); }); })(wave);
  } else {
    spawnQueue = Math.floor(CFG.WAVE_SPAWN_BASE + waveAccum(wave, CFG.WAVE_SPAWN_WAVE, CFG.WAVE_SPAWN_SCALES));
    spawnTimer = 0;
  }
  document.getElementById('waveNum').textContent = String(wave);
}

function waveComplete(){
  /* 小回復 */
  tower.hp = Math.min(tower.maxHp, tower.hp + CFG.WAVE_HEAL_ON_CLEAR);
  floater(cx(), cy() - 80, '+' + CFG.WAVE_HEAL_ON_CLEAR + ' HP', '#3ddc74');

  /* チェックポイント解除 */
  for(var ci = 0; ci < CFG.CHECKPOINT_WAVES.length; ci++){
    if(wave === CFG.CHECKPOINT_WAVES[ci]){
      unlockCheckpoint(CFG.CHECKPOINT_WAVES[ci]);
      break;
    }
  }

  /* 報酬ウェーブ判定 */
  for(var r = 0; r < CFG.REWARD_WAVES.length; r++){
    if(wave === CFG.REWARD_WAVES[r]){ showWeaponReward(); return; }
  }

  if(wave >= CFG.MAX_WAVE){
    endGame(true);
  } else {
    wave++;
    startWave();
  }
}

/* =====================================================================
   敵スポーン
===================================================================== */
function spawnEnemy(){
  var edge = Math.floor(Math.random() * 4);
  var x, y, m = 70;
  if(edge === 0){ x = Math.random() * W; y = -m; }
  else if(edge === 1){ x = W + m; y = Math.random() * H; }
  else if(edge === 2){ x = Math.random() * W; y = H + m; }
  else { x = -m; y = Math.random() * H; }

  /* 新敵出現チェック */
  var r = Math.random();
  var sniperRate = wave >= CFG.ENEMY_SNIPER_WAVE_START ? CFG.ENEMY_SNIPER_RATIO : 0;
  var splitRate  = wave >= CFG.ENEMY_SPLIT_WAVE_START  ? CFG.ENEMY_SPLIT_RATIO  : 0;
  var weaverRate = wave >= CFG.ENEMY_WEAVER_WAVE_START ? CFG.ENEMY_WEAVER_RATIO : 0;

  if(r < sniperRate){
    spawnSniper(x, y);
  } else if(r < sniperRate + splitRate){
    spawnSplit(x, y);
  } else if(r < sniperRate + splitRate + weaverRate){
    spawnWeaver(x, y);
  } else {
    /* 既存: 赤/オレンジ */
    var tankRatio = Math.min(CFG.ENEMY_ORANGE_RATIO_MAX,
      CFG.ENEMY_ORANGE_RATIO + wave * CFG.ENEMY_ORANGE_RATIO_WAVE);
    if(Math.random() < tankRatio){
      var hp = CFG.ENEMY_ORANGE_HP_BASE + waveAccum(wave, CFG.ENEMY_ORANGE_HP_WAVE, CFG.WAVE_HP_SCALES);
      enemies.push({
        x: x, y: y, hp: hp, maxHp: hp,
        speed: CFG.ENEMY_ORANGE_SPEED_BASE + waveAccum(wave, CFG.ENEMY_ORANGE_SPEED_WAVE, CFG.WAVE_SPEED_SCALES),
        size: CFG.ENEMY_ORANGE_SIZE, color: '#ffa028',
        rot: Math.random() * Math.PI * 2, rotSpd: (Math.random() - 0.5) * 1.5,
        dmg: CFG.ENEMY_ORANGE_DMG, xpReward: CFG.XP_PER_ORANGE, coinReward: CFG.COIN_ORANGE,
        stunTimer: 0
      });
    } else {
      var hp2 = CFG.ENEMY_RED_HP_BASE + waveAccum(wave, CFG.ENEMY_RED_HP_WAVE, CFG.WAVE_HP_SCALES);
      enemies.push({
        x: x, y: y, hp: hp2, maxHp: hp2,
        speed: CFG.ENEMY_RED_SPEED_BASE + waveAccum(wave, CFG.ENEMY_RED_SPEED_WAVE, CFG.WAVE_SPEED_SCALES),
        size: CFG.ENEMY_RED_SIZE, color: '#ff2e4c',
        rot: Math.random() * Math.PI * 2, rotSpd: (Math.random() - 0.5) * 1.5,
        dmg: CFG.ENEMY_RED_DMG, xpReward: CFG.XP_PER_RED, coinReward: CFG.COIN_RED,
        stunTimer: 0
      });
    }
  }
}

/* =====================================================================
   パーティクル / フローター
===================================================================== */
function burst(x, y, color, n){
  var remaining = CFG.PARTICLE_MAX - particles.length;
  if(remaining <= 0) return;
  /* x5以上でパーティクル間引き */
  var count = (settings.speedIdx >= CFG.SPEED_PARTICLE_THRESH)
    ? Math.max(1, Math.floor(n * CFG.SPEED_PARTICLE_RATIO))
    : n;
  count = Math.min(count, remaining);
  for(var i = 0; i < count; i++){
    var a  = Math.random() * Math.PI * 2;
    var sp = 50 + Math.random() * 180;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5 + Math.random() * 0.4, maxLife: 0.9,
      r: 2 + Math.random() * 4, color: color
    });
  }
}

function floater(x, y, text, color, size){
  floaters.push({ x: x, y: y, text: text, color: color, life: 0.8, size: size });
}

/* =====================================================================
   属性ヘルパー
===================================================================== */
function getBulletAttrColor(baseC, baseG){
  var hF = weapons.attrFire > 0, hI = weapons.attrIce > 0, hL = weapons.attrLightning > 0;
  if(!hF && !hI && !hL) return { c: baseC, g: baseG };
  if(hF && hI && hL)   return { c: '#ffffff', g: '#d0e8ff' };
  if(hF && hI)  return { c: '#df40ff', g: '#b020d0' };
  if(hF && hL)  return { c: '#ffa020', g: '#ff6800' };
  if(hI && hL)  return { c: '#80ffee', g: '#30e0cc' };
  if(hF)  return { c: '#ff8040', g: '#ff4800' };
  if(hI)  return { c: '#80d8ff', g: '#30a8f0' };
  return { c: '#ffff60', g: '#ffd000' };
}

function applyAttrEffects(e, dmg, sx, sy){
  if(weapons.attrFire > 0){
    var flv = weapons.attrFire - 1;
    e.dotFire = { timer: CFG.ATTR_FIRE_DOT_DUR, dmgPerSec: dmg * CFG.ATTR_FIRE_DOT_MULTS[flv] };
  }
  if(weapons.attrIce > 0 && !e.isBoss){
    var ilv = weapons.attrIce - 1;
    e.slowIce = { timer: CFG.ATTR_ICE_SLOW_DUR, mult: CFG.ATTR_ICE_SLOW_MULTS[ilv] };
  }
  if(weapons.attrLightning > 0){
    var clv = weapons.attrLightning - 1;
    var cN  = CFG.ATTR_LIGHTNING_CHAINS[clv];
    var cDmg = dmg * CFG.ATTR_LIGHTNING_FRAC;
    applyLightningChain(e, cDmg, cN);
  }
}

function applyLightningChain(source, chainDmg, chainN){
  var all = enemies.slice();
  if(boss !== null) all.push(boss);
  var nearby = [];
  var i;
  for(i = 0; i < all.length; i++){
    var te = all[i];
    if(te === source || te.hp <= 0) continue;
    var tdx = te.x - source.x, tdy = te.y - source.y;
    var td2 = tdx*tdx + tdy*tdy;
    var lr = CFG.ATTR_LIGHTNING_RANGE * attrRangeMult;
    if(td2 < lr * lr)
      nearby.push({ e: te, d2: td2 });
  }
  nearby.sort(function(a,b){ return a.d2 - b.d2; });
  var count = Math.min(chainN, nearby.length);
  for(i = 0; i < count; i++){
    var ce = nearby[i].e;
    ce.hp -= chainDmg;
    gainSpecial(chainDmg);
    if(weapons.attrFire > 0){
      var cflv = weapons.attrFire - 1;
      ce.dotFire = { timer: CFG.ATTR_FIRE_DOT_DUR, dmgPerSec: chainDmg * CFG.ATTR_FIRE_DOT_MULTS[cflv] };
    }
    if(weapons.attrIce > 0 && !ce.isBoss){
      var cilv = weapons.attrIce - 1;
      ce.slowIce = { timer: CFG.ATTR_ICE_SLOW_DUR, mult: CFG.ATTR_ICE_SLOW_MULTS[cilv] };
    }
    lightningFlashes.push({ x1: source.x, y1: source.y, x2: ce.x, y2: ce.y, timer: 0.15, maxTimer: 0.15 });
    floater(ce.x, ce.y - ce.size, '-' + String(Math.round(chainDmg)), '#ffee40');
  }
}

function triggerExplosion(hx, hy, bulletDmg){
  var lv = weapons.explosion - 1;
  var radius  = CFG.EXPLOSION_RADII[lv] * attrRangeMult;
  var exDmg   = bulletDmg * CFG.EXPLOSION_DMG_MULTS[lv];
  explosionFlashes.push({ x: hx, y: hy, r: radius, timer: 0.30, maxTimer: 0.30 });
  var all = enemies.slice();
  if(boss !== null) all.push(boss);
  var i;
  for(i = 0; i < all.length; i++){
    var e = all[i];
    if(e.hp <= 0) continue;
    var edx = e.x - hx, edy = e.y - hy;
    var r2 = (radius + e.size * 0.5) * (radius + e.size * 0.5);
    if(edx*edx + edy*edy < r2){
      e.hp -= exDmg;
      gainSpecial(exDmg);
      if(weapons.attrFire > 0){
        var eflv = weapons.attrFire - 1;
        e.dotFire = { timer: CFG.ATTR_FIRE_DOT_DUR, dmgPerSec: exDmg * CFG.ATTR_FIRE_DOT_MULTS[eflv] };
      }
      if(weapons.attrIce > 0 && !e.isBoss){
        var eilv = weapons.attrIce - 1;
        e.slowIce = { timer: CFG.ATTR_ICE_SLOW_DUR, mult: CFG.ATTR_ICE_SLOW_MULTS[eilv] };
      }
    }
  }
}

function rebuildOrbitals(){
  orbitals = [];
  var n = weapons.orbital;
  var i;
  for(i = 0; i < n; i++){
    orbitals.push({ angle: Math.PI * 2 / (n > 0 ? n : 1) * i, hitCds: [] });
  }
}

function updateOrbitals(dt){
  var oi, ci, i;
  for(oi = 0; oi < orbitals.length; oi++){
    var orb = orbitals[oi];
    orb.angle += CFG.ORBITAL_SPEED * dt;
    var ox = cx() + Math.cos(orb.angle) * CFG.ORBITAL_RADIUS;
    var oy = cy() + Math.sin(orb.angle) * CFG.ORBITAL_RADIUS;
    for(i = orb.hitCds.length - 1; i >= 0; i--){
      orb.hitCds[i].cd -= dt;
      if(orb.hitCds[i].cd <= 0) orb.hitCds.splice(i, 1);
    }
    var combAll = enemies.slice();
    if(boss !== null) combAll.push(boss);
    for(ci = 0; ci < combAll.length; ci++){
      var e = combAll[ci];
      if(e.hp <= 0) continue;
      var onCd = false;
      for(i = 0; i < orb.hitCds.length; i++){
        if(orb.hitCds[i].e === e){ onCd = true; break; }
      }
      if(onCd) continue;
      var edx = e.x - ox, edy = e.y - oy;
      var hitR = CFG.ORBITAL_BALL_SIZE + e.size * 0.5;
      if(edx*edx + edy*edy < hitR * hitR){
        var oDmg = tower.dmg * CFG.ORBITAL_DMG_MULT;
        e.hp -= oDmg;
        gainSpecial(oDmg);
        applyAttrEffects(e, oDmg, ox, oy);
        floater(e.x, e.y - e.size, '-' + String(Math.round(oDmg)), '#40e0ff');
        burst(ox, oy, '#40e0ff', 4);
        orb.hitCds.push({ e: e, cd: CFG.ORBITAL_HIT_CD });
        if(e.hp <= 0){
          burst(e.x, e.y, e.color, e.isBoss ? 40 : 22);
          kills++; playSound('kill'); gainXP(e.xpReward); gainCoin(e.coinReward||1, e.x, e.y);
          if(e.isBoss){
            if(e.type === 'divider') spawnDividerChildren(e);
            spawnRareItem(e.x, e.y);
            boss = null; hideBossBar();
          } else {
            var oei = enemies.indexOf(e);
            if(oei !== -1) enemies.splice(oei, 1);
            if(e.splitOnDeath){
              for(var osc=0; osc<2; osc++){
                var ocHp = Math.ceil(e.maxHp * CFG.ENEMY_SPLIT_HP_RATIO);
                enemies.push({ type:'split',
                  x: e.x+(Math.random()-0.5)*12, y: e.y+(Math.random()-0.5)*12,

function rebuildSatellites(){
  satellites = [];
  var n = weapons.satellite;
  var i;
  for(i = 0; i < n; i++){
    satellites.push({ angle: Math.PI * 2 / (n > 0 ? n : 1) * i, fireTimer: 0, targetAngle: 0 });
  }
}

function updateSatellites(dt){
  if(satellites.length === 0) return;
  var satRange = Math.min(W, H) * CFG.SATELLITE_RANGE_RATIO;
  var satR = tower.range + 24;
  var combAll = enemies.slice();
  if(boss !== null) combAll.push(boss);
  var si;
  for(si = 0; si < satellites.length; si++){
    var sat = satellites[si];
    sat.fireTimer -= dt;
    var sx = cx() + Math.cos(sat.angle) * satR;
    var sy = cy() + Math.sin(sat.angle) * satR;
    /* 最近傍の敵を探す */
    var bestDist = satRange * satRange;
    var target = null;
    var ci;
    for(ci = 0; ci < combAll.length; ci++){
      var ce = combAll[ci];
      if(ce.hp <= 0) continue;
      var ddx = ce.x - sx, ddy = ce.y - sy;
      var d2 = ddx*ddx + ddy*ddy;
      if(d2 < bestDist){ bestDist = d2; target = ce; }
    }
    if(target !== null){
      var tang = Math.atan2(target.y - sy, target.x - sx);
      sat.targetAngle = tang;
    }
    if(sat.fireTimer <= 0 && target !== null){
      sat.fireTimer = CFG.SATELLITE_FIRE_INTERVAL;
      var sDmg = tower.dmg * CFG.SATELLITE_DMG_MULT;
      var sAttr = getBulletAttrColor('#ffcc44', '#ff8800');
      var pierceMax = CFG.PIERCE_LV[Math.min(weapons.pierce, CFG.PIERCE_LV.length - 1)];
      var sdLv = Math.min(4, upgradeCounts.dmg);
      bullets.push({
        x: sx, y: sy,
        vx: Math.cos(sat.targetAngle) * CFG.SATELLITE_BULLET_SPEED,
        vy: Math.sin(sat.targetAngle) * CFG.SATELLITE_BULLET_SPEED,
        life: 3.0, dmg: sDmg, pierceLeft: pierceMax,
        r: CFG.BULLET_DMG_RADII[sdLv] * 0.80,
        bcolor: sAttr.c, bglow: sAttr.g, exploded: false
      });
      playSound('fire');
    }
  }
}

function updateFields(dt){
  if(fields.length === 0) return;
  var fi, ci;
  for(fi = fields.length - 1; fi >= 0; fi--){
    var fd = fields[fi];
    fd.timer -= dt;
    if(fd.timer <= 0){ fields.splice(fi, 1); continue; }
    var combAll = enemies.slice();
    if(boss !== null) combAll.push(boss);
    for(ci = 0; ci < combAll.length; ci++){
      var e = combAll[ci];
      if(e.hp <= 0) continue;
      var fdx = e.x - fd.x, fdy = e.y - fd.y;
      if(fdx*fdx + fdy*fdy < fd.radius * fd.radius){
        var fdmg = fd.dmgPerSec * dt;
        e.hp -= fdmg;
        gainSpecial(fdmg);
        /* 減速: フィールドの slowMult で上書き(既存slowIceより強ければ更新) */
        if(!e.slowIce || e.slowIce.mult > fd.slowMult){
          e.slowIce = { timer: 0.25, mult: fd.slowMult };
        }
        if(e.hp <= 0 && !e.isBoss){
          var fei = enemies.indexOf(e);
          if(fei !== -1){
            burst(e.x, e.y, e.color, 18);
            kills++; playSound('kill'); gainXP(e.xpReward); gainCoin(e.coinReward||1, e.x, e.y);
            if(e.splitOnDeath){
              for(var fsc=0; fsc<2; fsc++){
                var fcHp = Math.ceil(e.maxHp * CFG.ENEMY_SPLIT_HP_RATIO);
                enemies.push({ type:'split',
                  x: e.x+(Math.random()-0.5)*12, y: e.y+(Math.random()-0.5)*12,
                  hp: fcHp, maxHp: fcHp, speed: e.speed*CFG.ENEMY_SPLIT_SPEED_MULT,
                  size: e.size*CFG.ENEMY_SPLIT_SIZE_RATIO, color: e.color,
                  rot: Math.random()*Math.PI*2, rotSpd: (Math.random()-0.5)*2.5,
                  dmg: e.dmg, xpReward: Math.ceil(e.xpReward*0.5), coinReward: 1,
                  splitOnDeath: false, stunTimer: 0 });
              }
              burst(e.x, e.y, e.color, 14);
            }
            if(Math.random() < CFG.DROP_HEAL_CHANCE) healItems.push({ x: e.x, y: e.y, life: 8.0 });
            if(Math.random() < CFG.DROP_RARE_CHANCE) spawnRareItem(e.x, e.y);
            enemies.splice(fei, 1);
          }
        }
      }
    }
  }
}

function buildWeaponPool(){
  var pool = [], wi, w;
  if(weapons.subTurret < 4)     pool.push('sub_turret');
  if(weapons.pierce < 3)        pool.push('pierce');
  if(weapons.orbital < 6)       pool.push('orbital');
  if(weapons.explosion < 3)     pool.push('explosion');
  if(weapons.satellite < 5)     pool.push('satellite');
  if(weapons.field < 5)         pool.push('field');

  /* 属性: 選択属性は ELEM_CHOICE_PRIORITY 倍の重みで出現 */
  var attrIds = ['attr_fire', 'attr_ice', 'attr_lightning'];
  var attrWpns = [weapons.attrFire, weapons.attrIce, weapons.attrLightning];
  var chosenId = chosenElement === 'fire' ? 'attr_fire' :
                 chosenElement === 'ice'  ? 'attr_ice'  :
                 chosenElement === 'lightning' ? 'attr_lightning' : null;
  for(wi = 0; wi < attrIds.length; wi++){
    if(attrWpns[wi] < 3){
      var wt = (attrIds[wi] === chosenId) ? CFG.ELEM_CHOICE_PRIORITY : 1;
      for(w = 0; w < wt; w++) pool.push(attrIds[wi]);
    }
  }
  return pool;
}

/* =====================================================================
   更新ループ
===================================================================== */
var lastTime = 0;
var pendingSteps = 0; /* 打ち切り持ち越し分 */

function loop(t){
  requestAnimationFrame(loop);
  var dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;

  if(STATE === 'play'){
    var mult  = CFG.SPEED_STEPS[settings.speedIdx];
    var subDt = CFG.SPEED_SUBSTEP_DT; /* 固定1/60秒 */
    /* 今フレーム分を追加、溜まりすぎ上限はmult×LAG */
    pendingSteps += mult;
    var cap = mult * CFG.SPEED_SUBSTEP_MAX_LAG;
    if(pendingSteps > cap) pendingSteps = cap;

    var t0 = performance.now();
    while(pendingSteps > 0){
      update(subDt);
      pendingSteps--;
      /* ポーズに入ったら即停止(levelup等) */
      if(STATE !== 'play'){ pendingSteps = 0; break; }
      /* 時間バジェット超過で打ち切り、残りは次フレームへ */
      if(performance.now() - t0 > CFG.SPEED_BUDGET_MS) break;
    }

    /* 演出タイマーは倍速に無関係、等倍で進める */
    if(flashTimer > 0){ flashTimer -= dt; }
    if(barrierBreakTimer > 0){ barrierBreakTimer -= dt; if(barrierBreakTimer < 0) barrierBreakTimer = 0; }
    /* サウンドスロットルも実時間 */
    if(shootSoundTimer > 0) shootSoundTimer -= dt;
    if(hitSoundTimer > 0) hitSoundTimer -= dt;
    if(coinSoundTimer > 0) coinSoundTimer -= dt;
    if(killSoundTimer > 0) killSoundTimer -= dt;
    /* 警告タイマーも実時間(倍速無関係) */
    if(warningTimer > 0){
      warningTimer -= dt;
      if(warningTimer <= 0 && bossSpawnFn !== null){
        var fn = bossSpawnFn; bossSpawnFn = null; fn();
      }
    }
    /* 新敵告知タイマー(軽量・ゲーム継続) */
    if(newEnemyAlert !== null){
      newEnemyAlert.timer -= dt;
      if(newEnemyAlert.timer <= 0) newEnemyAlert = null;
    }
    if(shakeTimer > 0){
      shakeTimer -= dt;
      shakeX = (Math.random() - 0.5) * 2 * shakeMag;
      shakeY = (Math.random() - 0.5) * 2 * shakeMag;
    } else { shakeX = 0; shakeY = 0; }
  } else {
    pendingSteps = 0;
  }
  draw(t / 1000, dt);
}

function update(dt){
  /* スポーン */
  if(spawnQueue > 0){
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnEnemy();
      spawnQueue--;
      var interval = CFG.WAVE_SPAWN_INTERVAL_BASE - wave * 0.06;
      spawnTimer = Math.max(CFG.WAVE_SPAWN_INTERVAL_MIN, interval);
    }
  }

  /* 敵移動 */
  var i, e;
  for(i = enemies.length - 1; i >= 0; i--){
    e = enemies[i];

    /* --- 前フレームで弾/連鎖/爆発により死亡したものを清算 --- */
    if(e.hp <= 0){
      burst(e.x, e.y, e.color, 22);
      kills++; playSound('kill'); gainXP(e.xpReward); gainCoin(e.coinReward||1, e.x, e.y);
      enemies.splice(i, 1);
      if(e.splitOnDeath){
        var mtsc;
        for(mtsc=0; mtsc<2; mtsc++){
          var mtHp = Math.ceil(e.maxHp * CFG.ENEMY_SPLIT_HP_RATIO);
          enemies.push({ type:'split',
            x: e.x+(Math.random()-0.5)*12, y: e.y+(Math.random()-0.5)*12,
            hp: mtHp, maxHp: mtHp, speed: e.speed*CFG.ENEMY_SPLIT_SPEED_MULT,
            size: e.size*CFG.ENEMY_SPLIT_SIZE_RATIO, color: e.color,
            rot: Math.random()*Math.PI*2, rotSpd: (Math.random()-0.5)*2.5,
            dmg: e.dmg, xpReward: Math.ceil(e.xpReward*0.5), coinReward: 1,
            splitOnDeath: false, stunTimer: 0 });
        }
        burst(e.x, e.y, e.color, 18);
      }
      if(Math.random() < CFG.DROP_HEAL_CHANCE) healItems.push({ x: e.x, y: e.y, life: 8.0 });
      if(Math.random() < CFG.DROP_RARE_CHANCE) spawnRareItem(e.x, e.y);
      continue;
    }

    /* --- 属性タイマー --- */
    if(e.slowIce){ e.slowIce.timer -= dt; if(e.slowIce.timer <= 0) e.slowIce = null; }
    if(e.dotFire){
      e.dotFire.timer -= dt;
      var dotD = e.dotFire.dmgPerSec * dt;
      e.hp -= dotD;
      gainSpecial(dotD);
      if(e.dotFire.timer <= 0) e.dotFire = null;
      if(Math.random() < 0.25 && particles.length < CFG.PARTICLE_MAX)
        particles.push({ x: e.x+(Math.random()-0.5)*e.size, y: e.y+(Math.random()-0.5)*e.size,
                         vx: (Math.random()-0.5)*40, vy: -(20+Math.random()*40),
                         life: 0.3, maxLife: 0.3, r: 2, color: '#ff8040' });
      if(e.hp <= 0){
        burst(e.x, e.y, e.color, 22);
        kills++; playSound('kill'); gainXP(e.xpReward); gainCoin(e.coinReward||1, e.x, e.y);
        enemies.splice(i, 1);
        if(e.splitOnDeath){
          var dtsc;
          for(dtsc=0; dtsc<2; dtsc++){
            var dtHp = Math.ceil(e.maxHp * CFG.ENEMY_SPLIT_HP_RATIO);
            enemies.push({ type:'split',
              x: e.x+(Math.random()-0.5)*12, y: e.y+(Math.random()-0.5)*12,
              hp: dtHp, maxHp: dtHp, speed: e.speed*CFG.ENEMY_SPLIT_SPEED_MULT,
              size: e.size*CFG.ENEMY_SPLIT_SIZE_RATIO, color: e.color,
              rot: Math.random()*Math.PI*2, rotSpd: (Math.random()-0.5)*2.5,
              dmg: e.dmg, xpReward: Math.ceil(e.xpReward*0.5), coinReward: 1,
              splitOnDeath: false, stunTimer: 0 });
          }
          burst(e.x, e.y, e.color, 18);
        }
        if(Math.random() < CFG.DROP_HEAL_CHANCE) healItems.push({ x: e.x, y: e.y, life: 8.0 });
        if(Math.random() < CFG.DROP_RARE_CHANCE) spawnRareItem(e.x, e.y);
        continue;
      }
    }

    var dx = cx() - e.x, dy = cy() - e.y;
    var d  = Math.sqrt(dx * dx + dy * dy);
    if(d < CFG.TOWER_HIT_RADIUS){
      burst(e.x, e.y, e.color, 14);
      enemies.splice(i, 1);
      if(takeDamage(e.dmg)){ endGame(false); return; }
      continue;
    }
    if(e.stunTimer > 0){
      e.stunTimer -= dt;
      e.rot += e.rotSpd * dt;
      continue;
    }
    var effSpd = e.speed * (e.slowIce ? e.slowIce.mult : 1.0);
    if(e.type === 'sniper'){
      moveSniper(e, dt);
    } else if(e.type === 'weaver'){
      moveWeaver(e, dx, dy, d, effSpd, dt);
    } else if(e.type === 'divider_child'){
      /* 分裂子ボス: 軌道周回 */
      e.orbitAngle += CFG.BOSS_DIVIDER_CHILD_WANDER * dt;
      e.x = cx() + Math.cos(e.orbitAngle) * e.orbitDist;
      e.y = cy() + Math.sin(e.orbitAngle) * e.orbitDist;
      e.rot += e.rotSpd * dt;
    } else {
      /* 通常移動(赤・オレンジ・分裂体) */
      e.x  += dx / d * effSpd * dt;
      e.y  += dy / d * effSpd * dt;
      e.rot += e.rotSpd * dt;
    }
  }

  /* 戦闘対象リスト(enemies + boss)を毎フレーム構築 */
  var combatants = enemies.slice();
  if(boss !== null) combatants.push(boss);

  /* ターゲット選択 */
  var target = null, best = 1e9;
  for(i = 0; i < combatants.length; i++){
    var ct0 = combatants[i];
    var cdx = ct0.x - cx(), cdy = ct0.y - cy();
    var cdd = Math.sqrt(cdx * cdx + cdy * cdy);
    if(cdd < tower.range && cdd < best){ best = cdd; target = ct0; }
  }

  if(target){
    var ta   = Math.atan2(target.y - cy(), target.x - cx());
    var diff = ta - turretAngle;
    while(diff >  Math.PI) diff -= Math.PI * 2;
    while(diff < -Math.PI) diff += Math.PI * 2;
    turretAngle += diff * Math.min(1, dt * 10);

    fireTimer -= dt;
    if(fireTimer <= 0){
      fireTimer = tower.fireInterval;
      var pierceMax = CFG.PIERCE_LV[Math.min(weapons.pierce, CFG.PIERCE_LV.length - 1)];
      var streamCount = Math.min(4, upgradeCounts.rate + 1);
      var dmgLv = Math.min(4, upgradeCounts.dmg);
      var bRadius = CFG.BULLET_DMG_RADII[dmgLv];
      var bColor  = CFG.BULLET_DMG_COLORS[dmgLv];
      var bGlow   = CFG.BULLET_DMG_GLOWS[dmgLv];
      var spreads = CFG.BULLET_STREAM_SPREADS[streamCount - 1];
      var bDmg    = tower.dmg / streamCount;
      var bAttr = getBulletAttrColor(bColor, bGlow);
      for(var ssi = 0; ssi < streamCount; ssi++){
        var ssa = turretAngle + spreads[ssi];
        bullets.push({
          x: cx() + Math.cos(ssa) * (CFG.TOWER_HEX_R_OUTER + 6),
          y: cy() + Math.sin(ssa) * (CFG.TOWER_HEX_R_OUTER + 6),
          vx: Math.cos(ssa) * tower.bulletSpeed,
          vy: Math.sin(ssa) * tower.bulletSpeed,
          life: CFG.BULLET_LIFE, dmg: bDmg, pierceLeft: pierceMax,
          r: bRadius, bcolor: bAttr.c, bglow: bAttr.g, exploded: false
        });
      }
      playSound('shoot');
    }
  }

  /* 弾更新 + 全戦闘対象への当たり判定 */
  for(i = bullets.length - 1; i >= 0; i--){
    var b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    /* x5以上では弾トレイルも間引き */
    var trailChance = (settings.speedIdx >= CFG.SPEED_PARTICLE_THRESH)
      ? CFG.BULLET_TRAIL * CFG.SPEED_PARTICLE_RATIO : CFG.BULLET_TRAIL;
    if(Math.random() < trailChance){
      if(particles.length < CFG.PARTICLE_MAX)
        particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.22, maxLife: 0.22, r: 2, color: '#9adfff' });
    }
    var depleted = false;
    for(var j = combatants.length - 1; j >= 0; j--){
      var ct = combatants[j];
      var hx = b.x - ct.x, hy = b.y - ct.y;
      if(Math.abs(hx) < ct.size * 0.75 && Math.abs(hy) < ct.size * 0.75){
        var bdmg = b.dmg !== undefined ? b.dmg : tower.dmg;
        ct.hp -= bdmg;
        gainSpecial(bdmg);
        playSound('hit');
        floater(ct.x, ct.y - ct.size, String(Math.round(bdmg)), ct.isBoss ? '#4df3ff' : '#ffef9a');
        burst(b.x, b.y, ct.color, ct.isBoss ? 4 : 6);
        applyAttrEffects(ct, bdmg, b.x, b.y);
        if(!b.exploded && weapons.explosion > 0){ b.exploded = true; triggerExplosion(b.x, b.y, bdmg); }
        b.pierceLeft--;
        if(ct.hp <= 0){
          burst(ct.x, ct.y, ct.color, ct.isBoss ? 40 : 22);
          kills++;
          playSound('kill');
          gainXP(ct.xpReward);
          gainCoin(ct.coinReward || 1, ct.x, ct.y);
          if(ct.isBoss){
            if(ct.type === 'divider'){ spawnDividerChildren(ct); }
            spawnRareItem(ct.x, ct.y);
            boss = null; hideBossBar();
          } else {
            var ei = enemies.indexOf(ct);
            if(ei !== -1) enemies.splice(ei, 1);
            /* 分裂体: 子を2体スポーン(combatantsにも追加で貫通弾対応) */
            if(ct.splitOnDeath){
              for(var sc2 = 0; sc2 < 2; sc2++){
                var cHp = Math.ceil(ct.maxHp * CFG.ENEMY_SPLIT_HP_RATIO);
                var child = {
                  type: 'split',
                  x: ct.x + (Math.random() - 0.5) * 12,
                  y: ct.y + (Math.random() - 0.5) * 12,
                  hp: cHp, maxHp: cHp,
                  speed: ct.speed * CFG.ENEMY_SPLIT_SPEED_MULT,
                  size: ct.size * CFG.ENEMY_SPLIT_SIZE_RATIO,
                  color: ct.color,
                  rot: Math.random() * Math.PI * 2,
                  rotSpd: (Math.random() - 0.5) * 2.5,
                  dmg: ct.dmg,
                  xpReward: Math.ceil(ct.xpReward * 0.5),
                  coinReward: 1,
                  splitOnDeath: false, stunTimer: 0
                };
                enemies.push(child);
                combatants.push(child);
              }
              burst(ct.x, ct.y, ct.color, 18);
            }
            /* 回復アイテムドロップ */
            if(Math.random() < CFG.DROP_HEAL_CHANCE){
              healItems.push({ x: ct.x, y: ct.y, life: 8.0 });
            }
          }
          combatants.splice(j, 1);
        }
        if(b.pierceLeft <= 0){ depleted = true; break; }
      }
    }
    /* 弾が回復アイテムに触れたら取得 */
    if(!depleted){
      for(var hi2 = healItems.length - 1; hi2 >= 0; hi2--){
        var hitem = healItems[hi2];
        var bhx = b.x - hitem.x, bhy = b.y - hitem.y;
        if(Math.abs(bhx) < 14 && Math.abs(bhy) < 14){
          tower.hp = Math.min(tower.maxHp, tower.hp + CFG.DROP_HEAL_AMOUNT);
          floater(hitem.x, hitem.y - 10, '+' + CFG.DROP_HEAL_AMOUNT + ' HP', '#3ddc74');
          healItems.splice(hi2, 1);
          break;
        }
      }
    }
    if(depleted || b.life <= 0) bullets.splice(i, 1);
  }

  /* ミサイル: 連射Lv4 or ダメージLv5で解放 */
  var missileActive = (upgradeCounts.rate >= CFG.MISSILE_UNLOCK_RATE || upgradeCounts.dmg >= CFG.MISSILE_UNLOCK_DMG);
  if(missileActive){
    missileTimer -= dt;
    if(missileTimer <= 0){
      missileTimer = CFG.MISSILE_INTERVAL;
      var mComb = enemies.slice();
      if(boss !== null) mComb.push(boss);
      if(mComb.length > 0){
        var mBestD = 1e9, mTarget0 = null;
        for(var msi = 0; msi < mComb.length; msi++){
          var mct = mComb[msi];
          var mddx = mct.x - cx(), mddy = mct.y - cy();
          var mdd = mddx * mddx + mddy * mddy;
          if(mdd < mBestD){ mBestD = mdd; mTarget0 = mct; }
        }
        if(mTarget0){
          var mAng = Math.atan2(mTarget0.y - cy(), mTarget0.x - cx());
          missiles.push({
            x: cx() + Math.cos(mAng) * (CFG.TOWER_HEX_R_OUTER + 6),
            y: cy() + Math.sin(mAng) * (CFG.TOWER_HEX_R_OUTER + 6),
            vx: Math.cos(mAng) * CFG.MISSILE_SPEED,
            vy: Math.sin(mAng) * CFG.MISSILE_SPEED,
            life: CFG.MISSILE_LIFE
          });
        }
      }
    }
  } else {
    missileTimer = 0;
  }

  /* ミサイル更新 */
  if(missiles.length > 0){
    var mC2 = enemies.slice();
    if(boss !== null) mC2.push(boss);
    for(var mi2 = missiles.length - 1; mi2 >= 0; mi2--){
      var ml = missiles[mi2];
      if(mC2.length > 0){
        var mNBest = 1e9, mNear = null;
        for(var mn = 0; mn < mC2.length; mn++){
          var mnc = mC2[mn];
          var mndx = mnc.x - ml.x, mndy = mnc.y - ml.y;
          var mnd = mndx * mndx + mndy * mndy;
          if(mnd < mNBest){ mNBest = mnd; mNear = mnc; }
        }
        if(mNear){
          var mtAng = Math.atan2(mNear.y - ml.y, mNear.x - ml.x);
          var mcAng = Math.atan2(ml.vy, ml.vx);
          var mdiff = mtAng - mcAng;
          while(mdiff >  Math.PI) mdiff -= Math.PI * 2;
          while(mdiff < -Math.PI) mdiff += Math.PI * 2;
          var mTurn = CFG.MISSILE_HOMING * dt;
          if(mdiff > 0){ mcAng += (mdiff < mTurn ? mdiff : mTurn); }
          else          { mcAng += (mdiff > -mTurn ? mdiff : -mTurn); }
          var mSpd = Math.sqrt(ml.vx * ml.vx + ml.vy * ml.vy);
          ml.vx = Math.cos(mcAng) * mSpd;
          ml.vy = Math.sin(mcAng) * mSpd;
        }
      }
      ml.x += ml.vx * dt; ml.y += ml.vy * dt; ml.life -= dt;
      if(Math.random() < 0.5 && particles.length < CFG.PARTICLE_MAX){
        particles.push({ x:ml.x, y:ml.y, vx:0, vy:0, life:0.18, maxLife:0.18, r:3, color:'#ffaa40' });
      }
      var mHit = false;
      for(var mk2 = mC2.length - 1; mk2 >= 0; mk2--){
        var mc4 = mC2[mk2];
        var mhx = ml.x - mc4.x, mhy = ml.y - mc4.y;
        var mhR = mc4.size + CFG.MISSILE_SIZE;
        if(mhx * mhx + mhy * mhy < mhR * mhR){
          var mDmg = tower.dmg * CFG.MISSILE_DMG_MULT;
          mc4.hp -= mDmg;
          gainSpecial(mDmg);
          floater(mc4.x, mc4.y - mc4.size, String(Math.round(mDmg)), '#ffaa40');
          burst(ml.x, ml.y, '#ffaa40', 14);
          if(mc4.hp <= 0){
            burst(mc4.x, mc4.y, mc4.color, mc4.isBoss ? 40 : 22);
            kills++; playSound('kill'); gainXP(mc4.xpReward); gainCoin(mc4.coinReward || 1, mc4.x, mc4.y);
            if(mc4.isBoss){
              if(mc4.type === 'divider'){ spawnDividerChildren(mc4); }
              spawnRareItem(mc4.x, mc4.y);
              boss = null; hideBossBar();
            } else {
              var mEi = enemies.indexOf(mc4);
              if(mEi !== -1) enemies.splice(mEi, 1);
              if(mc4.splitOnDeath){
                for(var msc2 = 0; msc2 < 2; msc2++){
                  var mCHp2 = Math.ceil(mc4.maxHp * CFG.ENEMY_SPLIT_HP_RATIO);
                  var mChild = {
                    type: 'split',
                    x: mc4.x + (Math.random() - 0.5) * 12,
                    y: mc4.y + (Math.random() - 0.5) * 12,
                    hp: mCHp2, maxHp: mCHp2,
                    speed: mc4.speed * CFG.ENEMY_SPLIT_SPEED_MULT,
                    size: mc4.size * CFG.ENEMY_SPLIT_SIZE_RATIO,
                    color: mc4.color, rot: Math.random() * Math.PI * 2,
                    rotSpd: (Math.random() - 0.5) * 2.5, dmg: mc4.dmg,
                    xpReward: Math.ceil(mc4.xpReward * 0.5), coinReward: 1,
                    splitOnDeath: false, stunTimer: 0
                  };
                  enemies.push(mChild); mC2.push(mChild);
                }
                burst(mc4.x, mc4.y, mc4.color, 18);
              }
              if(Math.random() < CFG.DROP_HEAL_CHANCE){
                healItems.push({ x: mc4.x, y: mc4.y, life: 8.0 });
              }
            }
            mC2.splice(mk2, 1);
          }
          mHit = true; break;
        }
      }
      if(mHit || ml.life <= 0) missiles.splice(mi2, 1);
    }
  }

  /* 回復アイテム: タワーへ漂い + タワー接触で取得 */
  for(i = healItems.length - 1; i >= 0; i--){
    var hit = healItems[i];
    var hdx = cx() - hit.x, hdy = cy() - hit.y;
    var hdd = Math.sqrt(hdx * hdx + hdy * hdy);
    if(hdd > 1){
      hit.x += hdx / hdd * CFG.DROP_SPEED * dt;
      hit.y += hdy / hdd * CFG.DROP_SPEED * dt;
    }
    hit.life -= dt;
    if(hdd < CFG.TOWER_HIT_RADIUS + 12){
      tower.hp = Math.min(tower.maxHp, tower.hp + CFG.DROP_HEAL_AMOUNT);
      floater(hit.x, hit.y - 10, '+' + CFG.DROP_HEAL_AMOUNT + ' HP', '#3ddc74');
      healItems.splice(i, 1);
    } else if(hit.life <= 0){
      healItems.splice(i, 1);
    }
  }

  /* レアアイテム: タワーへ漂い + タワー接触で取得 */
  for(i = rareItems.length - 1; i >= 0; i--){
    var ri = rareItems[i];
    var rdx = cx() - ri.x, rdy = cy() - ri.y;
    var rdd = Math.sqrt(rdx * rdx + rdy * rdy);
    if(rdd > 1){
      ri.x += rdx / rdd * CFG.DROP_RARE_SPEED * dt;
      ri.y += rdy / rdd * CFG.DROP_RARE_SPEED * dt;
    }
    ri.life -= dt;
    if(rdd < CFG.TOWER_HIT_RADIUS + 14){
      applyRareEffect(ri.effect, ri.x, ri.y);
      rareItems.splice(i, 1);
    } else if(ri.life <= 0){
      rareItems.splice(i, 1);
    }
  }

  /* パーティクル */
  for(i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }

  /* フローター */
  for(i = floaters.length - 1; i >= 0; i--){
    var f = floaters[i];
    f.y -= 44 * dt; f.life -= dt;
    if(f.life <= 0) floaters.splice(i, 1);
  }

  /* 敵弾(サモナー) */
  for(i = enemyBullets.length - 1; i >= 0; i--){
    var eb = enemyBullets[i];
    eb.x += eb.vx * dt; eb.y += eb.vy * dt; eb.life -= dt;
    var etx = eb.x - cx(), ety = eb.y - cy();
    if(etx * etx + ety * ety < CFG.TOWER_HIT_RADIUS * CFG.TOWER_HIT_RADIUS){
      burst(cx(), cy(), eb.color || '#c84dff', 8);
      enemyBullets.splice(i, 1);
      if(takeDamage(eb.dmg)){ endGame(false); return; }
    } else if(eb.life <= 0 || eb.x < -120 || eb.x > W + 120 || eb.y < -120 || eb.y > H + 120){
      enemyBullets.splice(i, 1);
    }
  }

  /* ボス処理 */
  if(boss !== null) updateBoss(dt);

  /* サブ砲台発射 */
  if(weapons.subTurret > 0) updateSubTurrets(dt);

  /* オービタル */
  if(orbitals.length > 0) updateOrbitals(dt);
  if(weapons.satellite > 0) updateSatellites(dt);
  updateFields(dt);

  /* フラッシュタイマー */
  var lfi, efi;
  for(lfi = lightningFlashes.length - 1; lfi >= 0; lfi--){
    lightningFlashes[lfi].timer -= dt;
    if(lightningFlashes[lfi].timer <= 0) lightningFlashes.splice(lfi, 1);
  }
  for(efi = explosionFlashes.length - 1; efi >= 0; efi--){
    explosionFlashes[efi].timer -= dt;
    if(explosionFlashes[efi].timer <= 0) explosionFlashes.splice(efi, 1);
  }

  /* 必殺クールダウン */
  if(specials.pulse.cd    > 0){ specials.pulse.cd    -= dt; if(specials.pulse.cd    < 0) specials.pulse.cd    = 0; }
  if(specials.railgun.cd  > 0){ specials.railgun.cd  -= dt; if(specials.railgun.cd  < 0) specials.railgun.cd  = 0; }
  if(specials.overdrive.cd> 0){ specials.overdrive.cd -= dt; if(specials.overdrive.cd < 0) specials.overdrive.cd = 0; }

  /* OVERDRIVE 残時間 */
  if(overdriveTimer > 0){
    overdriveTimer -= dt;
    if(overdriveTimer <= 0){
      overdriveTimer = 0;
      tower.fireInterval = overdriveSavedInterval;
      tower.dmg          = overdriveSavedDmg;
      tower.range        = overdriveSavedRange;
      specials.overdrive.cd = CFG.OVERDRIVE_CD;
    }
  }

  /* BEAMアクティブ: ダメージ判定 + タイマー */
  if(beamTimer > 0){
    beamTimer -= dt;
    if(beamTimer <= 0){
      beamTimer = 0;
      specials.beam.cd = CFG.BEAM_CD;
    } else {
      var bcos = Math.cos(beamAngle), bsin = Math.sin(beamAngle);
      var bAll = enemies.slice();
      if(boss !== null) bAll.push(boss);
      var bi3;
      for(bi3 = 0; bi3 < bAll.length; bi3++){
        var btgt = bAll[bi3];
        /* 点→直線距離でビーム当たり判定(タワーから beamAngle 方向の無限線) */
        var bdx3 = btgt.x - cx(), bdy3 = btgt.y - cy();
        var bproj = bdx3 * bcos + bdy3 * bsin; /* 射影距離(正=ビーム前方) */
        var bperp = Math.abs(-bdx3 * bsin + bdy3 * bcos);
        if(bproj > 0 && bperp < CFG.BEAM_WIDTH){
          var bDmg3 = CFG.BEAM_DMG_PER_SEC * dt;
          btgt.hp -= bDmg3;
          gainSpecial(bDmg3 * 0.1);
          applyAttrEffects(btgt, bDmg3, cx() + bcos * bproj, cy() + bsin * bproj);
        }
      }
    }
  } else if(specials.beam.cd > 0){
    specials.beam.cd -= dt;
    if(specials.beam.cd < 0) specials.beam.cd = 0;
  }

  /* レールガンビームフェード */
  if(railgunCharge){
    railgunCharge.timer += dt;
    if(railgunCharge.timer >= railgunCharge.maxTimer){
      executeRailgunBeam(railgunCharge.ang);
      railgunCharge = null;
    }
  }
  if(railgunBeam){ railgunBeam.timer -= dt; if(railgunBeam.timer <= 0) railgunBeam = null; }

  /* 必殺HUD更新(0.25秒ごと) */
  specialHudTimer -= dt;
  if(specialHudTimer <= 0){ specialHudTimer = 0.25; updateSpecialHud(); }

  /* ウェーブクリア判定 — warningTimer>0中は保留 */
  if(spawnQueue === 0 && enemies.length === 0 && boss === null && warningTimer <= 0 && STATE === 'play'){
    waveComplete();
  }
}

/* =====================================================================
   スナイパー移動
===================================================================== */
function moveSniper(e, dt){
  var snpSpd = CFG.ENEMY_SNIPER_MOVE_SPEED * (e.slowIce ? e.slowIce.mult : 1.0);
  if(e.phase === 'seek'){
    var tx = e.targetX - e.x, ty = e.targetY - e.y;
    var td = Math.sqrt(tx * tx + ty * ty);
    if(td < 6){
      e.phase = 'shoot';
      e.shotTimer = CFG.ENEMY_SNIPER_SHOT_INTERVAL;
      e.repositionTimer = CFG.ENEMY_SNIPER_REPOS_INTERVAL;
    } else {
      e.x += tx / td * snpSpd * dt;
      e.y += ty / td * snpSpd * dt;
    }
    e.rot += e.rotSpd * dt;
  } else {
    /* shoot: タワーへ向いて射撃 */
    e.rot = Math.atan2(cy() - e.y, cx() - e.x) - Math.PI * 0.5;
    e.repositionTimer -= dt;
    e.shotTimer -= dt;
    if(e.shotTimer <= 0){
      var ang = Math.atan2(cy() - e.y, cx() - e.x);
      enemyBullets.push({
        x: e.x, y: e.y,
        vx: Math.cos(ang) * CFG.ENEMY_SNIPER_SHOT_SPEED,
        vy: Math.sin(ang) * CFG.ENEMY_SNIPER_SHOT_SPEED,
        life: 4.0, dmg: CFG.ENEMY_SNIPER_SHOT_DMG,
        color: CFG.ENEMY_SNIPER_COLOR, r: 5
      });
      e.shotTimer = CFG.ENEMY_SNIPER_SHOT_INTERVAL;
    }
    if(e.repositionTimer <= 0){
      var newAng = Math.random() * Math.PI * 2;
      e.targetX = cx() + Math.cos(newAng) * e.standoffDist;
      e.targetY = cy() + Math.sin(newAng) * e.standoffDist;
      e.phase = 'seek';
    }
  }
}

/* =====================================================================
   ウィーバー移動
===================================================================== */
function moveWeaver(e, dx, dy, d, effSpd, dt){
  var nx = dx / d, ny = dy / d;
  var px = -ny, py = nx;
  e.sinePhase += CFG.ENEMY_WEAVER_FREQ * dt;
  var sineV = CFG.ENEMY_WEAVER_AMP * Math.sin(e.sinePhase);
  e.x += (nx * effSpd + px * sineV) * dt;
  e.y += (ny * effSpd + py * sineV) * dt;
  e.rot += e.rotSpd * dt;
}
