<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HEXA DEFENSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#05090f; touch-action:none;
             font-family:'Rajdhani','Chakra Petch',-apple-system,sans-serif; }
#game { display:block; width:100%; height:100%; }
.fx { position:fixed; inset:0; pointer-events:none; z-index:5; }
.scanlines { background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 3px,rgba(10,20,40,0.13) 4px); }
.vignette { background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 45%,rgba(2,5,12,0.72) 100%); }
#ui { position:fixed; inset:0; pointer-events:none; z-index:10; color:#d8ecff; }

/* HUD */
.hud { position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); left:0; width:100%;
       padding:0 14px; display:flex; justify-content:space-between; align-items:flex-start; }
.panel { background:linear-gradient(180deg,rgba(10,24,44,0.88),rgba(6,14,28,0.88));
         border:1px solid rgba(77,243,255,0.35);
         clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
         padding:8px 16px 7px; box-shadow:0 0 18px rgba(77,243,255,0.12),inset 0 0 24px rgba(77,243,255,0.05); }
.wave-label { font-family:'Chakra Petch',sans-serif; font-size:10px; letter-spacing:3px; color:rgba(120,200,235,0.75); }
.wave-num { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:24px; letter-spacing:1px;
            color:#eaffff; text-shadow:0 0 14px rgba(77,243,255,0.8); line-height:1; }
.wave-num small { font-size:13px; color:rgba(140,210,240,0.7); }
.hud-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }

/* XP bar */
.xpwrap { position:absolute; top:calc(env(safe-area-inset-top,0px) + 76px); left:50%; transform:translateX(-50%);
          width:min(62vw,300px); }
.xpbar { height:5px; background:rgba(20,40,66,0.9); border:1px solid rgba(77,243,255,0.25);
         clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%); overflow:hidden; }
.xpfill { height:100%; width:0%; background:linear-gradient(90deg,#2b9fff,#4df3ff);
          box-shadow:0 0 12px rgba(77,243,255,0.9); transition:width 0.3s; }
.xplabel { text-align:center; font-family:'Chakra Petch',sans-serif; font-size:9px; letter-spacing:3px;
           color:rgba(120,200,235,0.6); margin-top:4px; }

/* 必殺ボタン */
#specialBtn { pointer-events:auto; position:absolute;
              bottom:calc(env(safe-area-inset-bottom,0px) + 24px); left:50%; transform:translateX(-50%);
              width:140px; height:52px; border:none; cursor:pointer;
              font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; letter-spacing:4px;
              color:rgba(140,200,255,0.5);
              background:linear-gradient(180deg,rgba(10,24,44,0.92),rgba(6,14,28,0.92));
              clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
              border-top:1px solid rgba(77,243,255,0.2); border-bottom:1px solid rgba(77,243,255,0.2);
              display:none; }
#specialBtn.ready { color:#eaffff; border-color:rgba(77,243,255,0.8);
                    box-shadow:0 0 28px rgba(77,243,255,0.55),0 0 60px rgba(77,243,255,0.25);
                    animation:sbpulse 1.2s ease-in-out infinite; }
@keyframes sbpulse { 0%,100%{box-shadow:0 0 20px rgba(77,243,255,0.4);} 50%{box-shadow:0 0 44px rgba(77,243,255,0.85);} }
.sb-gauge { position:absolute; bottom:2px; left:4px; right:4px; height:3px;
            background:rgba(77,243,255,0.15); }
.sb-fill { height:100%; width:0%; background:linear-gradient(90deg,#2b9fff,#4df3ff);
           box-shadow:0 0 8px rgba(77,243,255,0.8); transition:width 0.1s; }

/* screens */
.screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; background:rgba(3,7,15,0.65);
          backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
          opacity:0; visibility:hidden; transition:opacity 0.3s; pointer-events:none; }
.screen.show { opacity:1; visibility:visible; pointer-events:auto; }

/* タイトル */
.logo { position:relative; font-family:'Chakra Petch',sans-serif; font-weight:700;
        font-size:clamp(40px,11vw,64px); letter-spacing:8px; line-height:1.05;
        text-align:center; color:#f2fdff;
        text-shadow:0 0 30px rgba(77,243,255,0.9),0 0 70px rgba(77,243,255,0.4); }
.logo::before { content:attr(data-t); position:absolute; inset:0; color:rgba(255,61,129,0.85);
                transform:translate(-2.5px,1.5px); z-index:-1; filter:blur(0.6px); }
.logo::after { content:attr(data-t); position:absolute; inset:0; color:rgba(77,243,255,0.85);
               transform:translate(2.5px,-1.5px); z-index:-2; filter:blur(0.6px); }
.logo-sub { margin-top:14px; font-family:'Chakra Petch',sans-serif; font-size:11px; letter-spacing:6px;
            color:rgba(140,215,245,0.85); }
.logo-rule { width:180px; height:1px; margin:22px 0 30px;
             background:linear-gradient(90deg,rgba(77,243,255,0),rgba(77,243,255,0.9),rgba(77,243,255,0)); }
.play-btn { pointer-events:auto; border:none; cursor:pointer;
            font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:22px; letter-spacing:5px;
            color:#03140a; padding:20px 66px;
            background:linear-gradient(180deg,#66ff9c,#25c95c);
            clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
            box-shadow:0 0 34px rgba(60,235,120,0.65); animation:btnbreath 2.4s ease-in-out infinite; }
@keyframes btnbreath { 0%,100%{box-shadow:0 0 24px rgba(60,235,120,0.45);} 50%{box-shadow:0 0 48px rgba(60,235,120,0.85);} }
.title-meta { margin-top:34px; display:flex; gap:28px; font-family:'Chakra Petch',sans-serif; }
.meta-item { text-align:center; }
.meta-item .v { font-size:20px; font-weight:700; color:#ffd257; text-shadow:0 0 12px rgba(255,210,87,0.6); }
.meta-item .k { font-size:9px; letter-spacing:3px; color:rgba(130,200,235,0.6); margin-top:3px; }

/* レベルアップ */
.lv-head { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:22px; letter-spacing:6px;
           color:#eaffff; text-shadow:0 0 20px rgba(77,243,255,0.8); }
.lv-sub { font-size:12px; letter-spacing:3px; color:rgba(140,210,240,0.7); margin:8px 0 26px;
          font-family:'Chakra Petch',sans-serif; }
.cards { display:flex; gap:12px; padding:0 12px; }
.card { pointer-events:auto; width:108px; padding:0 0 14px; cursor:pointer; position:relative;
        background:linear-gradient(180deg,rgba(14,30,54,0.96),rgba(8,16,32,0.96));
        border:1px solid rgba(77,243,255,0.4);
        clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
        transition:transform 0.15s; }
.card:active { transform:scale(0.96); }
.card .band { height:4px; background:linear-gradient(90deg,#2b9fff,#4df3ff); box-shadow:0 0 10px rgba(77,243,255,0.8); }
.card .tag { position:absolute; top:10px; right:8px; font-family:'Chakra Petch',sans-serif;
             font-size:8px; letter-spacing:2px; color:rgba(130,200,235,0.55); }
.card .icon { margin:20px auto 10px; width:44px; height:44px; display:flex; align-items:center;
              justify-content:center; font-size:24px;
              background:rgba(77,243,255,0.08); border:1px solid rgba(77,243,255,0.3);
              clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }
.card .cname { text-align:center; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; color:#eaffff; }
.card .cdesc { text-align:center; font-size:11px; color:rgba(150,200,235,0.75); margin-top:5px; line-height:1.5; padding:0 6px; }

/* ボスHPバー — XPバー(76px〜99px)の下に配置 */
#bossBar { position:absolute; top:calc(env(safe-area-inset-top,0px) + 106px); left:50%; transform:translateX(-50%);
           width:min(70vw,260px); display:none; }
.boss-label { font-family:'Chakra Petch',sans-serif; font-size:9px; letter-spacing:4px;
              color:rgba(255,100,50,0.9); text-align:center; margin-bottom:3px; }
.boss-track { height:7px; background:rgba(20,40,66,0.9); border:1px solid rgba(77,243,255,0.35);
              clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%); overflow:hidden; }
.boss-fill { height:100%; width:100%; background:linear-gradient(90deg,#4df3ff,#ff3d81);
             box-shadow:0 0 10px rgba(77,243,255,0.7); transition:width 0.1s; }

/* 武器報酬画面 */
.wpn-head { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:20px; letter-spacing:5px;
            color:#ffd257; text-shadow:0 0 20px rgba(255,210,87,0.8); }
.wpn-sub { font-size:11px; letter-spacing:3px; color:rgba(200,180,100,0.7); margin:8px 0 26px;
           font-family:'Chakra Petch',sans-serif; }
.wpn-cards { display:flex; gap:16px; padding:0 16px; }
.wpn-card { pointer-events:auto; width:130px; padding:0 0 16px; cursor:pointer; position:relative;
            background:linear-gradient(180deg,rgba(30,20,10,0.97),rgba(16,12,6,0.97));
            border:1px solid rgba(255,210,87,0.45);
            clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
            transition:transform 0.15s; }
.wpn-card:active { transform:scale(0.96); }
.wpn-card.disabled { opacity:0.38; cursor:not-allowed; pointer-events:none; }
.wpn-card .band { height:4px; background:linear-gradient(90deg,#ffd257,#ffaa00); box-shadow:0 0 10px rgba(255,210,87,0.8); }
.wpn-card .tag { position:absolute; top:10px; right:8px; font-family:'Chakra Petch',sans-serif;
                 font-size:8px; letter-spacing:2px; color:rgba(255,210,87,0.6); }
.wpn-card .icon { margin:20px auto 10px; width:48px; height:48px; display:flex; align-items:center;
                  justify-content:center; font-size:26px;
                  background:rgba(255,210,87,0.1); border:1px solid rgba(255,210,87,0.35);
                  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }
.wpn-card .cname { text-align:center; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; color:#ffd257; }
.wpn-card .cdesc { text-align:center; font-size:11px; color:rgba(200,180,100,0.8); margin-top:5px; line-height:1.5; padding:0 6px; }

/* 倍速ボタン */
#speedBtn { pointer-events:auto; display:flex; align-items:center; justify-content:center;
            font-family:'Chakra Petch',sans-serif; font-size:12px; font-weight:700; letter-spacing:3px;
            color:rgba(140,210,240,0.7);
            background:rgba(77,243,255,0.05); border:1px solid rgba(77,243,255,0.28);
            padding:7px 16px; cursor:pointer;
            clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
            box-shadow:0 0 10px rgba(77,243,255,0.08); }
#speedBtn.active { color:#eaffff; border-color:rgba(77,243,255,0.75);
                   background:rgba(77,243,255,0.14);
                   box-shadow:0 0 18px rgba(77,243,255,0.35); }

/* コインHUD */
.coin { display:flex; align-items:center; gap:7px; font-family:'Chakra Petch',sans-serif; font-weight:700;
        font-size:19px; color:#ffd257; text-shadow:0 0 12px rgba(255,210,87,0.6); }
.chex { background:#ffd257;
        clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
        box-shadow:0 0 10px rgba(255,210,87,0.9); }

/* SHOPボタン */
.store-btn { pointer-events:auto; margin-top:8px; display:flex; align-items:center; gap:6px;
             font-family:'Chakra Petch',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px;
             color:#ffd257; background:rgba(255,210,87,0.08); border:1px solid rgba(255,210,87,0.45);
             padding:8px 14px; cursor:pointer;
             clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
             box-shadow:0 0 14px rgba(255,210,87,0.2); }

/* ショップ画面 */
.store-panel { width:min(88vw,340px); background:linear-gradient(180deg,rgba(10,22,42,0.97),rgba(6,12,26,0.97));
               border:1px solid rgba(77,243,255,0.35); padding:22px 18px 18px;
               clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px); }
.store-hdr { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; }
.store-hdr .st { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:17px; letter-spacing:4px; color:#eaffff; }
.s-item { pointer-events:auto; display:flex; align-items:center; gap:12px; padding:11px 10px; cursor:pointer;
          border:1px solid rgba(77,243,255,0.15); margin-bottom:8px; background:rgba(77,243,255,0.03); }
.s-item:active { background:rgba(77,243,255,0.1); }
.s-item.s-disabled { opacity:0.4; cursor:not-allowed; pointer-events:none; }
.s-ic { width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center;
        font-size:17px; background:rgba(77,243,255,0.07); border:1px solid rgba(77,243,255,0.25);
        clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }
.s-body { flex:1; }
.s-name { font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:13px; color:#eaffff; }
.s-lv { font-size:10px; color:rgba(140,210,240,0.6); letter-spacing:1px; margin-top:2px; }
.s-price { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:15px; color:#ffd257;
           text-shadow:0 0 10px rgba(255,210,87,0.5); display:flex; align-items:center; gap:5px; }
.store-close { pointer-events:auto; margin-top:10px; width:100%; padding:12px; border:1px solid rgba(77,243,255,0.4);
               background:rgba(77,243,255,0.06); color:#9fe8ff; font-family:'Chakra Petch',sans-serif; font-weight:700;
               font-size:12px; letter-spacing:4px; cursor:pointer; }

/* タイトル追加ボタン(UPGRADE/CONTINUE/SELECT WAVE) */
.title-sub-btn { pointer-events:auto; margin-top:12px; border:none; cursor:pointer;
  font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; letter-spacing:3px;
  color:#4df3ff; padding:11px 32px; display:block;
  background:rgba(77,243,255,0.06); border:1px solid rgba(77,243,255,0.45);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
.title-sub-btn:active { background:rgba(77,243,255,0.18); }

/* メタコイン獲得表示(リザルト) */
.meta-earned { margin:6px 0 16px; font-family:'Chakra Petch',sans-serif; font-size:14px;
  letter-spacing:3px; color:#ffd257; text-align:center; text-shadow:0 0 12px rgba(255,210,87,0.6); }

/* 恒久強化パネル */
.perma-panel { width:min(90vw,360px); max-height:80vh; overflow-y:auto;
  background:linear-gradient(180deg,rgba(10,22,42,0.97),rgba(6,12,26,0.97));
  border:1px solid rgba(77,243,255,0.35); padding:20px 16px 16px;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px); }
.perma-hdr { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
.perma-title-txt { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:16px;
  letter-spacing:4px; color:#eaffff; }
.perma-meta-bal { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:14px;
  color:#ffd257; display:flex; align-items:center; gap:5px; }
.perma-row { display:flex; align-items:center; gap:10px; padding:10px 8px; cursor:pointer;
  pointer-events:auto; border:1px solid rgba(77,243,255,0.12); margin-bottom:7px;
  background:rgba(77,243,255,0.02); }
.perma-row:active { background:rgba(77,243,255,0.1); }
.perma-row.maxed { opacity:0.45; pointer-events:none; cursor:default; }
.perma-row.cant-afford { opacity:0.5; pointer-events:none; cursor:not-allowed; }
.perma-icon { width:30px; height:30px; flex:none; display:flex; align-items:center;
  justify-content:center; font-size:15px; background:rgba(77,243,255,0.07);
  border:1px solid rgba(77,243,255,0.22);
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }
.perma-body { flex:1; }
.perma-name { font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:12px; color:#eaffff; }
.perma-pips { display:flex; gap:3px; margin-top:5px; }
.perma-pip { width:14px; height:5px; background:rgba(77,243,255,0.12); border:1px solid rgba(77,243,255,0.25); }
.perma-pip.on { background:#4df3ff; box-shadow:0 0 6px rgba(77,243,255,0.8); }
.perma-price-col { font-family:'Chakra Petch',sans-serif; font-size:13px; font-weight:700;
  color:#ffd257; white-space:nowrap; display:flex; align-items:center; gap:4px; }

/* チェックポイント選択パネル */
.cp-panel { width:min(88vw,320px); background:linear-gradient(180deg,rgba(10,22,42,0.97),rgba(6,12,26,0.97));
  border:1px solid rgba(77,243,255,0.35); padding:22px 16px 16px;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px); }
.cp-title { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:14px; letter-spacing:4px;
  color:#eaffff; text-align:center; margin-bottom:16px; }
.cp-wave-btn { pointer-events:auto; display:block; width:100%; padding:13px; margin-bottom:8px; border:none;
  cursor:pointer; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; letter-spacing:3px;
  color:#eaffff; background:rgba(77,243,255,0.04); border:1px solid rgba(77,243,255,0.32);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
.cp-wave-btn:active { background:rgba(77,243,255,0.18); }

/* ポーズパネル */
.pause-panel { width:min(78vw,260px); background:linear-gradient(180deg,rgba(10,22,42,0.97),rgba(6,12,26,0.97));
  border:1px solid rgba(77,243,255,0.35); padding:26px 18px 18px; text-align:center;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px); }
.pause-title { font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:17px; letter-spacing:6px;
  color:#eaffff; margin-bottom:20px; }
.pause-btn { pointer-events:auto; display:block; width:100%; padding:13px; margin-bottom:9px; border:none;
  cursor:pointer; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; letter-spacing:3px;
  color:#eaffff; background:rgba(77,243,255,0.04); border:1px solid rgba(77,243,255,0.32);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
.pause-btn:active { background:rgba(77,243,255,0.18); }

/* ポーズボタン(HUD) */
#pauseBtn { pointer-events:auto; display:flex; align-items:center; justify-content:center;
  font-family:'Chakra Petch',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px;
  color:rgba(140,210,240,0.7); background:rgba(77,243,255,0.05); border:1px solid rgba(77,243,255,0.28);
  padding:7px 11px; cursor:pointer;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }

/* リトライ2ボタンレイアウト */
.res-actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.upgrade-btn-res { pointer-events:auto; border:none; cursor:pointer;
  font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:15px; letter-spacing:3px;
  color:#0a0400; padding:14px 32px;
  background:linear-gradient(180deg,#ffd257,#e8a000);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  box-shadow:0 0 22px rgba(255,200,60,0.5); }

/* リザルト */

/* =====================================================================
   Canvas セットアップ
===================================================================== */
var canvas = document.getElementById('game');
var ctx    = canvas.getContext('2d');
var W = 0, H = 0;
var DPR = Math.min(window.devicePixelRatio || 1, CFG.DPR_MAX);

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * DPR; canvas.height = H * DPR;
  canvas.style.width  = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function cx(){ return W / 2; }
function cy(){ return H * 0.42; }

/* 2段階カーブ: ウェーブwでの累積スケーリング量を返す */
function waveAccum(w, perWave, earlyScale, lateScale){
  var brk = CFG.WAVE_PHASE_BREAK - 1;
  var earlyW = w <= brk ? w : brk;
  var lateW = w > brk ? w - brk : 0;
  return earlyW * perWave * earlyScale + lateW * perWave * lateScale;
}

/* =====================================================================
   StorageAdapter + SaveData
===================================================================== */
function defaultSaveData(){
  return {
    version: 1,
    metaCoins: 0,
    bestWave: 0,
    totalKills: 0,
    permanentUpgrades: { dmg: 0, rate: 0, hp: 0, range: 0, coinGain: 0 },
    unlockedCheckpoints: [1],
    suspendedRun: null,
    settings: { mute: false, speedIdx: 1 }
  };
}

function migrateSave(data){
  if(!data || typeof data !== 'object') return defaultSaveData();
  var d = defaultSaveData();
  if(typeof data.metaCoins === 'number') d.metaCoins = data.metaCoins;
  if(typeof data.bestWave === 'number') d.bestWave = data.bestWave;
  if(typeof data.totalKills === 'number') d.totalKills = data.totalKills;
  if(data.permanentUpgrades && typeof data.permanentUpgrades === 'object'){
    var pu = data.permanentUpgrades;
    if(typeof pu.dmg === 'number') d.permanentUpgrades.dmg = pu.dmg;
    if(typeof pu.rate === 'number') d.permanentUpgrades.rate = pu.rate;
    if(typeof pu.hp === 'number') d.permanentUpgrades.hp = pu.hp;
    if(typeof pu.range === 'number') d.permanentUpgrades.range = pu.range;
    if(typeof pu.coinGain === 'number') d.permanentUpgrades.coinGain = pu.coinGain;
  }
  if(Array.isArray(data.unlockedCheckpoints)){
    var valid = [1, 10, 20, 30, 40];
    var cps = [];
    for(var ci = 0; ci < data.unlockedCheckpoints.length; ci++){
      for(var vi = 0; vi < valid.length; vi++){
        if(data.unlockedCheckpoints[ci] === valid[vi]){ cps.push(valid[vi]); break; }
      }
    }
    if(cps.length === 0) cps = [1];
    d.unlockedCheckpoints = cps;
  }
  if(data.suspendedRun && typeof data.suspendedRun === 'object') d.suspendedRun = data.suspendedRun;
  if(data.settings && typeof data.settings === 'object'){
    if(typeof data.settings.mute === 'boolean') d.settings.mute = data.settings.mute;
    if(typeof data.settings.speedIdx === 'number' &&
       data.settings.speedIdx >= 0 && data.settings.speedIdx < CFG.SPEED_STEPS.length){
      d.settings.speedIdx = data.settings.speedIdx;
    }
  }
  d.version = 1;
  return d;
}

function LocalStorageAdapter(){}
LocalStorageAdapter.prototype.load = function(){
  try {
    var raw = localStorage.getItem('hd_save');
    if(raw) return migrateSave(JSON.parse(raw));
    /* 旧キー(v0)からのマイグレーション */
    var oldBest = localStorage.getItem('hd_best_wave');
    var oldSet  = localStorage.getItem('hd_settings');
    if(oldBest || oldSet){
      var d = defaultSaveData();
      if(oldBest) d.bestWave = parseInt(oldBest, 10) || 0;
      if(oldSet){
        try {
          var os = JSON.parse(oldSet);
          if(os && typeof os.speedIdx === 'number' && os.speedIdx >= 0 &&
             os.speedIdx < CFG.SPEED_STEPS.length) d.settings.speedIdx = os.speedIdx;
        } catch(e2) {}
      }
      return d;
    }
  } catch(e) {}
  return defaultSaveData();
};
LocalStorageAdapter.prototype.save = function(data){
  try { localStorage.setItem('hd_save', JSON.stringify(data)); } catch(e) {}
};

var storage  = new LocalStorageAdapter();
var saveData = storage.load();

/* 既存コードの参照を維持 — オブジェクト参照なので変更が saveData に反映される */
var bestWave = saveData.bestWave;
var settings = saveData.settings;

function persistSave(){ saveData.bestWave = bestWave; storage.save(saveData); }
function saveBestWave(){ persistSave(); }
function saveSettings(){ persistSave(); }

/* =====================================================================
   XP / レベルアップ
===================================================================== */
function xpRequiredForLevel(lv){
  var req = CFG.XP_BASE;
  for(var i = 1; i < lv; i++){
    req = Math.min(CFG.XP_CAP, Math.floor(req * CFG.XP_SCALE));
  }
  return req;
}

function gainXP(amount){
  xp += amount;
  while(xp >= xpNext){
    xp -= xpNext;
    level++;
    xpNext = xpRequiredForLevel(level);
    pendingLevelUps++;
  }
  updateXPHud();
  if(pendingLevelUps > 0 && STATE === 'play') doLevelUp();
}

function updateXPHud(){
  var pct = Math.min(100, Math.floor(xp / xpNext * 100));
  document.getElementById('xpFill').style.width = pct + '%';
  document.getElementById('xpLabel').textContent =
    'LEVEL ' + level + ' — NEXT ' + (xpNext - xp) + ' XP';
}

function doLevelUp(){
  STATE = 'levelup';
  renderLvCards();
  showScreen('scrLevelup');
}

/* カードプールからランダム3択 */
function renderLvCards(){
  var pool = CFG.CARD_POOL.slice();
  /* shuffle */
  for(var i = pool.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var chosen = pool.slice(0, 3);
  var container = document.getElementById('lvCards');
  container.innerHTML = '';
  for(var c = 0; c < chosen.length; c++){
    var card = chosen[c];
    var div = document.createElement('div');
    div.className = 'card';
    div.innerHTML =
      '<div class="band"></div>' +
      '<div class="tag">COMMON</div>' +
      '<div class="icon">' + card.icon + '</div>' +
      '<div class="cname">' + card.name + '</div>' +
      '<div class="cdesc">' + card.desc + '</div>';
    div.setAttribute('data-up', card.id);
    div.addEventListener('click', onCardClick);
    container.appendChild(div);
  }
}

function onCardClick(){
  var id = this.getAttribute('data-up');
  applyUpgrade(id);
  pendingLevelUps--;
  if(pendingLevelUps > 0){
    renderLvCards();
  } else {
    hideScreen('scrLevelup');
    STATE = 'play';
  }
}

function applyUpgrade(id){
  if(id === 'rate')  { tower.fireInterval = tower.fireInterval * 0.8; }
  if(id === 'dmg')   { tower.dmg = tower.dmg * 1.4; }
  if(id === 'range') { tower.range = tower.range * 1.15; }
  if(id === 'speed') { tower.bulletSpeed = tower.bulletSpeed * 1.15; }
  if(id === 'heal')  { tower.hp = Math.min(tower.maxHp, tower.hp + 30); }
  if(id === 'maxhp') { tower.maxHp = tower.maxHp + 30; tower.hp = Math.min(tower.maxHp, tower.hp + 30); }
  if(typeof upgradeCounts[id] !== 'undefined') upgradeCounts[id]++;
}

/* =====================================================================
   必殺ゲージ
===================================================================== */
function gainSpecial(dmg){
  specialGauge = Math.min(CFG.SPECIAL_MAX, specialGauge + dmg * CFG.SPECIAL_DMG_RATIO);
  updateSpecialHud();
}

function updateSpecialHud(){
  var pct = specialGauge / CFG.SPECIAL_MAX * 100;
  document.getElementById('sbFill').style.width = pct + '%';
  var btn = document.getElementById('specialBtn');
  var ready = specialGauge >= CFG.SPECIAL_MAX;
  document.getElementById('sbText').textContent = ready ? 'SPECIAL!' : 'SPECIAL';
  if(ready){ btn.classList.add('ready'); } else { btn.classList.remove('ready'); }
}

/* =====================================================================
   コイン
===================================================================== */
function gainCoin(amount, x, y){
  var actual = Math.ceil(amount * coinGainMult);
  coins += actual;
  updateCoinHud();
  floater(x, y - 18, '+' + actual, '#ffd257');
}

function updateCoinHud(){
  var n = String(Math.floor(coins));
  document.getElementById('coinNum').textContent = n;
  document.getElementById('shopCoinNum').textContent = n;
}

   ラン内ショップ
===================================================================== */
var SHOP_DEFS = [
  { id:'rate',  icon:'&#9889;',   name:'連射速度', desc:'発射間隔 -20%' },
  { id:'dmg',   icon:'&#128165;', name:'ダメージ', desc:'攻撃力 +40%' },
  { id:'range', icon:'&#127919;', name:'射程距離', desc:'射程 +15%' },
  { id:'speed', icon:'&#128192;', name:'弾速',             desc:'弾速 +15%' },
  { id:'maxhp', icon:'&#10133;',  name:'最大HP+',          desc:'最大HP +30' },
  { id:'heal',  icon:'&#10010;',  name:'HP回復',           desc:'+30 HP 即時回復' }
];

function getShopPrice(id){
  var cnt = upgradeCounts[id] || 0;
  var price = CFG.SHOP_BASE_PRICE;
  for(var i = 0; i < cnt; i++) price = price * CFG.SHOP_PRICE_SCALE;
  return Math.floor(price);
}

function openShop(){
  if(STATE !== 'play') return;
  STATE = 'shop';
  renderShopItems();
  showScreen('scrShop');
}

function closeShop(){
  hideScreen('scrShop');
  STATE = 'play';
}

function renderShopItems(){
  var container = document.getElementById('shopItems');
  container.innerHTML = '';
  updateCoinHud();
  for(var i = 0; i < SHOP_DEFS.length; i++){
    var def = SHOP_DEFS[i];
    var price = getShopPrice(def.id);
    var cnt   = upgradeCounts[def.id] || 0;
    var canAfford = coins >= price;
    var lvText = (def.id === 'heal') ? '+30 HP' : ('LV.' + cnt + ' → LV.' + (cnt + 1));
    var div = document.createElement('div');
    div.className = 's-item' + (canAfford ? '' : ' s-disabled');
    var priceHtml =
      '<div class="s-price">' +
        '<span class="chex" style="width:11px;height:11px"></span>' +
        price +
      '</div>';
    div.innerHTML =
      '<div class="s-ic">' + def.icon + '</div>' +
      '<div class="s-body">' +
        '<div class="s-name">' + def.name + '</div>' +
        '<div class="s-lv">' + lvText + '</div>' +
      '</div>' +
      priceHtml;
    if(canAfford){
      div.setAttribute('data-shop', def.id);
      div.addEventListener('click', onShopBuy);
    }
    container.appendChild(div);
  }
}

function onShopBuy(){
  var id = this.getAttribute('data-shop');
  var price = getShopPrice(id);
  if(coins < price || STATE !== 'shop') return;
  coins -= price;
  applyUpgrade(id);
  renderShopItems();
}

function fireSpecial(){
  if(specialGauge < CFG.SPECIAL_MAX || STATE !== 'play') return;
  specialGauge = 0;
  updateSpecialHud();

  /* 全敵にダメージ+ノックバック */
  var dmg = tower.dmg * CFG.SPECIAL_DAMAGE_MULT;
  for(var i = enemies.length - 1; i >= 0; i--){
    var e = enemies[i];
    e.hp -= dmg;
    floater(e.x, e.y - e.size, '-' + Math.round(dmg), '#ff3d81');
    /* ノックバック */
    var dx = e.x - cx(), dy = e.y - cy();
    var dd = Math.sqrt(dx * dx + dy * dy);
    if(dd > 0){
      e.x += dx / dd * CFG.SPECIAL_KNOCKBACK;
      e.y += dy / dd * CFG.SPECIAL_KNOCKBACK;
    }
    if(e.hp <= 0){
      burst(e.x, e.y, e.color, 22);
      kills++;
      gainXP(e.xpReward);
      gainCoin(e.coinReward || 1, e.x, e.y);
      enemies.splice(i, 1);
    }
  }

  /* 演出 */
  flashTimer = CFG.SPECIAL_FLASH_DUR;
  shakeTimer = CFG.SPECIAL_SHAKE_DUR;
  shakeMag   = CFG.SPECIAL_SHAKE_MAG;

  /* 衝撃波パーティクル ring */
  for(var k = 0; k < 48; k++){
    var a = Math.PI * 2 / 48 * k;
    particles.push({
      x: cx(), y: cy(),
      vx: Math.cos(a) * 320, vy: Math.sin(a) * 320,
      life: 0.5, maxLife: 0.5, r: 3, color: '#4df3ff'
    });
  }
}

/* =====================================================================
   ウェーブ管理
===================================================================== */
/* デバッグ: URLパラメータ ?wave=N でウェーブスキップ */
function getUrlParam(name){
  var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}

function resetGame(){
  wave = 1; kills = 0;
  xp = 0; level = 1; xpNext = CFG.XP_BASE;
  specialGauge = 0; pendingLevelUps = 0;
  coins = 0; healItems = [];
  upgradeCounts = { rate: 0, dmg: 0, range: 0, speed: 0, maxhp: 0, heal: 0 };
  enemies = []; bullets = []; particles = []; floaters = []; enemyBullets = [];
  boss = null; warningTimer = 0; bossSpawnFn = null;
  weapons = { subTurret: 0, pierce: 0 };
  subTurretAngles = [0, 0]; subTurretFireTimers = [0, 0];
  pendingSteps = 0;
  tower.hp          = CFG.TOWER_HP;
  tower.maxHp       = CFG.TOWER_HP;
  tower.dmg         = CFG.TOWER_DMG;
  tower.fireInterval= CFG.TOWER_FIRE_INTERVAL;
  tower.bulletSpeed = CFG.TOWER_BULLET_SPEED;
  tower.range       = Math.min(W, H) * CFG.TOWER_RANGE_RATIO;
  applyPermanentUpgrades();
  turretAngle = 0; fireTimer = 0;
  flashTimer = 0; shakeTimer = 0;
  hideBossBar();
  updateCoinHud();

  /* ?wave=N デバッグスキップ */
  var skipW = parseInt(getUrlParam('wave'));
  if(skipW >= 1 && skipW <= CFG.MAX_WAVE){ wave = skipW; }

  updateXPHud();
  updateSpecialHud();
  document.getElementById('waveNum').textContent = String(wave);
  document.getElementById('waveTotal').textContent = ' / ' + CFG.MAX_WAVE;
  /* startWave() は呼び出し元で行う(チェックポイント開始時に武器選択を挟むため) */
}

function startWave(){
  boss = null; hideBossBar(); enemyBullets = [];
  if(wave === 5){
    spawnQueue = 0; spawnTimer = 0;
    triggerBossWarning('MINI BOSS', 'CHARGER', spawnMiniCharger);
  } else if(wave === 10 || wave === 30){
    spawnQueue = 0; spawnTimer = 0;
    var _w10 = wave;
    triggerBossWarning('BOSS', _w10 === 30 ? 'CHARGER  II' : 'CHARGER', function(){ spawnCharger(_w10); });
  } else if(wave === 20 || wave === 40){
    spawnQueue = 0; spawnTimer = 0;
    var _w20 = wave;
    triggerBossWarning('BOSS', _w20 === 40 ? 'SUMMONER  II' : 'SUMMONER', function(){ spawnSummoner(_w20); });
  } else {
    spawnQueue = Math.floor(CFG.WAVE_SPAWN_BASE + waveAccum(wave, CFG.WAVE_SPAWN_WAVE, CFG.WAVE_SPAWN_SCALE_EARLY, CFG.WAVE_SPAWN_SCALE_LATE));
    spawnTimer = 0;
  }
  document.getElementById('waveNum').textContent = String(wave);
}

function waveComplete(){
  /* 小回復 */
  tower.hp = Math.min(tower.maxHp, tower.hp + CFG.WAVE_HEAL_ON_CLEAR);
  floater(cx(), cy() - 80, '+' + CFG.WAVE_HEAL_ON_CLEAR + ' HP', '#3ddc74');

  /* チェックポイント解除 */
  for(var ci = 0; ci < CFG.CHECKPOINT_WAVES.length; ci++){
    if(wave === CFG.CHECKPOINT_WAVES[ci]){
      unlockCheckpoint(CFG.CHECKPOINT_WAVES[ci]);
      break;
    }
  }

  /* 報酬ウェーブ判定 */
  for(var r = 0; r < CFG.REWARD_WAVES.length; r++){
    if(wave === CFG.REWARD_WAVES[r]){ showWeaponReward(); return; }
  }

  if(wave >= CFG.MAX_WAVE){
    endGame(true);
  } else {
    wave++;
    startWave();
  }
}

/* =====================================================================
   敵スポーン
===================================================================== */
function spawnEnemy(){
  var edge = Math.floor(Math.random() * 4);
  var x, y, m = 70;
  if(edge === 0){ x = Math.random() * W; y = -m; }
  else if(edge === 1){ x = W + m; y = Math.random() * H; }
  else if(edge === 2){ x = Math.random() * W; y = H + m; }
  else { x = -m; y = Math.random() * H; }

  var tankRatio = Math.min(CFG.ENEMY_ORANGE_RATIO_MAX,
    CFG.ENEMY_ORANGE_RATIO + wave * CFG.ENEMY_ORANGE_RATIO_WAVE);
  var tank = Math.random() < tankRatio;

  if(tank){
    var hp = CFG.ENEMY_ORANGE_HP_BASE + waveAccum(wave, CFG.ENEMY_ORANGE_HP_WAVE, CFG.WAVE_HP_SCALE_EARLY, CFG.WAVE_HP_SCALE_LATE);
    enemies.push({
      x: x, y: y, hp: hp, maxHp: hp,
      speed: CFG.ENEMY_ORANGE_SPEED_BASE + waveAccum(wave, CFG.ENEMY_ORANGE_SPEED_WAVE, CFG.WAVE_SPEED_SCALE_EARLY, CFG.WAVE_SPEED_SCALE_LATE),
      size: CFG.ENEMY_ORANGE_SIZE, color: '#ffa028',
      rot: Math.random() * Math.PI * 2, rotSpd: (Math.random() - 0.5) * 1.5,
      dmg: CFG.ENEMY_ORANGE_DMG, xpReward: CFG.XP_PER_ORANGE, coinReward: CFG.COIN_ORANGE
    });
  } else {
    var hp2 = CFG.ENEMY_RED_HP_BASE + waveAccum(wave, CFG.ENEMY_RED_HP_WAVE, CFG.WAVE_HP_SCALE_EARLY, CFG.WAVE_HP_SCALE_LATE);
    enemies.push({
      x: x, y: y, hp: hp2, maxHp: hp2,
      speed: CFG.ENEMY_RED_SPEED_BASE + waveAccum(wave, CFG.ENEMY_RED_SPEED_WAVE, CFG.WAVE_SPEED_SCALE_EARLY, CFG.WAVE_SPEED_SCALE_LATE),
      size: CFG.ENEMY_RED_SIZE, color: '#ff2e4c',
      rot: Math.random() * Math.PI * 2, rotSpd: (Math.random() - 0.5) * 1.5,
      dmg: CFG.ENEMY_RED_DMG, xpReward: CFG.XP_PER_RED, coinReward: CFG.COIN_RED
    });
  }
}

/* =====================================================================
   パーティクル / フローター
===================================================================== */
function burst(x, y, color, n){
  var remaining = CFG.PARTICLE_MAX - particles.length;
  if(remaining <= 0) return;
  /* x5以上でパーティクル間引き */
  var count = (settings.speedIdx >= CFG.SPEED_PARTICLE_THRESH)
    ? Math.max(1, Math.floor(n * CFG.SPEED_PARTICLE_RATIO))
    : n;
  count = Math.min(count, remaining);
  for(var i = 0; i < count; i++){
    var a  = Math.random() * Math.PI * 2;
    var sp = 50 + Math.random() * 180;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5 + Math.random() * 0.4, maxLife: 0.9,
      r: 2 + Math.random() * 4, color: color
    });
  }
}

function floater(x, y, text, color){
  floaters.push({ x: x, y: y, text: text, color: color, life: 0.8 });
}

/* =====================================================================
   更新ループ
===================================================================== */
var lastTime = 0;
var pendingSteps = 0; /* 打ち切り持ち越し分 */

function loop(t){
  requestAnimationFrame(loop);
  var dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;

  if(STATE === 'play'){
    var mult  = CFG.SPEED_STEPS[settings.speedIdx];
    var subDt = CFG.SPEED_SUBSTEP_DT; /* 固定1/60秒 */
    /* 今フレーム分を追加、溜まりすぎ上限はmult×LAG */
    pendingSteps += mult;
    var cap = mult * CFG.SPEED_SUBSTEP_MAX_LAG;
    if(pendingSteps > cap) pendingSteps = cap;

    var t0 = performance.now();
    while(pendingSteps > 0){
      update(subDt);
      pendingSteps--;
      /* ポーズに入ったら即停止(levelup等) */
      if(STATE !== 'play'){ pendingSteps = 0; break; }
      /* 時間バジェット超過で打ち切り、残りは次フレームへ */
      if(performance.now() - t0 > CFG.SPEED_BUDGET_MS) break;
    }

    /* 演出タイマーは倍速に無関係、等倍で進める */
    if(flashTimer > 0){ flashTimer -= dt; }
    /* 警告タイマーも実時間(倍速無関係) */
    if(warningTimer > 0){
      warningTimer -= dt;
      if(warningTimer <= 0 && bossSpawnFn !== null){
        var fn = bossSpawnFn; bossSpawnFn = null; fn();
      }
    }
    if(shakeTimer > 0){
      shakeTimer -= dt;
      shakeX = (Math.random() - 0.5) * 2 * shakeMag;
      shakeY = (Math.random() - 0.5) * 2 * shakeMag;
    } else { shakeX = 0; shakeY = 0; }
  } else {
    pendingSteps = 0;
  }
  draw(t / 1000, dt);
}

function update(dt){
  /* スポーン */
  if(spawnQueue > 0){
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnEnemy();
      spawnQueue--;
      var interval = CFG.WAVE_SPAWN_INTERVAL_BASE - wave * 0.06;
      spawnTimer = Math.max(CFG.WAVE_SPAWN_INTERVAL_MIN, interval);
    }
  }

  /* 敵移動 */
  var i, e;
  for(i = enemies.length - 1; i >= 0; i--){
    e = enemies[i];
    var dx = cx() - e.x, dy = cy() - e.y;
    var d  = Math.sqrt(dx * dx + dy * dy);
    if(d < CFG.TOWER_HIT_RADIUS){
      tower.hp -= e.dmg;
      burst(e.x, e.y, e.color, 14);
      enemies.splice(i, 1);
      if(tower.hp <= 0){ tower.hp = 0; endGame(false); return; }
      continue;
    }
    e.x  += dx / d * e.speed * dt;
    e.y  += dy / d * e.speed * dt;
    e.rot += e.rotSpd * dt;
  }

  /* 戦闘対象リスト(enemies + boss)を毎フレーム構築 */
  var combatants = enemies.slice();
  if(boss !== null) combatants.push(boss);

  /* ターゲット選択 */
  var target = null, best = 1e9;
  for(i = 0; i < combatants.length; i++){
    var ct0 = combatants[i];
    var cdx = ct0.x - cx(), cdy = ct0.y - cy();
    var cdd = Math.sqrt(cdx * cdx + cdy * cdy);
    if(cdd < tower.range && cdd < best){ best = cdd; target = ct0; }
  }

  if(target){
    var ta   = Math.atan2(target.y - cy(), target.x - cx());
    var diff = ta - turretAngle;
    while(diff >  Math.PI) diff -= Math.PI * 2;
    while(diff < -Math.PI) diff += Math.PI * 2;
    turretAngle += diff * Math.min(1, dt * 10);

    fireTimer -= dt;
    if(fireTimer <= 0){
      fireTimer = tower.fireInterval;
      var pierceMax = CFG.PIERCE_LV[Math.min(weapons.pierce, CFG.PIERCE_LV.length - 1)];
      bullets.push({
        x: cx() + Math.cos(turretAngle) * (CFG.TOWER_HEX_R_OUTER + 6),
        y: cy() + Math.sin(turretAngle) * (CFG.TOWER_HEX_R_OUTER + 6),
        vx: Math.cos(turretAngle) * tower.bulletSpeed,
        vy: Math.sin(turretAngle) * tower.bulletSpeed,
        life: CFG.BULLET_LIFE, dmg: tower.dmg, pierceLeft: pierceMax
      });
    }
  }

  /* 弾更新 + 全戦闘対象への当たり判定 */
  for(i = bullets.length - 1; i >= 0; i--){
    var b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    /* x5以上では弾トレイルも間引き */
    var trailChance = (settings.speedIdx >= CFG.SPEED_PARTICLE_THRESH)
      ? CFG.BULLET_TRAIL * CFG.SPEED_PARTICLE_RATIO : CFG.BULLET_TRAIL;
    if(Math.random() < trailChance){
      if(particles.length < CFG.PARTICLE_MAX)
        particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.22, maxLife: 0.22, r: 2, color: '#9adfff' });
    }
    var depleted = false;
    for(var j = combatants.length - 1; j >= 0; j--){
      var ct = combatants[j];
      var hx = b.x - ct.x, hy = b.y - ct.y;
      if(Math.abs(hx) < ct.size * 0.75 && Math.abs(hy) < ct.size * 0.75){
        var bdmg = b.dmg !== undefined ? b.dmg : tower.dmg;
        ct.hp -= bdmg;
        gainSpecial(bdmg);
        floater(ct.x, ct.y - ct.size, String(Math.round(bdmg)), ct.isBoss ? '#4df3ff' : '#ffef9a');
        burst(b.x, b.y, ct.color, ct.isBoss ? 4 : 6);
        b.pierceLeft--;
        if(ct.hp <= 0){
          burst(ct.x, ct.y, ct.color, ct.isBoss ? 40 : 22);
          kills++;
          gainXP(ct.xpReward);
          gainCoin(ct.coinReward || 1, ct.x, ct.y);
          if(ct.isBoss){
            boss = null; hideBossBar();
          } else {
            var ei = enemies.indexOf(ct);
            if(ei !== -1) enemies.splice(ei, 1);
            /* 回復アイテムドロップ */
            if(Math.random() < CFG.DROP_HEAL_CHANCE){
              healItems.push({ x: ct.x, y: ct.y, life: 8.0 });
            }
          }
          combatants.splice(j, 1);
        }
        if(b.pierceLeft <= 0){ depleted = true; break; }
      }
    }
    /* 弾が回復アイテムに触れたら取得 */
    if(!depleted){
      for(var hi2 = healItems.length - 1; hi2 >= 0; hi2--){
        var hitem = healItems[hi2];
        var bhx = b.x - hitem.x, bhy = b.y - hitem.y;
        if(Math.abs(bhx) < 14 && Math.abs(bhy) < 14){
          tower.hp = Math.min(tower.maxHp, tower.hp + CFG.DROP_HEAL_AMOUNT);
          floater(hitem.x, hitem.y - 10, '+' + CFG.DROP_HEAL_AMOUNT + ' HP', '#3ddc74');
          healItems.splice(hi2, 1);
          break;
        }
      }
    }
    if(depleted || b.life <= 0) bullets.splice(i, 1);
  }

  /* 回復アイテム: タワーへ漂い + タワー接触で取得 */
  for(i = healItems.length - 1; i >= 0; i--){
    var hit = healItems[i];
    var hdx = cx() - hit.x, hdy = cy() - hit.y;
    var hdd = Math.sqrt(hdx * hdx + hdy * hdy);
    if(hdd > 1){
      hit.x += hdx / hdd * CFG.DROP_SPEED * dt;
      hit.y += hdy / hdd * CFG.DROP_SPEED * dt;
    }
    hit.life -= dt;
    if(hdd < CFG.TOWER_HIT_RADIUS + 12){
      tower.hp = Math.min(tower.maxHp, tower.hp + CFG.DROP_HEAL_AMOUNT);
      floater(hit.x, hit.y - 10, '+' + CFG.DROP_HEAL_AMOUNT + ' HP', '#3ddc74');
      healItems.splice(i, 1);
    } else if(hit.life <= 0){
      healItems.splice(i, 1);
    }
  }

  /* パーティクル */
  for(i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }

  /* フローター */
  for(i = floaters.length - 1; i >= 0; i--){
    var f = floaters[i];
    f.y -= 44 * dt; f.life -= dt;
    if(f.life <= 0) floaters.splice(i, 1);
  }

  /* 敵弾(サモナー) */
  for(i = enemyBullets.length - 1; i >= 0; i--){
    var eb = enemyBullets[i];
    eb.x += eb.vx * dt; eb.y += eb.vy * dt; eb.life -= dt;
    var etx = eb.x - cx(), ety = eb.y - cy();
    if(etx * etx + ety * ety < CFG.TOWER_HIT_RADIUS * CFG.TOWER_HIT_RADIUS){
      tower.hp -= eb.dmg;
      burst(cx(), cy(), '#c84dff', 8);
      enemyBullets.splice(i, 1);
      if(tower.hp <= 0){ tower.hp = 0; endGame(false); return; }
    } else if(eb.life <= 0 || eb.x < -120 || eb.x > W + 120 || eb.y < -120 || eb.y > H + 120){
      enemyBullets.splice(i, 1);
    }
  }

  /* ボス処理 */
  if(boss !== null) updateBoss(dt);

  /* サブ砲台発射 */
  if(weapons.subTurret > 0) updateSubTurrets(dt);

  /* ウェーブクリア判定 — warningTimer>0中は保留 */
  if(spawnQueue === 0 && enemies.length === 0 && boss === null && warningTimer <= 0 && STATE === 'play'){
    waveComplete();
  }
}

function spawnMiniCharger(){
  var orbitDist = Math.min(W, H) * CFG.BOSS_MINI_ORBIT_RATIO;
  var angle = Math.random() * Math.PI * 2;
  boss = {
    x: cx() + Math.cos(angle) * orbitDist,
    y: cy() + Math.sin(angle) * orbitDist,
    isBoss: true, type: 'mini_charger',
    hp: CFG.BOSS_MINI_HP, maxHp: CFG.BOSS_MINI_HP,
    size: CFG.BOSS_MINI_SIZE, color: CFG.BOSS_MINI_COLOR,
    dmg: CFG.BOSS_MINI_DMG, xpReward: CFG.BOSS_MINI_XP, coinReward: CFG.COIN_BOSS,
    rot: 0, orbitAngle: angle, orbitDist: orbitDist,
    phase: 'wander', timer: CFG.BOSS_MINI_WANDER_DUR, dirX: 0, dirY: 0
  };
  showBossBar('MINI BOSS');
}

function updateBoss(dt){
  if(!boss) return;
  if(boss.type === 'mini_charger') updateMiniCharger(dt);
  else if(boss.type === 'charger')  updateCharger(dt);
  else if(boss.type === 'summoner') updateSummoner(dt);
}

function updateMiniCharger(dt){
  var b = boss;
  b.timer -= dt;
  if(b.phase === 'wander'){
    b.orbitAngle += CFG.BOSS_MINI_SPEED_WANDER * dt;
    b.x = cx() + Math.cos(b.orbitAngle) * b.orbitDist;
    b.y = cy() + Math.sin(b.orbitAngle) * b.orbitDist;
    if(b.timer <= 0){
      b.phase = 'warn'; b.timer = CFG.BOSS_MINI_WARN_DUR;
      var dx = cx() - b.x, dy = cy() - b.y;
      var d  = Math.sqrt(dx * dx + dy * dy);
      b.dirX = dx / d; b.dirY = dy / d;
    }
  } else if(b.phase === 'warn'){
    if(b.timer <= 0){ b.phase = 'charge'; b.timer = CFG.BOSS_MINI_CHARGE_DUR; }
  } else if(b.phase === 'charge'){
    b.x += b.dirX * CFG.BOSS_MINI_SPEED_CHARGE * dt;
    b.y += b.dirY * CFG.BOSS_MINI_SPEED_CHARGE * dt;
    var dx2 = b.x - cx(), dy2 = b.y - cy();
    var d2  = Math.sqrt(dx2 * dx2 + dy2 * dy2);
    if(d2 < CFG.TOWER_HIT_RADIUS + b.size * 0.5){
      tower.hp -= b.dmg;
      burst(b.x, b.y, b.color, 20);
      b.x = cx() + b.dirX * -(CFG.TOWER_HIT_RADIUS + b.size);
      b.y = cy() + b.dirY * -(CFG.TOWER_HIT_RADIUS + b.size);
      b.phase = 'rest'; b.timer = CFG.BOSS_MINI_REST_DUR;
      if(tower.hp <= 0){ tower.hp = 0; endGame(false); return; }
    }
    if(b.timer <= 0){ b.phase = 'rest'; b.timer = CFG.BOSS_MINI_REST_DUR; }
  } else if(b.phase === 'rest'){
    if(b.timer <= 0){
      b.phase = 'wander'; b.timer = CFG.BOSS_MINI_WANDER_DUR;
      b.orbitAngle = Math.atan2(b.y - cy(), b.x - cx());
    }
  }
  b.rot += 1.2 * dt;
  updateBossHpBar();
}

function updateCharger(dt){

    }
  } else if(b.phase === 'warn'){
    if(b.timer <= 0){ b.phase = 'charge'; b.timer = CFG.BOSS_CHARGER_CHARGE_DUR; }
  } else if(b.phase === 'charge'){
    b.x += b.dirX * CFG.BOSS_CHARGER_SPEED_CHARGE * dt;

    }

  } else if(b.phase === 'rest'){
    if(b.timer <= 0){
      b.phase = 'wander'; b.timer = CFG.BOSS_CHARGER_WANDER_DUR;
      b.orbitAngle = Math.atan2(b.y - cy(), b.x - cx());
    }
  }
  b.rot += 1.4 * dt;
  updateBossHpBar();
}

function bossShockwave(b){
  var dmg = CFG.BOSS_CHARGER_SHOCKWAVE_DMG;
  var r2  = CFG.BOSS_CHARGER_SHOCKWAVE_R * CFG.BOSS_CHARGER_SHOCKWAVE_R;
  var i;
  for(i = enemies.length - 1; i >= 0; i--){
    var e = enemies[i];
    var ex = e.x - b.x, ey = e.y - b.y;
    if(ex * ex + ey * ey < r2){
      e.hp -= dmg;
      burst(e.x, e.y, '#ff6b35', 8);
      if(e.hp <= 0){
        kills++; gainXP(e.xpReward); gainCoin(e.coinReward || 1, e.x, e.y);
        enemies.splice(i, 1);
      }
    }
  }
  /* 衝撃波リング */
  for(var k = 0; k < 32; k++){
    var a = Math.PI * 2 / 32 * k;
    particles.push({ x: b.x, y: b.y,
      vx: Math.cos(a) * 200, vy: Math.sin(a) * 200,
      life: 0.55, maxLife: 0.55, r: 4, color: '#ff6b35' });
  }
  floater(b.x, b.y - b.size - 14, 'SHOCKWAVE', '#ff6b35');
}

function updateSummoner(dt){
  var b = boss;
  b.orbitAngle += CFG.BOSS_SUMMONER_SPEED_ORBIT * dt;
  b.x = cx() + Math.cos(b.orbitAngle) * b.orbitDist;
  b.y = cy() + Math.sin(b.orbitAngle) * b.orbitDist;

  b.summonTimer -= dt;
  if(b.summonTimer <= 0){
    var cnt = b.hard ? CFG.BOSS_SUMMONER_SUMMON_COUNT_HARD : CFG.BOSS_SUMMONER_SUMMON_COUNT;
    var si;
    for(si = 0; si < cnt; si++){ spawnSummonerMinion(b.x, b.y); }
    b.summonTimer = CFG.BOSS_SUMMONER_SUMMON_INTERVAL;
    burst(b.x, b.y, b.color, 14);
    floater(b.x, b.y - b.size - 10, 'SUMMON!', b.color);
  }

  b.bulletTimer -= dt;
  if(b.bulletTimer <= 0){
    var bcount = b.hard ? CFG.BOSS_SUMMONER_BULLET_COUNT_HARD : CFG.BOSS_SUMMONER_BULLET_COUNT;
    fireSummonerBullets(b, bcount);
    b.bulletTimer = CFG.BOSS_SUMMONER_BULLET_INTERVAL;
  }

  b.rot += 0.8 * dt;
  updateBossHpBar();
}

function spawnSummonerMinion(sx, sy){
  var hp = CFG.ENEMY_RED_HP_BASE + waveAccum(wave, CFG.ENEMY_RED_HP_WAVE, CFG.WAVE_HP_SCALE_EARLY, CFG.WAVE_HP_SCALE_LATE);
  enemies.push({
    x: sx + (Math.random() - 0.5) * 24,
    y: sy + (Math.random() - 0.5) * 24,
    hp: hp, maxHp: hp,
    speed: CFG.ENEMY_RED_SPEED_BASE * 1.3,
    size: CFG.ENEMY_RED_SIZE, color: '#c84dff',
    rot: Math.random() * Math.PI * 2, rotSpd: (Math.random() - 0.5) * 2.5,
    dmg: CFG.ENEMY_RED_DMG, xpReward: CFG.XP_PER_RED, coinReward: CFG.COIN_RED
  });
}

function fireSummonerBullets(b, count){
  var baseAngle = Math.atan2(cy() - b.y, cx() - b.x);
  var spread    = Math.PI / 9;
  var i;
  for(i = 0; i < count; i++){
    var a = count === 1 ? baseAngle :
      baseAngle - spread + spread * 2 / (count - 1) * i;
    enemyBullets.push({
      x: b.x, y: b.y,
      vx: Math.cos(a) * CFG.BOSS_SUMMONER_BULLET_SPEED,
      vy: Math.sin(a) * CFG.BOSS_SUMMONER_BULLET_SPEED,
      life: 4.0, dmg: CFG.BOSS_SUMMONER_BULLET_DMG,
      color: '#c84dff', r: 7
    });
  }
}

/* =====================================================================
   サブ砲台更新
===================================================================== */
function updateSubTurrets(dt){
  var sCombatants = enemies.slice();
  if(boss !== null) sCombatants.push(boss);
  for(var si = 0; si < weapons.subTurret && si < CFG.SUB_TURRET_OFFSETS.length; si++){
    var off = CFG.SUB_TURRET_OFFSETS[si];
    var sx = cx() + off.dx, sy = cy() + off.dy;
    var starget = null, sbest = 1e9;
    for(var sj = 0; sj < sCombatants.length; sj++){
      var sc = sCombatants[sj];
      var sdx = sc.x - sx, sdy = sc.y - sy;
      var sdd = Math.sqrt(sdx * sdx + sdy * sdy);
      if(sdd < tower.range && sdd < sbest){ sbest = sdd; starget = sc; }
    }
    if(starget){
      var sta = Math.atan2(starget.y - sy, starget.x - sx);
      var sdiff = sta - subTurretAngles[si];
      while(sdiff >  Math.PI) sdiff -= Math.PI * 2;
      while(sdiff < -Math.PI) sdiff += Math.PI * 2;
      subTurretAngles[si] += sdiff * Math.min(1, dt * 8);
      subTurretFireTimers[si] -= dt;
      if(subTurretFireTimers[si] <= 0){
        subTurretFireTimers[si] = tower.fireInterval / CFG.SUB_TURRET_FIRE_RATIO;
        var sDmg = tower.dmg * CFG.SUB_TURRET_DMG_RATIO;
        var sAng = subTurretAngles[si];
        var spMax = CFG.PIERCE_LV[Math.min(weapons.pierce, CFG.PIERCE_LV.length - 1)];
        bullets.push({
          x: sx + Math.cos(sAng) * 14,
          y: sy + Math.sin(sAng) * 14,
          vx: Math.cos(sAng) * tower.bulletSpeed,
          vy: Math.sin(sAng) * tower.bulletSpeed,
          life: CFG.BULLET_LIFE, dmg: sDmg, pierceLeft: spMax
        });
      }
    }
  }
}

function makeWpnCard(id, icon, name, desc, disabled){
  var div = document.createElement('div');
  div.className = 'wpn-card' + (disabled ? ' disabled' : '');
  div.innerHTML =
    '<div class="band"></div>' +
    '<div class="tag">SPECIAL</div>' +
    '<div class="icon">' + icon + '</div>' +
    '<div class="cname">' + name + '</div>' +
    '<div class="cdesc">' + desc + '</div>';
  if(!disabled){
    div.setAttribute('data-wpn', id);
    div.addEventListener('click', onWeaponSelect);
  }
  return div;
}

function onWeaponSelect(){
  var id = this.getAttribute('data-wpn');
  if(id === 'sub_turret') weapons.subTurret = Math.min(weapons.subTurret + 1, 2);
  if(id === 'pierce')     weapons.pierce    = Math.min(weapons.pierce    + 1, CFG.PIERCE_LV.length - 1);
  hideScreen('scrWeapon');
  proceedAfterWeaponReward();
}

function proceedAfterWeaponReward(){
  if(checkpointWeaponMode){
    checkpointWeaponMode = false;
    startWave(); STATE = 'play';
  } else {
    if(wave >= CFG.MAX_WAVE){ endGame(true); } else { wave++; startWave(); STATE = 'play'; }
  }
}

/* =====================================================================
   描画
===================================================================== */
function hexPath(r, rot){
  ctx.beginPath();
  for(var k = 0; k < 6; k++){
    var a  = Math.PI / 3 * k + rot;
    var px = Math.cos(a) * r, py = Math.sin(a) * r;
    if(k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function draw(tm, dt){
  hexRot += dt * 0.25; /* 描画側で等倍回転 */
  ctx.save();
  if(shakeTimer > 0) ctx.translate(shakeX, shakeY);

  /* 背景 */
  var bg = ctx.createRadialGradient(cx(), cy(), 0, cx(), cy(), Math.max(W, H) * 0.85);
  bg.addColorStop(0, '#0b1626'); bg.addColorStop(1, '#04070d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  /* 星 */
  var j;
  for(j = 0; j < stars.length; j++){
    var s = stars[j];
    ctx.globalAlpha = 0.25 + 0.35 * Math.abs(Math.sin(tm * 0.8 + s.tw));
    ctx.fillStyle = '#aee6ff';
    ctx.beginPath(); ctx.arc(s.xr * W, s.yr * H, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* 六角グリッド */
  ctx.strokeStyle = 'rgba(70,130,190,0.08)'; ctx.lineWidth = 1;
  var hr = 34, hh = hr * Math.sqrt(3) / 2, row = 0, gy, gx;
  for(gy = -hh; gy < H + hh; gy += hh, row++){
    var off = (row % 2) ? hr * 1.5 : 0;
    for(gx = -hr * 3 + off; gx < W + hr * 3; gx += hr * 3){
      ctx.save(); ctx.translate(gx, gy); hexPath(hr, Math.PI / 6); ctx.stroke(); ctx.restore();
    }
  }

  if(STATE === 'title'){ ctx.restore(); return; }

  /* 射程リング + レーダースイープ */
  ctx.strokeStyle = 'rgba(77,243,255,0.28)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.arc(cx(), cy(), tower.range, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.save(); ctx.translate(cx(), cy()); ctx.rotate(tm * 0.9);
  var sg = ctx.createLinearGradient(0, 0, tower.range, 0);
  sg.addColorStop(0, 'rgba(77,243,255,0)'); sg.addColorStop(1, 'rgba(77,243,255,0.32)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, tower.range, -0.5, 0); ctx.closePath(); ctx.fill();
  ctx.restore();

  /* パーティクル */
  for(j = 0; j < particles.length; j++){
    var p = particles[j];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* 敵 */
  for(j = 0; j < enemies.length; j++){
    var e = enemies[j];
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot);
    ctx.shadowColor = e.color; ctx.shadowBlur = 14;
    ctx.strokeStyle = e.color; ctx.lineWidth = 4;
    ctx.strokeRect(-e.size / 2, -e.size / 2, e.size, e.size);
    ctx.globalAlpha = 0.15; ctx.fillStyle = e.color;
    ctx.fillRect(-e.size / 2, -e.size / 2, e.size, e.size);
    ctx.globalAlpha = 1; ctx.restore();
    if(e.hp < e.maxHp){
      var bw = e.size * 1.6;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - bw / 2, e.y - e.size - 11, bw, 4);
      ctx.fillStyle = '#ff5560';
      ctx.fillRect(e.x - bw / 2, e.y - e.size - 11, bw * (e.hp / e.maxHp), 4);
    }
  }

  /* ボス */
  if(boss !== null){
    /* サモナー: 巡回軌道リング */
    if(boss.type === 'summoner'){
      ctx.save();
      ctx.strokeStyle = 'rgba(200,77,255,0.18)'; ctx.lineWidth = boss.size * 2.2;
      ctx.setLineDash([6, 14]);
      ctx.beginPath(); ctx.arc(cx(), cy(), boss.orbitDist, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    /* チャージャー系: 突進予告帯 */
    if((boss.type === 'charger' || boss.type === 'mini_charger') && boss.phase === 'warn'){
      var bperpX = -boss.dirY, bperpY = boss.dirX;
      var bHW    = boss.size * 1.4;
      var bfarX  = boss.x + boss.dirX * (W + H);
      var bfarY  = boss.y + boss.dirY * (W + H);
      var warnAlpha = boss.type === 'charger'
        ? (0.35 + 0.28 * Math.abs(Math.sin(tm * Math.PI * 12)))
        : (0.45 + 0.35 * Math.abs(Math.sin(tm * Math.PI * 10)));
      ctx.globalAlpha = warnAlpha;
      ctx.fillStyle = boss.type === 'charger' ? 'rgba(255,107,53,0.55)' : 'rgba(255,61,129,0.45)';
      ctx.beginPath();
      ctx.moveTo(boss.x + bperpX * bHW, boss.y + bperpY * bHW);
      ctx.lineTo(bfarX  + bperpX * bHW, bfarY  + bperpY * bHW);
      ctx.lineTo(bfarX  - bperpX * bHW, bfarY  - bperpY * bHW);
      ctx.lineTo(boss.x - bperpX * bHW, boss.y - bperpY * bHW);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = boss.type === 'charger' ? '#ff6b35' : '#ff3d81';
      ctx.lineWidth = 1.5; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(boss.x, boss.y); ctx.lineTo(bfarX, bfarY); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    /* ボス本体 */
    ctx.save(); ctx.translate(boss.x, boss.y); ctx.rotate(boss.rot);
    ctx.shadowColor = boss.color; ctx.shadowBlur = 26;
    ctx.strokeStyle = boss.color; ctx.lineWidth = 4;
    hexPath(boss.size, 0); ctx.stroke();
    /* サモナーは内側に逆回転リングを追加 */
    if(boss.type === 'summoner'){
      ctx.strokeStyle = 'rgba(200,77,255,0.5)'; ctx.lineWidth = 2;
      hexPath(boss.size * 0.6, -boss.rot * 2); ctx.stroke();
    }
    ctx.globalAlpha = 0.18; ctx.fillStyle = boss.color;
    hexPath(boss.size, 0); ctx.fill();
    ctx.globalAlpha = 1; ctx.restore();
  }

  /* 敵弾(サモナー弾) */
  var j2;
  for(j2 = 0; j2 < enemyBullets.length; j2++){
    var eb2 = enemyBullets[j2];
    ctx.save();
    ctx.shadowColor = eb2.color; ctx.shadowBlur = 14;
    ctx.fillStyle = eb2.color; ctx.globalAlpha = 0.88;
    ctx.beginPath(); ctx.arc(eb2.x, eb2.y, eb2.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.restore();
  }

  /* 弾 */
  ctx.shadowColor = '#57d8ff'; ctx.shadowBlur = 14; ctx.fillStyle = '#cdf2ff';
  for(j = 0; j < bullets.length; j++){
    ctx.beginPath(); ctx.arc(bullets[j].x, bullets[j].y, 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  /* 回復アイテム(緑発光クロス) */
  var healPulse = 0.55 + 0.45 * Math.sin(tm * 5.0);
  for(j = 0; j < healItems.length; j++){
    var hi3 = healItems[j];
    ctx.save();
    ctx.shadowColor = '#3ddc74'; ctx.shadowBlur = 16 * healPulse;
    ctx.globalAlpha = 0.7 + 0.3 * healPulse;
    ctx.strokeStyle = '#3ddc74'; ctx.lineWidth = 3;
    var cs = 9;
    ctx.beginPath();
    ctx.moveTo(hi3.x - cs, hi3.y); ctx.lineTo(hi3.x + cs, hi3.y);
    ctx.moveTo(hi3.x, hi3.y - cs); ctx.lineTo(hi3.x, hi3.y + cs);
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.restore();
  }

  /* サブ砲台 */
  for(var si = 0; si < weapons.subTurret && si < CFG.SUB_TURRET_OFFSETS.length; si++){
    var soff = CFG.SUB_TURRET_OFFSETS[si];
    ctx.save(); ctx.translate(cx() + soff.dx, cy() + soff.dy);
    ctx.shadowColor = '#4df3ff'; ctx.shadowBlur = 12;
    ctx.strokeStyle = 'rgba(77,243,255,0.8)'; ctx.lineWidth = 2;
    hexPath(11, -hexRot * 2); ctx.stroke();
    ctx.rotate(subTurretAngles[si]);
    ctx.fillStyle = '#d8f6ff'; ctx.fillRect(7, -2, 11, 4);
    ctx.shadowBlur = 0; ctx.restore();
  }

  /* タワー */
  ctx.save(); ctx.translate(cx(), cy());
  /* 外六角 */
  ctx.shadowColor = '#4df3ff'; ctx.shadowBlur = 22;
  ctx.strokeStyle = 'rgba(77,243,255,0.9)'; ctx.lineWidth = 3;
  hexPath(CFG.TOWER_HEX_R_OUTER, hexRot); ctx.stroke();
  /* 内六角(逆回転) */
  ctx.strokeStyle = 'rgba(150,240,255,0.55)'; ctx.lineWidth = 1.6;
  hexPath(CFG.TOWER_HEX_R_INNER, -hexRot * 1.6 + 0.5); ctx.stroke();
  ctx.shadowBlur = 0;
  /* コア */
  var pulse = 0.6 + 0.4 * Math.sin(tm * 4);
  var cg = ctx.createRadialGradient(0, 0, 0, 0, 0, CFG.TOWER_CORE_R);
  cg.addColorStop(0, 'rgba(220,255,255,' + (0.9 * pulse) + ')');
  cg.addColorStop(1, 'rgba(77,243,255,0)');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, CFG.TOWER_CORE_R, 0, Math.PI * 2); ctx.fill();
  /* 砲身 */
  ctx.rotate(turretAngle);
  ctx.fillStyle = '#eafcff'; ctx.shadowColor = '#4df3ff'; ctx.shadowBlur = 8;
  ctx.fillRect(CFG.TOWER_BARREL_START, -Math.floor(CFG.TOWER_BARREL_H / 2),
               CFG.TOWER_BARREL_LEN, CFG.TOWER_BARREL_H);
  ctx.shadowBlur = 0;
  ctx.restore();

  /* タワーHPバー(セグメント) */
  var hw  = CFG.TOWER_HP_BAR_W;
  var seg = CFG.TOWER_HP_BAR_SEGS;
  var sw  = hw / seg;
  var hpRatio = tower.hp / tower.maxHp;
  for(var k = 0; k < seg; k++){
    var on = k < Math.ceil(hpRatio * seg);
    var barColor = on ? (hpRatio > 0.3 ? '#3ddc74' : '#ff5560') : 'rgba(20,40,60,0.8)';
    ctx.fillStyle = barColor;
    if(on){ ctx.shadowColor = barColor; ctx.shadowBlur = 7; } else { ctx.shadowBlur = 0; }
    ctx.fillRect(cx() - hw / 2 + k * sw + 1, cy() + CFG.TOWER_HP_BAR_Y, sw - 3, 6);
  }
  ctx.shadowBlur = 0;

  /* フローター */
  ctx.textAlign = 'center';
  for(j = 0; j < floaters.length; j++){
    var fl = floaters[j];
    ctx.globalAlpha = Math.max(0, fl.life / 0.8);
    ctx.font = '700 15px "Chakra Petch", Arial';
    ctx.fillStyle = fl.color;
    ctx.fillText(fl.text, fl.x, fl.y);
  }
  ctx.globalAlpha = 1;

  /* WARNING演出 */
  if(warningTimer > 0){
    var wFade = warningTimer < 0.35 ? warningTimer / 0.35 : 1.0;
    var wPulse = 0.5 + 0.5 * Math.abs(Math.sin(tm * Math.PI * 3.5));
    ctx.globalAlpha = wFade * 0.18 * wPulse;
    ctx.fillStyle = '#ff0044';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = wFade;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 32;
    ctx.fillStyle = '#ff3d81';
    ctx.font = '700 ' + Math.floor(Math.min(W, H) * 0.088) + 'px "Chakra Petch", Arial';
    ctx.fillText('!! WARNING !!', cx(), cy() - 22);
    ctx.shadowColor = '#ffd257'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffd257';
    ctx.font = '600 ' + Math.floor(Math.min(W, H) * 0.044) + 'px "Chakra Petch", Arial';
    ctx.fillText(warningLabel, cx(), cy() + 32);
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* 必殺フラッシュ */
  if(flashTimer > 0){
    ctx.globalAlpha = (flashTimer / CFG.SPECIAL_FLASH_DUR) * 0.55;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

/* =====================================================================
   チェックポイント
===================================================================== */
function unlockCheckpoint(w){
  for(var i = 0; i < saveData.unlockedCheckpoints.length; i++){
    if(saveData.unlockedCheckpoints[i] === w) return;
  }
  saveData.unlockedCheckpoints.push(w);
  persistSave();
  floater(cx(), cy() - 110, 'CHECKPOINT W' + w + ' UNLOCKED', '#4df3ff');
}

function openCheckpointScreen(){
  renderCheckpointScreen();
  showScreen('scrCheckpoint');
}

function renderCheckpointScreen(){
  var container = document.getElementById('cpButtons');
  container.innerHTML = '';
  var cps = saveData.unlockedCheckpoints;
  var allOptions = [1];
  for(var ci = 0; ci < CFG.CHECKPOINT_WAVES.length; ci++){
    for(var cj = 0; cj < cps.length; cj++){
      if(cps[cj] === CFG.CHECKPOINT_WAVES[ci]){ allOptions.push(CFG.CHECKPOINT_WAVES[ci]); break; }
    }
  }
  for(var o = 0; o < allOptions.length; o++){
    var w = allOptions[o];
    var btn = document.createElement('button');
    btn.className = 'cp-wave-btn';
    btn.textContent = w === 1 ? 'WAVE 1  (START)' : ('WAVE ' + w + '  +' + CFG.CHECKPOINT_START_COINS + ' COINS & WEAPON');
    btn.setAttribute('data-cpw', String(w));
    btn.addEventListener('click', onCheckpointSelect);
    container.appendChild(btn);
  }
}

function onCheckpointSelect(){
  var w = parseInt(this.getAttribute('data-cpw'), 10);
  hideScreen('scrCheckpoint');
  showGameUI();
  resetGame();
  if(w <= 1){
    startWave();
    STATE = 'play';
  } else {
    wave = w;
    document.getElementById('waveNum').textContent = String(wave);
    coins = CFG.CHECKPOINT_START_COINS;
    updateCoinHud();
    checkpointWeaponMode = true;
    showWeaponReward();
  }
}

/* =====================================================================
   中断セーブ
===================================================================== */
function openPauseScreen(){
  if(STATE !== 'play') return;
  STATE = 'pause';
  showScreen('scrPause');
}

function closePauseScreen(){
  if(STATE !== 'pause') return;
  hideScreen('scrPause');
  STATE = 'play';
}

function suspendRun(){
  saveData.suspendedRun = {
    wave: wave,
    hp: tower.hp, maxHp: tower.maxHp,
    dmg: tower.dmg, fireInterval: tower.fireInterval,
    bulletSpeed: tower.bulletSpeed, range: tower.range,
    level: level, xp: xp, xpNext: xpNext,
    coins: coins, kills: kills, specialGauge: specialGauge,
    weapons: { subTurret: weapons.subTurret, pierce: weapons.pierce },
    upgradeCounts: {
      rate: upgradeCounts.rate, dmg: upgradeCounts.dmg, range: upgradeCounts.range,
      speed: upgradeCounts.speed, maxhp: upgradeCounts.maxhp, heal: upgradeCounts.heal
    }
  };
  persistSave();

  STATE = 'title'; /* ループ停止 */
  hideScreen('scrPause');
  enemies = []; bullets = []; particles = []; floaters = []; healItems = []; enemyBullets = [];
  boss = null; warningTimer = 0; bossSpawnFn = null; hideBossBar();
  document.getElementById('hudEl').style.display = 'none';
  document.getElementById('specialBtn').style.display = 'none';
  showScreen('scrTitle');
  updateTitleScreen();
}

function resumeRun(){
  var sr = saveData.suspendedRun;
  if(!sr) return;

  /* 戦闘状態リセット */
  enemies = []; bullets = []; particles = []; floaters = []; healItems = []; enemyBullets = [];
  boss = null; warningTimer = 0; bossSpawnFn = null;
  subTurretAngles = [0, 0]; subTurretFireTimers = [0, 0];
  pendingLevelUps = 0; pendingSteps = 0;
  flashTimer = 0; shakeTimer = 0; hideBossBar();

  /* セーブ状態を復元 */
  wave            = sr.wave;
  tower.hp        = sr.hp;
  tower.maxHp     = sr.maxHp;
  tower.dmg       = sr.dmg;
  tower.fireInterval = sr.fireInterval;
  tower.bulletSpeed  = sr.bulletSpeed;
  tower.range     = sr.range;
  level           = sr.level;
  xp              = sr.xp;
  xpNext          = sr.xpNext || xpRequiredForLevel(level);
  coins           = sr.coins;
  kills           = sr.kills;
  specialGauge    = sr.specialGauge || 0;
  weapons         = { subTurret: sr.weapons.subTurret, pierce: sr.weapons.pierce };
  upgradeCounts   = {
    rate: sr.upgradeCounts.rate, dmg: sr.upgradeCounts.dmg, range: sr.upgradeCounts.range,
    speed: sr.upgradeCounts.speed, maxhp: sr.upgradeCounts.maxhp, heal: sr.upgradeCounts.heal
  };
  turretAngle = 0; fireTimer = 0;

  /* 中断セーブをクリア */
  saveData.suspendedRun = null;
  persistSave();

  /* HUD更新 */
  updateXPHud(); updateCoinHud(); updateSpecialHud();
  document.getElementById('waveNum').textContent = String(wave);
  document.getElementById('waveTotal').textContent = ' / ' + CFG.MAX_WAVE;

  startWave();
  STATE = 'play';
}

/* =====================================================================
   恒久強化
===================================================================== */
var PERM_DEFS = [
  { id:'dmg',      icon:'&#128165;', name:'初期ダメージ',   suffix:'+15%/LV' },
  { id:'rate',     icon:'&#9889;',   name:'初期連射速度',   suffix:'-12%間隔/LV' },
  { id:'hp',       icon:'&#10010;',  name:'初期HP',         suffix:'+20 HP/LV' },
  { id:'range',    icon:'&#127919;', name:'初期射程',       suffix:'+8%/LV' },
  { id:'coinGain', icon:'&#9670;',   name:'コイン獲得量',   suffix:'+15%/LV' }
];

function getPermPrice(id, currentLv){
  var price = CFG.PERM_BASE_PRICE;
  for(var i = 0; i < currentLv; i++) price = price * CFG.PERM_PRICE_SCALE;
  return Math.floor(price);
}

function applyPermanentUpgrades(){
  var pu = saveData.permanentUpgrades;
  var i;
  /* ダメージ */
  var dmgMult = 1;
  for(i = 0; i < pu.dmg; i++) dmgMult *= (1 + CFG.PERM_DMG_PER_LV);
  tower.dmg *= dmgMult;
  /* 発射間隔 */
  var rateMult = 1;
  for(i = 0; i < pu.rate; i++) rateMult *= (1 - CFG.PERM_RATE_PER_LV);
  tower.fireInterval *= rateMult;
  /* HP */
  tower.maxHp += pu.hp * CFG.PERM_HP_PER_LV;
  tower.hp = tower.maxHp;
  /* 射程(baseRange設定後に乗算) */
  var rangeMult = 1;
  for(i = 0; i < pu.range; i++) rangeMult *= (1 + CFG.PERM_RANGE_PER_LV);
  tower.range *= rangeMult;
  /* コイン倍率 */
  coinGainMult = 1;
  for(i = 0; i < pu.coinGain; i++) coinGainMult *= (1 + CFG.PERM_COIN_GAIN_PER_LV);
}

function renderPermaScreen(){
  var container = document.getElementById('permaItems');
  container.innerHTML = '';
  document.getElementById('permaCoinNum').textContent = String(saveData.metaCoins);

  for(var d = 0; d < PERM_DEFS.length; d++){
    var def = PERM_DEFS[d];
    var lv    = saveData.permanentUpgrades[def.id];
    var maxed = lv >= CFG.PERM_MAX_LEVEL;
    var price = maxed ? 0 : getPermPrice(def.id, lv);
    var canAfford = !maxed && saveData.metaCoins >= price;

    var div = document.createElement('div');
    var cls = 'perma-row';
    if(maxed) cls += ' maxed';
    else if(!canAfford) cls += ' cant-afford';
    div.className = cls;

    var pipsHtml = '<div class="perma-pips">';
    for(var pi = 0; pi < CFG.PERM_MAX_LEVEL; pi++){
      pipsHtml += '<div class="perma-pip' + (pi < lv ? ' on' : '') + '"></div>';
    }
    pipsHtml += '</div>';

    var priceHtml = maxed
      ? '<span style="color:rgba(77,243,255,0.55);font-size:11px;letter-spacing:2px">MAX</span>'
      : ('<div class="perma-price-col">' +
         '<span class="chex" style="width:10px;height:10px;background:#ffd257"></span>' +
         price + '</div>');

    div.innerHTML =
      '<div class="perma-icon">' + def.icon + '</div>' +
      '<div class="perma-body">' +
        '<div class="perma-name">' + def.name +
          ' <span style="color:rgba(77,243,255,0.55);font-size:10px">' + def.suffix + '</span>' +
        '</div>' +
        pipsHtml +
      '</div>' +
      priceHtml;

    if(!maxed && canAfford){
      div.setAttribute('data-perm', def.id);
      div.addEventListener('click', onPermBuy);
    }
    container.appendChild(div);
  }
}

function onPermBuy(){
  var id  = this.getAttribute('data-perm');
  var lv  = saveData.permanentUpgrades[id];
  if(lv >= CFG.PERM_MAX_LEVEL) return;
  var price = getPermPrice(id, lv);
  if(saveData.metaCoins < price) return;
  saveData.metaCoins -= price;
  saveData.permanentUpgrades[id]++;
  persistSave();
  renderPermaScreen();
}

function openPermaScreen(){
  renderPermaScreen();
  showScreen('scrPerma');
}

function closePermaScreen(){
  hideScreen('scrPerma');
  updateTitleScreen();
}

function updateTitleScreen(){
  document.getElementById('bestWaveDisp').textContent = bestWave > 0 ? 'W.' + bestWave : '—';
  document.getElementById('metaCoinDisp').textContent = String(saveData.metaCoins);
  document.getElementById('continueBtn').style.display  = saveData.suspendedRun ? 'block' : 'none';
  document.getElementById('checkpointBtn').style.display = saveData.unlockedCheckpoints.length > 1 ? 'block' : 'none';
}

/* =====================================================================
   ゲーム終了
===================================================================== */
function endGame(win){
  STATE = 'result';

  /* ベストウェーブ更新 */
  if(wave > bestWave){ bestWave = wave; }

  /* トータルキル累積 */
  saveData.totalKills += kills;

  /* メタコイン変換 */
  var metaEarned = Math.floor(coins * CFG.META_COIN_RATE);
  saveData.metaCoins += metaEarned;

  /* 中断セーブをクリア */
  saveData.suspendedRun = null;

  persistSave();

  var titleEl = document.getElementById('resTitle');
  titleEl.textContent = win ? 'VICTORY' : 'GAME OVER';
  titleEl.className   = 'res-title ' + (win ? 'win' : 'lose');
  document.getElementById('resWave').textContent  = wave + ' / ' + CFG.MAX_WAVE;
  document.getElementById('resKills').textContent = String(kills);
  document.getElementById('resLevel').textContent = String(level);
  document.getElementById('resCoins').textContent = String(Math.floor(coins));

  /* メタコイン獲得表示 */
  var metaEl = document.getElementById('resMetaEarned');
  if(metaEarned > 0){
    metaEl.style.display = 'block';
    metaEl.textContent = '+' + metaEarned + ' META COINS EARNED';
  } else {
    metaEl.style.display = 'none';
  }

  /* UPGRADE ボタン: 敗北時のみ表示 */
  document.getElementById('upgradeFromResultBtn').style.display = win ? 'none' : 'inline-block';

  showScreen('scrResult');
}

/* =====================================================================
   画面管理
===================================================================== */
function showScreen(id){ document.getElementById(id).classList.add('show'); }
function hideScreen(id){ document.getElementById(id).classList.remove('show'); }

/* =====================================================================
   イベント
===================================================================== */
function showGameUI(){
  hideScreen('scrTitle');
  document.getElementById('hudEl').style.display = 'block';
  document.getElementById('specialBtn').style.display = 'block';
}

document.getElementById('playBtn').addEventListener('click', function(){
  showGameUI();
  resetGame();
  startWave();
  STATE = 'play';
  updateTitleScreen();
});

document.getElementById('retryBtn').addEventListener('click', function(){
  hideScreen('scrResult');
  showGameUI();
  resetGame();
  startWave();
  STATE = 'play';
});

document.getElementById('upgradeBtn').addEventListener('click', function(){
  openPermaScreen();
});

document.getElementById('continueBtn').addEventListener('click', function(){
  hideScreen('scrTitle');
  document.getElementById('hudEl').style.display = 'block';
  document.getElementById('specialBtn').style.display = 'block';
  resumeRun();
});

document.getElementById('checkpointBtn').addEventListener('click', function(){
  openCheckpointScreen();
});

document.getElementById('cpCloseBtn').addEventListener('click', function(){
  hideScreen('scrCheckpoint');
});

document.getElementById('pauseBtn').addEventListener('click', function(){
  openPauseScreen();
});

document.getElementById('resumeBtn').addEventListener('click', function(){
  closePauseScreen();
});

document.getElementById('suspendBtn').addEventListener('click', function(){
  suspendRun();
});

document.getElementById('permaCloseBtn').addEventListener('click', function(){
  closePermaScreen();
});

document.getElementById('upgradeFromResultBtn').addEventListener('click', function(){
  hideScreen('scrResult');
  showScreen('scrTitle');
  updateTitleScreen();
  openPermaScreen();
});

document.getElementById('specialBtn').addEventListener('click', function(){
  fireSpecial();
});

document.getElementById('shopBtn').addEventListener('click', function(){
  openShop();
});

document.getElementById('shopCloseBtn').addEventListener('click', function(){
  closeShop();
});

document.getElementById('speedBtn').addEventListener('click', function(){
  settings.speedIdx = (settings.speedIdx + 1) % CFG.SPEED_STEPS.length;
  updateSpeedBtn();
  saveSettings();
});

function updateSpeedBtn(){
  var btn = document.getElementById('speedBtn');
  var mult = CFG.SPEED_STEPS[settings.speedIdx];
  btn.textContent = 'x' + mult;
  if(settings.speedIdx > 0){ btn.classList.add('active'); } else { btn.classList.remove('active'); }
}

updateTitleScreen();
updateSpeedBtn();

/* =====================================================================
   ゲームループ開始
===================================================================== */
requestAnimationFrame(loop);

})();
</script>
