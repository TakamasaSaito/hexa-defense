/* =====================================================================
   小型ボス生成・更新
===================================================================== */
function spawnMiniCharger(){
  var orbitDist = Math.min(W, H) * CFG.BOSS_MINI_ORBIT_RATIO;
  var angle = Math.random() * Math.PI * 2;
  boss = {
    x: cx() + Math.cos(angle) * orbitDist,
    y: cy() + Math.sin(angle) * orbitDist,
    isBoss: true, type: 'mini_charger',
    hp: CFG.BOSS_MINI_HP, maxHp: CFG.BOSS_MINI_HP,
    size: CFG.BOSS_MINI_SIZE, color: CFG.BOSS_MINI_COLOR,
    dmg: CFG.BOSS_MINI_DMG, xpReward: CFG.BOSS_MINI_XP, coinReward: CFG.COIN_BOSS,
    rot: 0, orbitAngle: angle, orbitDist: orbitDist,
    phase: 'wander', timer: CFG.BOSS_MINI_WANDER_DUR, dirX: 0, dirY: 0, stunTimer: 0
  };
  showBossBar('MINI BOSS');
}

function updateBoss(dt){
  if(!boss) return;
  /* ボスへの属性効果 */
  if(boss.dotFire){
    boss.dotFire.timer -= dt;
    var bDotD = boss.dotFire.dmgPerSec * dt;
    boss.hp -= bDotD;
    gainSpecial(bDotD);
    if(boss.dotFire.timer <= 0) boss.dotFire = null;
    if(Math.random() < 0.12 && particles.length < CFG.PARTICLE_MAX)
      particles.push({ x: boss.x+(Math.random()-0.5)*boss.size*0.5, y: boss.y+(Math.random()-0.5)*boss.size*0.5,
                       vx: (Math.random()-0.5)*40, vy: -(20+Math.random()*40),
                       life: 0.3, maxLife: 0.3, r: 2, color: '#ff8040' });
    if(boss.hp <= 0){
      burst(boss.x, boss.y, boss.color, 40);
      kills++; playSound('kill'); gainXP(boss.xpReward); gainCoin(boss.coinReward||1, boss.x, boss.y);
      if(boss.type === 'divider') spawnDividerChildren(boss);
      spawnRareItem(boss.x, boss.y);
      boss = null; hideBossBar(); return;
    }
  }
  if(boss.stunTimer > 0){
    boss.stunTimer -= dt;
    boss.rot += 1.0 * dt;
    updateBossHpBar();
    return;
  }
  if(boss.type === 'mini_charger') updateMiniCharger(dt);
  else if(boss.type === 'charger')  updateCharger(dt);
  else if(boss.type === 'summoner') updateSummoner(dt);
  else if(boss.type === 'barrage')  updateBarrage(dt);
  else if(boss.type === 'divider')  updateDivider(dt);
}

function updateMiniCharger(dt){
  var b = boss;
  /* フェーズ2移行チェック */
  if(!b.phase2 && b.hp <= b.maxHp * CFG.BOSS_PHASE2_HP_RATIO){
    b.phase2 = true;
    floater(b.x, b.y - b.size - 22, 'PHASE 2!', '#ff3d81');
    shakeTimer = 0.3; shakeMag = 8;
  }
  var wanderDur = b.phase2 ? CFG.BOSS_MINI_WANDER_DUR_P2 : CFG.BOSS_MINI_WANDER_DUR;
  var restDur   = b.phase2 ? CFG.BOSS_MINI_REST_DUR_P2   : CFG.BOSS_MINI_REST_DUR;
  b.timer -= dt;
  if(b.phase === 'wander'){
    b.orbitAngle += CFG.BOSS_MINI_SPEED_WANDER * dt;
    b.x = cx() + Math.cos(b.orbitAngle) * b.orbitDist;
    b.y = cy() + Math.sin(b.orbitAngle) * b.orbitDist;
    if(b.timer <= 0){
      b.phase = 'warn'; b.timer = CFG.BOSS_MINI_WARN_DUR;
      var dx = cx() - b.x, dy = cy() - b.y;
      var d  = Math.sqrt(dx * dx + dy * dy);
      b.dirX = dx / d; b.dirY = dy / d;
    }
  } else if(b.phase === 'warn'){
    if(b.timer <= 0){ b.phase = 'charge'; b.timer = CFG.BOSS_MINI_CHARGE_DUR; }
  } else if(b.phase === 'charge'){
    b.x += b.dirX * CFG.BOSS_MINI_SPEED_CHARGE * dt;
    b.y += b.dirY * CFG.BOSS_MINI_SPEED_CHARGE * dt;
    var dx2 = b.x - cx(), dy2 = b.y - cy();
    var d2  = Math.sqrt(dx2 * dx2 + dy2 * dy2);
    if(d2 < CFG.TOWER_HIT_RADIUS + b.size * 0.5){
      burst(b.x, b.y, b.color, 20);
      b.x = cx() + b.dirX * -(CFG.TOWER_HIT_RADIUS + b.size);
      b.y = cy() + b.dirY * -(CFG.TOWER_HIT_RADIUS + b.size);
      b.phase = 'rest'; b.timer = restDur;
      if(takeDamage(b.dmg)){ endGame(false); return; }
    }
    if(b.timer <= 0){ b.phase = 'rest'; b.timer = restDur; }
  } else if(b.phase === 'rest'){
    if(b.timer <= 0){
      b.phase = 'wander'; b.timer = wanderDur;
      b.orbitAngle = Math.atan2(b.y - cy(), b.x - cx());
    }
  }
  b.rot += 1.2 * dt;
  updateBossHpBar();
}

/* =====================================================================
   チャージャー (W10/W30)
===================================================================== */
function spawnCharger(w){
  var tier = (w >= 45) ? 'ultra' : (w >= 25) ? 'hard' : 'normal';
  var orbitDist = Math.min(W, H) * CFG.BOSS_CHARGER_ORBIT_RATIO;
  var angle = Math.random() * Math.PI * 2;
  var hp   = tier === 'ultra' ? CFG.BOSS_CHARGER_HP_ULTRA : tier === 'hard' ? CFG.BOSS_CHARGER_HP_HARD : CFG.BOSS_CHARGER_HP;
  var dmg  = tier === 'ultra' ? CFG.BOSS_CHARGER_DMG_ULTRA : tier === 'hard' ? CFG.BOSS_CHARGER_DMG_HARD : CFG.BOSS_CHARGER_DMG;
  var coin = tier === 'ultra' ? CFG.BOSS_CHARGER_COIN_ULTRA : tier === 'hard' ? CFG.BOSS_CHARGER_COIN_HARD : CFG.BOSS_CHARGER_COIN;
  boss = {
    x: cx() + Math.cos(angle) * orbitDist,
    y: cy() + Math.sin(angle) * orbitDist,
    isBoss: true, type: 'charger', tier: tier,
    shockwave: (tier !== 'normal'),   /* hard以上で衝撃波 */
    has3Phases: (w >= 25),
    hp: hp, maxHp: hp,
    size: CFG.BOSS_CHARGER_SIZE, color: CFG.BOSS_CHARGER_COLOR,
    dmg: dmg,
    xpReward:   tier === 'ultra' ? CFG.BOSS_CHARGER_XP * 3 : tier === 'hard' ? CFG.BOSS_CHARGER_XP * 2 : CFG.BOSS_CHARGER_XP,
    coinReward: coin,
    rot: 0, orbitAngle: angle, orbitDist: orbitDist,
    phase: 'wander', timer: CFG.BOSS_CHARGER_WANDER_DUR, dirX: 0, dirY: 0, stunTimer: 0
  };
  var label = tier === 'ultra' ? 'BOSS : CHARGER III' : tier === 'hard' ? 'BOSS : CHARGER II' : 'BOSS : CHARGER';
  showBossBar(label);
}

function updateCharger(dt){
  var b = boss;
  if(!b.phase2 && b.hp <= b.maxHp * CFG.BOSS_PHASE2_HP_RATIO){
    b.phase2 = true;
    floater(b.x, b.y - b.size - 22, 'PHASE 2!', '#ff3d81');
    shakeTimer = 0.4; shakeMag = 12;
  }
  if(b.has3Phases && !b.phase3 && b.hp <= b.maxHp * CFG.BOSS_PHASE3_HP_RATIO){
    b.phase3 = true;
    floater(b.x, b.y - b.size - 22, 'PHASE 3!', '#ff0044');
    shakeTimer = 0.6; shakeMag = 18;
  }
  var wanderDur = b.phase3 ? CFG.BOSS_CHARGER_WANDER_DUR_P3 : b.phase2 ? CFG.BOSS_CHARGER_WANDER_DUR_P2 : CFG.BOSS_CHARGER_WANDER_DUR;
  var restDur   = b.phase3 ? CFG.BOSS_CHARGER_REST_DUR_P3   : b.phase2 ? CFG.BOSS_CHARGER_REST_DUR_P2   : CFG.BOSS_CHARGER_REST_DUR;
  b.timer -= dt;
  if(b.phase === 'wander'){
    b.orbitAngle += CFG.BOSS_CHARGER_SPEED_WANDER * dt;
    b.x = cx() + Math.cos(b.orbitAngle) * b.orbitDist;
    b.y = cy() + Math.sin(b.orbitAngle) * b.orbitDist;
    if(b.timer <= 0){
      b.phase = 'warn'; b.timer = CFG.BOSS_CHARGER_WARN_DUR;
      var dx = cx() - b.x, dy = cy() - b.y;
      var d  = Math.sqrt(dx * dx + dy * dy);
      b.dirX = dx / d; b.dirY = dy / d;
    }
  } else if(b.phase === 'warn'){
    if(b.timer <= 0){ b.phase = 'charge'; b.timer = CFG.BOSS_CHARGER_CHARGE_DUR; }
  } else if(b.phase === 'charge'){
    b.x += b.dirX * CFG.BOSS_CHARGER_SPEED_CHARGE * dt;
    b.y += b.dirY * CFG.BOSS_CHARGER_SPEED_CHARGE * dt;
    var dx2 = b.x - cx(), dy2 = b.y - cy();
    var d2  = Math.sqrt(dx2 * dx2 + dy2 * dy2);
    if(d2 < CFG.TOWER_HIT_RADIUS + b.size * 0.5){
      burst(b.x, b.y, b.color, 22);
      if(b.shockwave){ bossShockwave(b); }
      b.x = cx() + b.dirX * -(CFG.TOWER_HIT_RADIUS + b.size);
      b.y = cy() + b.dirY * -(CFG.TOWER_HIT_RADIUS + b.size);
      b.phase = 'rest'; b.timer = restDur;
      if(takeDamage(b.dmg)){ endGame(false); return; }
    }
    if(b.timer <= 0){ b.phase = 'rest'; b.timer = restDur; }
  } else if(b.phase === 'rest'){
    if(b.timer <= 0){
      b.phase = 'wander'; b.timer = wanderDur;
      b.orbitAngle = Math.atan2(b.y - cy(), b.x - cx());
    }
  }
  b.rot += 1.4 * dt;
  updateBossHpBar();
}

function bossShockwave(b){
  var dmg = CFG.BOSS_CHARGER_SHOCKWAVE_DMG;
  var r2  = CFG.BOSS_CHARGER_SHOCKWAVE_R * CFG.BOSS_CHARGER_SHOCKWAVE_R;
  var i;
  for(i = enemies.length - 1; i >= 0; i--){
    var e = enemies[i];
    var ex = e.x - b.x, ey = e.y - b.y;
    if(ex * ex + ey * ey < r2){
      e.hp -= dmg;
      burst(e.x, e.y, '#ff6b35', 8);
      if(e.hp <= 0){
        kills++; gainXP(e.xpReward); gainCoin(e.coinReward || 1, e.x, e.y);
        enemies.splice(i, 1);
      }
    }
  }
  /* 衝撃波リング */
  for(var k = 0; k < 32; k++){
    var a = Math.PI * 2 / 32 * k;
    particles.push({ x: b.x, y: b.y,
      vx: Math.cos(a) * 200, vy: Math.sin(a) * 200,
      life: 0.55, maxLife: 0.55, r: 4, color: '#ff6b35' });
  }
  floater(b.x, b.y - b.size - 14, 'SHOCKWAVE', '#ff6b35');
}

function updateSummoner(dt){
  var b = boss;
  if(!b.phase2 && b.hp <= b.maxHp * CFG.BOSS_PHASE2_HP_RATIO){
    b.phase2 = true;
    floater(b.x, b.y - b.size - 22, 'PHASE 2!', '#ff3d81');
    shakeTimer = 0.4; shakeMag = 12;
    b.summonTimer = CFG.BOSS_SUMMONER_SUMMON_INTERVAL_P2;
    b.bulletTimer = CFG.BOSS_SUMMONER_BULLET_INTERVAL_P2;
  }
  if(b.has3Phases && !b.phase3 && b.hp <= b.maxHp * CFG.BOSS_PHASE3_HP_RATIO){
    b.phase3 = true;
    floater(b.x, b.y - b.size - 22, 'PHASE 3!', '#ff0044');
    shakeTimer = 0.6; shakeMag = 18;
    b.summonTimer = CFG.BOSS_SUMMONER_SUMMON_INTERVAL_P3;
    b.bulletTimer = CFG.BOSS_SUMMONER_BULLET_INTERVAL_P3;
  }
  b.orbitAngle += CFG.BOSS_SUMMONER_SPEED_ORBIT * dt;
  b.x = cx() + Math.cos(b.orbitAngle) * b.orbitDist;
  b.y = cy() + Math.sin(b.orbitAngle) * b.orbitDist;

  b.summonTimer -= dt;
  if(b.summonTimer <= 0){
    var cnt;
    if(b.phase3){ cnt = CFG.BOSS_SUMMONER_SUMMON_COUNT_P3; }
    else if(b.phase2){ cnt = CFG.BOSS_SUMMONER_SUMMON_COUNT_P2; }
    else { cnt = (b.tier !== 'normal') ? CFG.BOSS_SUMMONER_SUMMON_COUNT_HARD : CFG.BOSS_SUMMONER_SUMMON_COUNT; }
    var si;
    for(si = 0; si < cnt; si++){ spawnSummonerMinion(b.x, b.y); }
    var nextSummon = b.phase3 ? CFG.BOSS_SUMMONER_SUMMON_INTERVAL_P3 : b.phase2 ? CFG.BOSS_SUMMONER_SUMMON_INTERVAL_P2 : CFG.BOSS_SUMMONER_SUMMON_INTERVAL;
    b.summonTimer = nextSummon;
    burst(b.x, b.y, b.color, 14);
    floater(b.x, b.y - b.size - 10, 'SUMMON!', b.color);
  }

  b.bulletTimer -= dt;
  if(b.bulletTimer <= 0){
    var bcount;
    if(b.phase3){ bcount = CFG.BOSS_SUMMONER_BULLET_COUNT_P3; }
    else if(b.phase2){ bcount = CFG.BOSS_SUMMONER_BULLET_COUNT_P2; }
    else { bcount = (b.tier !== 'normal') ? CFG.BOSS_SUMMONER_BULLET_COUNT_HARD : CFG.BOSS_SUMMONER_BULLET_COUNT; }
    fireSummonerBullets(b, bcount);
    var nextBullet = b.phase3 ? CFG.BOSS_SUMMONER_BULLET_INTERVAL_P3 : b.phase2 ? CFG.BOSS_SUMMONER_BULLET_INTERVAL_P2 : CFG.BOSS_SUMMONER_BULLET_INTERVAL;
    b.bulletTimer = nextBullet;
  }

  b.rot += 0.8 * dt;
  updateBossHpBar();
}

      x: b.x, y: b.y,
      vx: Math.cos(a) * CFG.BOSS_BARRAGE_BULLET_SPEED,
      vy: Math.sin(a) * CFG.BOSS_BARRAGE_BULLET_SPEED,
      life: 4.0, dmg: CFG.BOSS_BARRAGE_BULLET_DMG,
      color: CFG.BOSS_BARRAGE_COLOR, r: 6

}

function fireSummonerBullets(b, count){
  var baseAngle = Math.atan2(cy() - b.y, cx() - b.x);
  var spread    = Math.PI / 9;
  var i;
  for(i = 0; i < count; i++){
    var a = count === 1 ? baseAngle :
      baseAngle - spread + spread * 2 / (count - 1) * i;
    enemyBullets.push({
      x: b.x, y: b.y,
      vx: Math.cos(a) * CFG.BOSS_SUMMONER_BULLET_SPEED,
      vy: Math.sin(a) * CFG.BOSS_SUMMONER_BULLET_SPEED,
      life: 4.0, dmg: CFG.BOSS_SUMMONER_BULLET_DMG,
      color: '#c84dff', r: 7
    });

/* =====================================================================
   サブ砲台更新
===================================================================== */
function updateSubTurrets(dt){
  var sCombatants = enemies.slice();
  if(boss !== null) sCombatants.push(boss);
  for(var si = 0; si < weapons.subTurret && si < CFG.SUB_TURRET_OFFSETS.length; si++){
    var off = CFG.SUB_TURRET_OFFSETS[si];
    var sx = cx() + off.dx, sy = cy() + off.dy;
    var starget = null, sbest = 1e9;
    for(var sj = 0; sj < sCombatants.length; sj++){
      var sc = sCombatants[sj];
      var sdx = sc.x - sx, sdy = sc.y - sy;
      var sdd = Math.sqrt(sdx * sdx + sdy * sdy);
      if(sdd < tower.range && sdd < sbest){ sbest = sdd; starget = sc; }
    }
    if(starget){
      var sta = Math.atan2(starget.y - sy, starget.x - sx);
      var sdiff = sta - subTurretAngles[si];
      while(sdiff >  Math.PI) sdiff -= Math.PI * 2;
      while(sdiff < -Math.PI) sdiff += Math.PI * 2;
      subTurretAngles[si] += sdiff * Math.min(1, dt * 8);
      subTurretFireTimers[si] -= dt;
      if(subTurretFireTimers[si] <= 0){
        subTurretFireTimers[si] = tower.fireInterval / CFG.SUB_TURRET_FIRE_RATIO;
        var sDmg = tower.dmg * CFG.SUB_TURRET_DMG_RATIO;
        var sAng = subTurretAngles[si];
        var spMax = CFG.PIERCE_LV[Math.min(weapons.pierce, CFG.PIERCE_LV.length - 1)];
        var sdLv = Math.min(4, upgradeCounts.dmg);
        var stAttr = getBulletAttrColor(CFG.BULLET_DMG_COLORS[sdLv], CFG.BULLET_DMG_GLOWS[sdLv]);
        bullets.push({
          x: sx + Math.cos(sAng) * 14,
          y: sy + Math.sin(sAng) * 14,
          vx: Math.cos(sAng) * tower.bulletSpeed,
          vy: Math.sin(sAng) * tower.bulletSpeed,
          life: CFG.BULLET_LIFE, dmg: sDmg, pierceLeft: spMax,
          r: CFG.BULLET_DMG_RADII[sdLv] * 0.75,
          bcolor: stAttr.c, bglow: stAttr.g, exploded: false
        });
        playSound('shoot');
      }
    }
  }
}

   武器報酬

  document.getElementById('wpnContinueBtn').style.display = 'block';
  showScreen('scrWeapon');
}

  /* W5ボス撃破後の属性3択 */
  STATE = 'weapon_reward';
  var container = document.getElementById('wpnCards');
  container.innerHTML = '';
  document.getElementById('wpnContinueBtn').style.display = 'none';
  document.getElementById('wpnSub').textContent = 'CHOOSE YOUR ELEMENT — WAVE 5';

  var elems = [

    { id:'attr_ice',       icon:'&#10052;',  name:'氷属性', color:'#4df3ff',
      desc:'命中した敵を減速<br><span style="color:rgba(255,255,255,0.6)">生存重視・時間稼ぎビルド向き</span>' },
    { id:'attr_lightning', icon:'&#9888;',   name:'雷属性', color:'#ffd257',
      desc:'1体を起点に電撃連鎖<br><span style="color:rgba(255,255,255,0.6)">多数の敵・群れ対策ビルド向き</span>' }

      '<div class="band" style="background:linear-gradient(90deg,' + e.color + ',' + e.color + ')"></div>' +

      '<div class="icon">' + e.icon + '</div>' +

      '<div class="cdesc">' + e.desc + '</div>';
    div.setAttribute('data-elem', e.id);
    div.addEventListener('click', onElemChoice);

  showScreen('scrWeapon');
}

function onElemChoice(){
  playSound('button');
  var id = this.getAttribute('data-elem');
  /* chosenElement を記録 */
  if(id === 'attr_fire')      chosenElement = 'fire';
  else if(id === 'attr_ice')  chosenElement = 'ice';
  else                         chosenElement = 'lightning';
  /* 選択属性をLv1(+初期属性Lvボーナス)で付与 */
  var startLv = Math.min(1 + elemStartBonus, 3);
  if(id === 'attr_fire')      weapons.attrFire      = startLv;
  else if(id === 'attr_ice')  weapons.attrIce       = startLv;
  else                         weapons.attrLightning = startLv;
  hideScreen('scrWeapon');
  proceedAfterWeaponReward();
}

function showWeaponReward(){
  if(wave === 5){  showElementChoice(); return; }
  if(wave === 10){ showSpecialUnlock('railgun', 'RAILGUN', '#4df3ff', '射程無制限の<br>貫通レーザー'); return; }
  if(wave === 15){ showSpecialUnlock('beam', 'BEAM', '#ff8844', '10秒間タワーから<br>極太ビーム 操作可'); return; }
  if(wave === 20){ showSpecialUnlock('overdrive', 'OVERDRIVE', '#ffd257', '8秒間タワー<br>全ステータス大強化'); return; }

  var pool = buildWeaponPool();
  if(pool.length === 0){ proceedAfterWeaponReward(); return; }

  /* Fisher-Yates shuffle、重複除去で最大2択 */
  for(var i = pool.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var picks = [], seen = {};
  for(var pi = 0; pi < pool.length && picks.length < 2; pi++){
    if(!seen[pool[pi]]){ picks.push(pool[pi]); seen[pool[pi]] = true; }
  }

  document.getElementById('wpnContinueBtn').style.display = 'none';
  STATE = 'weapon_reward';
  var container = document.getElementById('wpnCards');
  container.innerHTML = '';
  for(var k = 0; k < picks.length; k++){
    container.appendChild(makeWpnCardFromPool(picks[k]));
  }
  document.getElementById('wpnSub').textContent = 'CHOOSE YOUR WEAPON — WAVE ' + wave;
  showScreen('scrWeapon');
}

function makeWpnCard(id, icon, name, desc, disabled){
  var div = document.createElement('div');
  div.className = 'wpn-card' + (disabled ? ' disabled' : '');
  div.innerHTML =
    '<div class="band"></div>' +
    '<div class="tag">SPECIAL</div>' +
    '<div class="icon">' + icon + '</div>' +
    '<div class="cname">' + name + '</div>' +
    '<div class="cdesc">' + desc + '</div>';
  if(!disabled){
    div.setAttribute('data-wpn', id);
    div.addEventListener('click', onWeaponSelect);
  }
  return div;
}

function onWeaponSelect(){
  playSound('button');
  var id = this.getAttribute('data-wpn');
  if(id === 'sub_turret')    weapons.subTurret     = Math.min(weapons.subTurret     + 1, 4);
  if(id === 'pierce')        weapons.pierce         = Math.min(weapons.pierce        + 1, CFG.PIERCE_LV.length - 1);
  if(id === 'attr_fire')     weapons.attrFire       = Math.min(weapons.attrFire      + 1, 3);
  if(id === 'attr_ice')      weapons.attrIce        = Math.min(weapons.attrIce       + 1, 3);
  if(id === 'attr_lightning') weapons.attrLightning = Math.min(weapons.attrLightning + 1, 3);
  if(id === 'orbital'){      weapons.orbital        = Math.min(weapons.orbital       + 1, 6); rebuildOrbitals(); }
  if(id === 'explosion')     weapons.explosion      = Math.min(weapons.explosion     + 1, 3);
  if(id === 'satellite'){    weapons.satellite      = Math.min(weapons.satellite     + 1, 5); rebuildSatellites(); }
  if(id === 'field'){
    if(weapons.field === 0){ fieldUsesLeft += CFG.FIELD_BASE_USES; }
    else { fieldUsesLeft += CFG.FIELD_EXTRA_USES; }
    weapons.field = Math.min(weapons.field + 1, 5);
  }
  hideScreen('scrWeapon');
  proceedAfterWeaponReward();
}

function proceedAfterWeaponReward(){
  if(checkpointWeaponMode){
    checkpointWeaponMode = false;
    startWave(); STATE = 'play';
  } else {
    if(wave >= CFG.MAX_WAVE){ endGame(true); } else { wave++; startWave(); STATE = 'play'; }
  }
}

/* =====================================================================
   描画
===================================================================== */
function hexPath(r, rot){
  ctx.beginPath();
  for(var k = 0; k < 6; k++){
    var a  = Math.PI / 3 * k + rot;
    var px = Math.cos(a) * r, py = Math.sin(a) * r;
    if(k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function draw(tm, dt){
  hexRot += dt * 0.25; /* 描画側で等倍回転 */
  ctx.save();
  if(shakeTimer > 0) ctx.translate(shakeX, shakeY);

  /* 背景 */
  var bg = ctx.createRadialGradient(cx(), cy(), 0, cx(), cy(), Math.max(W, H) * 0.85);
  bg.addColorStop(0, '#0b1626'); bg.addColorStop(1, '#04070d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  /* 星 */
  var j;
  for(j = 0; j < stars.length; j++){
    var s = stars[j];
    ctx.globalAlpha = 0.25 + 0.35 * Math.abs(Math.sin(tm * 0.8 + s.tw));
    ctx.fillStyle = '#aee6ff';
    ctx.beginPath(); ctx.arc(s.xr * W, s.yr * H, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* 六角グリッド */
  ctx.strokeStyle = 'rgba(70,130,190,0.08)'; ctx.lineWidth = 1;
  var hr = 34, hh = hr * Math.sqrt(3) / 2, row = 0, gy, gx;
  for(gy = -hh; gy < H + hh; gy += hh, row++){
    var off = (row % 2) ? hr * 1.5 : 0;
    for(gx = -hr * 3 + off; gx < W + hr * 3; gx += hr * 3){
      ctx.save(); ctx.translate(gx, gy); hexPath(hr, Math.PI / 6); ctx.stroke(); ctx.restore();
    }
  }

  if(STATE === 'title'){ ctx.restore(); return; }

  /* 射程リング + レーダースイープ */
  ctx.strokeStyle = 'rgba(77,243,255,0.28)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.arc(cx(), cy(), tower.range, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.save(); ctx.translate(cx(), cy()); ctx.rotate(tm * 0.9);
  var sg = ctx.createLinearGradient(0, 0, tower.range, 0);
  sg.addColorStop(0, 'rgba(77,243,255,0)'); sg.addColorStop(1, 'rgba(77,243,255,0.10)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, tower.range, -0.5, 0); ctx.closePath(); ctx.fill();
  ctx.restore();

  /* BEAM */
  if(beamTimer > 0){
    var bmFrac = beamTimer / CFG.BEAM_DUR;
    var bmLen  = Math.max(W, H) * 1.6;
    var bmEx   = cx() + Math.cos(beamAngle) * bmLen;
    var bmEy   = cy() + Math.sin(beamAngle) * bmLen;
    var bmFlicker = 0.75 + 0.25 * Math.abs(Math.sin(tm * 18));
    ctx.save();
    ctx.globalAlpha = bmFrac * bmFlicker;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = CFG.BEAM_WIDTH * 0.8;
    ctx.shadowColor = '#ff8844'; ctx.shadowBlur = 48;
    ctx.beginPath(); ctx.moveTo(cx(), cy()); ctx.lineTo(bmEx, bmEy); ctx.stroke();
    ctx.globalAlpha = bmFrac * bmFlicker * 0.55;
    ctx.strokeStyle = '#ffcc88'; ctx.lineWidth = CFG.BEAM_WIDTH * 1.6;
    ctx.beginPath(); ctx.moveTo(cx(), cy()); ctx.lineTo(bmEx, bmEy); ctx.stroke();
    ctx.globalAlpha = bmFrac * 0.85;
    ctx.strokeStyle = '#ff4400'; ctx.lineWidth = CFG.BEAM_WIDTH * 0.3;
    ctx.beginPath(); ctx.moveTo(cx(), cy()); ctx.lineTo(bmEx, bmEy); ctx.stroke();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
  }

  /* レールガンチャージ予兆 */
  if(railgunCharge){
    var rcFrac = railgunCharge.timer / railgunCharge.maxTimer;
    var rcAng  = railgunCharge.ang;
    var rcCa   = Math.cos(rcAng), rcSa = Math.sin(rcAng);
    var rcLen  = Math.sqrt(W * W + H * H);
    ctx.save();
    ctx.strokeStyle = '#4df3ff'; ctx.shadowColor = '#4df3ff';
    /* 照準線(点線) */
    ctx.globalAlpha = rcFrac * 0.55;
    ctx.lineWidth = 1; ctx.shadowBlur = 12;
    ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.moveTo(cx(), cy()); ctx.lineTo(cx() + rcCa * rcLen, cy() + rcSa * rcLen); ctx.stroke();
    ctx.setLineDash([]);
    /* 充電リング(タワー中心で拡大) */
    ctx.globalAlpha = rcFrac * 0.9;
    ctx.lineWidth = 2 + rcFrac * 5;
    ctx.shadowBlur = 20 + rcFrac * 55;
    ctx.beginPath(); ctx.arc(cx(), cy(), 8 + rcFrac * 28, 0, Math.PI * 2); ctx.stroke();
    ctx.restore(); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  /* レールガンビーム(極太3層) */
  if(railgunBeam && railgunBeam.timer > 0){
    var rbAlpha = railgunBeam.timer / railgunBeam.maxTimer;
    ctx.save();
    ctx.strokeStyle = '#4df3ff'; ctx.shadowColor = '#4df3ff';
    /* 外周アンビエント */
    ctx.globalAlpha = rbAlpha * 0.12;
    ctx.lineWidth = 34; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.moveTo(railgunBeam.x1, railgunBeam.y1); ctx.lineTo(railgunBeam.x2, railgunBeam.y2); ctx.stroke();
    /* 中間グロー */
    ctx.globalAlpha = rbAlpha * 0.35;
    ctx.lineWidth = 16; ctx.shadowBlur = 50;
    ctx.beginPath(); ctx.moveTo(railgunBeam.x1, railgunBeam.y1); ctx.lineTo(railgunBeam.x2, railgunBeam.y2); ctx.stroke();
    /* コアビーム */
    ctx.globalAlpha = rbAlpha;
    ctx.lineWidth = 5; ctx.shadowBlur = 45;
    ctx.beginPath(); ctx.moveTo(railgunBeam.x1, railgunBeam.y1); ctx.lineTo(railgunBeam.x2, railgunBeam.y2); ctx.stroke();
    ctx.restore(); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  /* パーティクル */
  for(j = 0; j < particles.length; j++){
    var p = particles[j];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* 敵 */
  for(j = 0; j < enemies.length; j++){
    var e = enemies[j];
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot);
    ctx.shadowColor = e.color;
    ctx.shadowBlur = (e.type === 'sniper') ? 22 : 14;
    ctx.strokeStyle = e.color; ctx.lineWidth = 3.5;

    if(e.type === 'sniper'){
      /* 三角形(先端がタワーを向く) */
      ctx.beginPath();
      ctx.moveTo(0, -e.size * 0.78);
      ctx.lineTo(e.size * 0.48, e.size * 0.52);
      ctx.lineTo(-e.size * 0.48, e.size * 0.52);
      ctx.closePath(); ctx.stroke();
      ctx.globalAlpha = 0.22; ctx.fillStyle = e.color; ctx.fill();
    } else if(e.type === 'divider_child'){
      /* 分裂子ボス: 二重六角形 */
      ctx.lineWidth = 3.5;
      hexPath(e.size * 0.65, 0); ctx.stroke();
      ctx.lineWidth = 1.5;
      hexPath(e.size * 0.38, e.rot); ctx.stroke();
      ctx.globalAlpha = 0.18; ctx.fillStyle = e.color;
      hexPath(e.size * 0.65, 0); ctx.fill();
    } else if(e.type === 'split' && e.splitOnDeath){
      /* 親分裂体: 六角形 */
      ctx.lineWidth = 3;
      hexPath(e.size * 0.62, 0); ctx.stroke();
      ctx.globalAlpha = 0.2; ctx.fillStyle = e.color;
      hexPath(e.size * 0.62, 0); ctx.fill();
    } else {
      /* 通常(赤・オレンジ・子分裂体・ウィーバー) */
      ctx.strokeRect(-e.size / 2, -e.size / 2, e.size, e.size);
      ctx.globalAlpha = 0.15; ctx.fillStyle = e.color;
      ctx.fillRect(-e.size / 2, -e.size / 2, e.size, e.size);
    }
    ctx.globalAlpha = 1; ctx.restore();
    /* 炎エフェクト */
    if(e.dotFire){
      var fp = 0.55 + 0.45 * Math.abs(Math.sin(tm * 9.0 + j * 0.7));
      ctx.save(); ctx.globalAlpha = fp * 0.55;
      ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 14;
      ctx.fillStyle = 'rgba(255,120,20,0.7)';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size * 0.58, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
    }
    /* 氷エフェクト */
    if(e.slowIce){
      var ip = 0.5 + 0.4 * Math.abs(Math.sin(tm * 4.0 + j * 0.5));
      ctx.save(); ctx.globalAlpha = ip * 0.42;
      ctx.shadowColor = '#88ddff'; ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(80,180,255,0.65)';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size * 0.62, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
    }
    if(e.hp < e.maxHp){
      var bw = e.size * 1.6;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - bw / 2, e.y - e.size - 11, bw, 4);
      ctx.fillStyle = '#ff5560';
      ctx.fillRect(e.x - bw / 2, e.y - e.size - 11, bw * (e.hp / e.maxHp), 4);
    }
  }

  /* ボス */
  if(boss !== null){
    /* サモナー/バラージ: 巡回軌道リング */
    if(boss.type === 'summoner' || boss.type === 'barrage'){
      var orbitColor = boss.type === 'barrage' ? 'rgba(255,68,136,0.15)' : 'rgba(200,77,255,0.18)';
      ctx.save();
      ctx.strokeStyle = orbitColor; ctx.lineWidth = boss.size * 2.2;
      ctx.setLineDash([6, 14]);
      ctx.beginPath(); ctx.arc(cx(), cy(), boss.orbitDist, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    /* チャージャー/ディバイダー系: 突進予告帯 */
    if((boss.type === 'charger' || boss.type === 'mini_charger' || boss.type === 'divider') && boss.phase === 'warn'){
      var bperpX = -boss.dirY, bperpY = boss.dirX;
      var bHW    = boss.size * 1.4;
      var bfarX  = boss.x + boss.dirX * (W + H);
      var bfarY  = boss.y + boss.dirY * (W + H);
      var warnAlpha = boss.type === 'charger'
        ? (0.35 + 0.28 * Math.abs(Math.sin(tm * Math.PI * 12)))
        : (0.45 + 0.35 * Math.abs(Math.sin(tm * Math.PI * 10)));
      ctx.globalAlpha = warnAlpha;
      ctx.fillStyle = boss.type === 'charger' ? 'rgba(255,107,53,0.55)' : 'rgba(255,61,129,0.45)';
      ctx.beginPath();
      ctx.moveTo(boss.x + bperpX * bHW, boss.y + bperpY * bHW);
      ctx.lineTo(bfarX  + bperpX * bHW, bfarY  + bperpY * bHW);
      ctx.lineTo(bfarX  - bperpX * bHW, bfarY  - bperpY * bHW);
      ctx.lineTo(boss.x - bperpX * bHW, boss.y - bperpY * bHW);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = boss.type === 'charger' ? '#ff6b35' : '#ff3d81';
      ctx.lineWidth = 1.5; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(boss.x, boss.y); ctx.lineTo(bfarX, bfarY); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    /* ボス本体 */
    ctx.save(); ctx.translate(boss.x, boss.y); ctx.rotate(boss.rot);
    ctx.shadowColor = boss.color; ctx.shadowBlur = 26;
    ctx.strokeStyle = boss.color; ctx.lineWidth = 4;
    hexPath(boss.size, 0); ctx.stroke();
    /* サモナーは内側に逆回転リング */
    if(boss.type === 'summoner'){
      ctx.strokeStyle = 'rgba(200,77,255,0.5)'; ctx.lineWidth = 2;
      hexPath(boss.size * 0.6, -boss.rot * 2); ctx.stroke();
    }
    /* バラージは二重リング + 弾幕演出 */
    if(boss.type === 'barrage'){
      ctx.strokeStyle = 'rgba(255,68,136,0.6)'; ctx.lineWidth = 2;
      hexPath(boss.size * 0.55, boss.rot * 1.8); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,68,136,0.3)'; ctx.lineWidth = 1;
      hexPath(boss.size * 1.2, -boss.rot * 0.8); ctx.stroke();
    }
    /* ディバイダーは二重六角形 */
    if(boss.type === 'divider'){
      ctx.strokeStyle = 'rgba(0,255,204,0.4)'; ctx.lineWidth = 2;
      hexPath(boss.size * 0.55, -boss.rot * 1.5); ctx.stroke();
    }
    ctx.globalAlpha = 0.18; ctx.fillStyle = boss.color;
    hexPath(boss.size, 0); ctx.fill();
    ctx.globalAlpha = 1; ctx.restore();
    /* フェーズ3表示: 輝きリング */
    if(boss.phase3){
      var p3pulse = 0.5 + 0.5 * Math.abs(Math.sin(tm * 6));
      ctx.save(); ctx.translate(boss.x, boss.y);
      ctx.strokeStyle = '#ff0044'; ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.3 + p3pulse * 0.4;
      ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(0, 0, boss.size * 1.35, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
    }
    /* ボス炎エフェクト */
    if(boss.dotFire){
      var bfp = 0.55 + 0.45 * Math.abs(Math.sin(tm * 9.0));
      ctx.save(); ctx.globalAlpha = bfp * 0.50;
      ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 22;
      ctx.fillStyle = 'rgba(255,100,10,0.65)';
      ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.size * 0.62, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
    }
  }

  /* 敵弾(サモナー弾) */
  var j2;
  for(j2 = 0; j2 < enemyBullets.length; j2++){
    var eb2 = enemyBullets[j2];
    ctx.save();
    ctx.shadowColor = eb2.color; ctx.shadowBlur = 14;
    ctx.fillStyle = eb2.color; ctx.globalAlpha = 0.88;
    ctx.beginPath(); ctx.arc(eb2.x, eb2.y, eb2.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.restore();
  }

  /* 弾 */
  for(j = 0; j < bullets.length; j++){
    var bj = bullets[j];
    ctx.shadowColor = bj.bglow || '#57d8ff';
    ctx.shadowBlur = 14;
    ctx.fillStyle = bj.bcolor || '#cdf2ff';
    ctx.beginPath();
    ctx.arc(bj.x, bj.y, bj.r || 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  /* 雷稲妻フラッシュ */
  for(j = 0; j < lightningFlashes.length; j++){
    var lf = lightningFlashes[j];
    var lAlpha = lf.timer / lf.maxTimer;
    ctx.save(); ctx.globalAlpha = lAlpha;
    ctx.strokeStyle = '#ffffaa'; ctx.lineWidth = 2;
    ctx.shadowColor = '#ffff44'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(lf.x1, lf.y1);
    /* 稲妻のジグザグ中間点 */
    var lmx = (lf.x1 + lf.x2) * 0.5 + (lf.y2 - lf.y1) * 0.25;
    var lmy = (lf.y1 + lf.y2) * 0.5 - (lf.x2 - lf.x1) * 0.25;
    ctx.lineTo(lmx, lmy); ctx.lineTo(lf.x2, lf.y2); ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.restore();
  }

  /* 爆発フラッシュリング */
  for(j = 0; j < explosionFlashes.length; j++){
    var ef = explosionFlashes[j];
    var eAlpha = ef.timer / ef.maxTimer;
    var eRad = ef.r * (1.2 - eAlpha * 0.4);
    ctx.save(); ctx.globalAlpha = eAlpha * 0.65;
    ctx.strokeStyle = '#ffaa44'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(ef.x, ef.y, eRad, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = eAlpha * 0.18;
    ctx.fillStyle = '#ff8800';
    ctx.beginPath(); ctx.arc(ef.x, ef.y, eRad, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
  }

  /* ミサイル */
  for(j = 0; j < missiles.length; j++){
    var mj2 = missiles[j];
    ctx.save();
    ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffcc44'; ctx.globalAlpha = 0.92;
    ctx.beginPath(); ctx.arc(mj2.x, mj2.y, CFG.MISSILE_SIZE, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.restore();
  }

  /* 回復アイテム(緑発光クロス) */
  var healPulse = 0.55 + 0.45 * Math.sin(tm * 5.0);
  for(j = 0; j < healItems.length; j++){
    var hi3 = healItems[j];
    ctx.save();
    ctx.shadowColor = '#3ddc74'; ctx.shadowBlur = 16 * healPulse;
    ctx.globalAlpha = 0.7 + 0.3 * healPulse;
    ctx.strokeStyle = '#3ddc74'; ctx.lineWidth = 3;
    var cs = 9;
    ctx.beginPath();
    ctx.moveTo(hi3.x - cs, hi3.y); ctx.lineTo(hi3.x + cs, hi3.y);
    ctx.moveTo(hi3.x, hi3.y - cs); ctx.lineTo(hi3.x, hi3.y + cs);
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.restore();
  }

  /* レアアイテム(金色発光六角形) */
  var rarePulse = 0.5 + 0.5 * Math.abs(Math.sin(tm * 7.0));
  for(j = 0; j < rareItems.length; j++){
    var ritem = rareItems[j];
    var rlife = ritem.life / CFG.DROP_RARE_LIFE;
    ctx.save();
    ctx.translate(ritem.x, ritem.y);
    ctx.rotate(tm * 2.5);
    ctx.shadowColor = '#ffd257'; ctx.shadowBlur = 20 + 12 * rarePulse;
    ctx.globalAlpha = (0.6 + 0.4 * rarePulse) * Math.min(1, rlife * 3);
    ctx.strokeStyle = '#ffd257'; ctx.lineWidth = 2.5;
    hexPath(CFG.DROP_RARE_SIZE, 0); ctx.stroke();
    ctx.globalAlpha = (0.18 + 0.12 * rarePulse) * Math.min(1, rlife * 3);
    ctx.fillStyle = '#ffe080'; hexPath(CFG.DROP_RARE_SIZE, 0); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
  }

  /* サブ砲台 */
  for(var si = 0; si < weapons.subTurret && si < CFG.SUB_TURRET_OFFSETS.length; si++){
    var soff = CFG.SUB_TURRET_OFFSETS[si];
    ctx.save(); ctx.translate(cx() + soff.dx, cy() + soff.dy);
    ctx.shadowColor = '#4df3ff'; ctx.shadowBlur = 12;
    ctx.strokeStyle = 'rgba(77,243,255,0.8)'; ctx.lineWidth = 2;
    hexPath(11, -hexRot * 2); ctx.stroke();
    ctx.rotate(subTurretAngles[si]);
    ctx.fillStyle = '#d8f6ff'; ctx.fillRect(7, -2, 11, 4);
    ctx.shadowBlur = 0; ctx.restore();
  }

  /* 設置型フィールド */
  var fdi;
  for(fdi = 0; fdi < fields.length; fdi++){
    var fd = fields[fdi];
    var fdAlpha = fd.timer / fd.maxTimer;
    var fdPulse = 0.45 + 0.35 * Math.abs(Math.sin(tm * 3.0 + fdi * 1.2));
    ctx.save();
    ctx.globalAlpha = fdAlpha * (0.18 + fdPulse * 0.12);
    ctx.fillStyle = '#aa44ff';
    ctx.shadowColor = '#cc66ff'; ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.arc(fd.x, fd.y, fd.radius, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = fdAlpha * (0.55 + fdPulse * 0.30);
    ctx.strokeStyle = '#cc66ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(fd.x, fd.y, fd.radius, 0, Math.PI * 2); ctx.stroke();
    /* 残時間バー(上部アーク) */
    ctx.globalAlpha = fdAlpha * 0.75;
    ctx.strokeStyle = '#ff99ff'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(fd.x, fd.y, fd.radius + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * fdAlpha);
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
  }
  /* フィールドCD表示(CD中は射程リング色を紫に) */
  if(weapons.field > 0 && fieldCooldown > 0){
    var cdAlpha = 0.18 + 0.12 * Math.abs(Math.sin(tm * 2.0));
    ctx.save(); ctx.globalAlpha = cdAlpha;
    ctx.strokeStyle = '#aa44ff'; ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 8]);
    ctx.beginPath(); ctx.arc(cx(), cy(), tower.range + 10, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1; ctx.restore();
  }

  /* 衛星砲台 */
  if(satellites.length > 0){
    var satR2 = tower.range + 24;
    var sai;
    for(sai = 0; sai < satellites.length; sai++){
      var sat2 = satellites[sai];
      var sax = cx() + Math.cos(sat2.angle) * satR2;
      var say = cy() + Math.sin(sat2.angle) * satR2;
      ctx.save(); ctx.translate(sax, say);
      ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 14;
      ctx.strokeStyle = 'rgba(255,200,60,0.85)'; ctx.lineWidth = 2;
      hexPath(10, -hexRot * 1.5); ctx.stroke();
      ctx.rotate(sat2.targetAngle);
      ctx.fillStyle = '#ffe080'; ctx.shadowBlur = 8;
      ctx.fillRect(8, -2, 10, 4);
      ctx.shadowBlur = 0; ctx.restore();
    }
  }

  /* オービタル */
  if(orbitals.length > 0){
    var orbAttr = getBulletAttrColor('#ffffff', '#aaaaff');
    for(var oi = 0; oi < orbitals.length; oi++){
      var orb = orbitals[oi];
      ctx.save();
      ctx.shadowColor = orbAttr.g; ctx.shadowBlur = 18;
      ctx.fillStyle = orbAttr.c; ctx.globalAlpha = 0.88;
      ctx.beginPath(); ctx.arc(orb.x, orb.y, CFG.ORBITAL_BALL_SIZE, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.28; ctx.fillStyle = orbAttr.g;
      ctx.beginPath(); ctx.arc(orb.x, orb.y, CFG.ORBITAL_BALL_SIZE * 2.0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
    }
  }

  /* タワー */
  ctx.save(); ctx.translate(cx(), cy());
  /* OVERDRIVE中: 金色グロー追加 */
  var odGlowColor = overdriveTimer > 0 ? '#ffd257' : '#4df3ff';
  var odGlowBlur  = overdriveTimer > 0 ? (30 + 15 * Math.abs(Math.sin(tm * 8))) : 22;
  /* 外六角 */
  ctx.shadowColor = odGlowColor; ctx.shadowBlur = odGlowBlur;
  ctx.strokeStyle = overdriveTimer > 0 ? 'rgba(255,210,87,0.9)' : 'rgba(77,243,255,0.9)'; ctx.lineWidth = 3;
  hexPath(CFG.TOWER_HEX_R_OUTER, hexRot); ctx.stroke();
  /* 内六角(逆回転) */
  ctx.strokeStyle = 'rgba(150,240,255,0.55)'; ctx.lineWidth = 1.6;
  hexPath(CFG.TOWER_HEX_R_INNER, -hexRot * 1.6 + 0.5); ctx.stroke();
  ctx.shadowBlur = 0;
  /* コア */
  var pulse = 0.6 + 0.4 * Math.sin(tm * 4);
  var cg = ctx.createRadialGradient(0, 0, 0, 0, 0, CFG.TOWER_CORE_R);
  cg.addColorStop(0, 'rgba(220,255,255,' + (0.9 * pulse) + ')');
  cg.addColorStop(1, 'rgba(77,243,255,0)');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, CFG.TOWER_CORE_R, 0, Math.PI * 2); ctx.fill();
  /* 砲身 */
  ctx.rotate(turretAngle);
  ctx.fillStyle = '#eafcff'; ctx.shadowColor = '#4df3ff'; ctx.shadowBlur = 8;
  ctx.fillRect(CFG.TOWER_BARREL_START, -Math.floor(CFG.TOWER_BARREL_H / 2),
               CFG.TOWER_BARREL_LEN, CFG.TOWER_BARREL_H);
  ctx.shadowBlur = 0;
  ctx.restore();

  /* バリアシェル描画 */
  if(barrierCount > 0){
    var bk;
    for(bk = 0; bk < barrierCount; bk++){
      var bShellR = CFG.TOWER_HEX_R_OUTER + 14 + bk * 9;
      var bPulse  = barrierBreakTimer > 0 && bk === 0 ? 1.0 : (0.55 + 0.35 * Math.sin(tm * 3.5 + bk * 1.1));
      ctx.save(); ctx.translate(cx(), cy());
      ctx.strokeStyle = 'rgba(77,243,255,' + (0.55 + bPulse * 0.35) + ')';
      ctx.shadowColor = '#4df3ff'; ctx.shadowBlur = 16 + bPulse * 8;
      ctx.lineWidth = 2;
      hexPath(bShellR, hexRot * 0.4 + bk * 0.5); ctx.stroke();
      ctx.globalAlpha = 0.08 + bPulse * 0.06;
      ctx.fillStyle = '#4df3ff';
      hexPath(bShellR, hexRot * 0.4 + bk * 0.5); ctx.fill();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.restore();
    }
  }
  /* バリア破壊フラッシュ */
  if(barrierBreakTimer > 0){
    ctx.globalAlpha = (barrierBreakTimer / CFG.BARRIER_BREAK_FLASH_DUR) * 0.35;
    ctx.fillStyle = '#4df3ff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  /* タワーHPバー(セグメント) */
  var hw  = CFG.TOWER_HP_BAR_W;
  var seg = CFG.TOWER_HP_BAR_SEGS;
  var sw  = hw / seg;
  var hpRatio = tower.hp / tower.maxHp;
  for(var k = 0; k < seg; k++){
    var on = k < Math.ceil(hpRatio * seg);
    var barColor = on ? (hpRatio > 0.3 ? '#3ddc74' : '#ff5560') : 'rgba(20,40,60,0.8)';
    ctx.fillStyle = barColor;
    if(on){ ctx.shadowColor = barColor; ctx.shadowBlur = 7; } else { ctx.shadowBlur = 0; }
    ctx.fillRect(cx() - hw / 2 + k * sw + 1, cy() + CFG.TOWER_HP_BAR_Y, sw - 3, 6);
  }
  ctx.shadowBlur = 0;

  /* フローター */
  ctx.textAlign = 'center';
  for(j = 0; j < floaters.length; j++){
    var fl = floaters[j];
    ctx.globalAlpha = Math.max(0, fl.life / 0.8);
    ctx.font = '700 ' + String(fl.size || 15) + 'px "Chakra Petch", Arial';
    ctx.fillStyle = fl.color;
    ctx.fillText(fl.text, fl.x, fl.y);
  }
  ctx.globalAlpha = 1;

  /* フィールド残回数表示 */
  if(weapons.field > 0){
    var fdText, fdColor;
    if(fields.length > 0){
      fdText = 'FIELD ACTIVE';
      fdColor = 'rgba(220,160,255,' + (0.7 + 0.3 * Math.abs(Math.sin(tm * 4))) + ')';
    } else if(fieldUsesLeft > 0){
      fdText = 'FIELD x' + String(fieldUsesLeft);
      fdColor = 'rgba(220,160,255,' + (0.7 + 0.3 * Math.abs(Math.sin(tm * 2))) + ')';
    } else {
      fdText = 'FIELD x0';
      fdColor = 'rgba(120,80,160,0.55)';
    }
    ctx.save(); ctx.textAlign = 'center';
    ctx.font = '600 13px "Chakra Petch", Arial';
    ctx.fillStyle = fdColor;
    ctx.fillText(fdText, cx(), cy() + 52);
    ctx.restore();
  }

  /* BEAMアクティブ中: 操作案内 */
  if(beamTimer > 0){
    var bmGuideAlpha = 0.6 + 0.25 * Math.abs(Math.sin(tm * 3.5));
    ctx.save(); ctx.textAlign = 'center';
    ctx.font = '600 12px "Chakra Petch", Arial';
    ctx.fillStyle = 'rgba(255,136,68,' + bmGuideAlpha + ')';
    ctx.shadowColor = '#ff8844'; ctx.shadowBlur = 8;
    ctx.fillText('BEAM — DRAG TO AIM  ' + Math.ceil(beamTimer) + 's', cx(), cy() + 52);
    ctx.restore();
  }

  /* 新敵告知(軽量・ゲーム継続) */
  if(newEnemyAlert !== null){
    var naf = newEnemyAlert.timer > CFG.NEW_ENEMY_ALERT_DUR - 0.25
      ? (CFG.NEW_ENEMY_ALERT_DUR - newEnemyAlert.timer) / 0.25
      : Math.min(1.0, newEnemyAlert.timer / 0.35);
    ctx.globalAlpha = naf * 0.92;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.shadowColor = newEnemyAlert.color; ctx.shadowBlur = 22;
    ctx.fillStyle = newEnemyAlert.color;
    ctx.font = '700 ' + Math.floor(Math.min(W, H) * 0.048) + 'px "Chakra Petch", Arial';
    ctx.fillText('NEW ENEMY : ' + newEnemyAlert.name, cx(), cy() - Math.floor(H * 0.22));
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* WARNING演出 */
  if(warningTimer > 0){
    var wFade = warningTimer < 0.35 ? warningTimer / 0.35 : 1.0;
    var wPulse = 0.5 + 0.5 * Math.abs(Math.sin(tm * Math.PI * 3.5));
    ctx.globalAlpha = wFade * 0.18 * wPulse;
    ctx.fillStyle = '#ff0044';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = wFade;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 32;
    ctx.fillStyle = '#ff3d81';
    ctx.font = '700 ' + Math.floor(Math.min(W, H) * 0.088) + 'px "Chakra Petch", Arial';
    ctx.fillText('!! WARNING !!', cx(), cy() - 22);
    ctx.shadowColor = '#ffd257'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffd257';
    ctx.font = '600 ' + Math.floor(Math.min(W, H) * 0.044) + 'px "Chakra Petch", Arial';
    ctx.fillText(warningLabel, cx(), cy() + 32);
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* 必殺フラッシュ */
  if(flashTimer > 0){
    ctx.globalAlpha = (flashTimer / CFG.SPECIAL_FLASH_DUR) * 0.55;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

/* =====================================================================
   チェックポイント
===================================================================== */
function unlockCheckpoint(w){
  for(var i = 0; i < saveData.unlockedCheckpoints.length; i++){
    if(saveData.unlockedCheckpoints[i] === w) return;
  }
  saveData.unlockedCheckpoints.push(w);
  persistSave();
  floater(cx(), cy() - 110, 'CHECKPOINT W' + w + ' UNLOCKED', '#4df3ff');
}

function openCheckpointScreen(){
  hideScreen('scrTitle');
  renderCheckpointScreen();
  showScreen('scrCheckpoint');
}

function renderCheckpointScreen(){
  var container = document.getElementById('cpButtons');
  container.innerHTML = '';
  var cps = saveData.unlockedCheckpoints;
  var allOptions = [1];
  for(var ci = 0; ci < CFG.CHECKPOINT_WAVES.length; ci++){
    for(var cj = 0; cj < cps.length; cj++){
      if(cps[cj] === CFG.CHECKPOINT_WAVES[ci]){ allOptions.push(CFG.CHECKPOINT_WAVES[ci]); break; }
    }
  }
  for(var o = 0; o < allOptions.length; o++){
    var w = allOptions[o];
    var btn = document.createElement('button');
    btn.className = 'cp-wave-btn';
    btn.textContent = w === 1 ? 'WAVE 1  (START)' : ('WAVE ' + w + '  +' + CFG.CHECKPOINT_START_COINS + ' COINS & WEAPON');
    btn.setAttribute('data-cpw', String(w));
    btn.addEventListener('click', onCheckpointSelect);
    container.appendChild(btn);
  }
}

function onCheckpointSelect(){
  var w = parseInt(this.getAttribute('data-cpw'), 10);
  hideScreen('scrCheckpoint');
  showGameUI();
  resetGame();
  if(w <= 1){
    startWave();
    STATE = 'play';
  } else {
    wave = w;
    document.getElementById('waveNum').textContent = String(wave);
    coins = CFG.CHECKPOINT_START_COINS;
    updateCoinHud();
    checkpointWeaponMode = true;
    showWeaponReward();
  }
}

/* =====================================================================
   中断セーブ
===================================================================== */
function openPauseScreen(){
  if(STATE !== 'play') return;
  STATE = 'pause';
  showScreen('scrPause');
}

function closePauseScreen(){
  if(STATE !== 'pause') return;
  hideScreen('scrPause');
  STATE = 'play';
}

function suspendRun(){
  saveData.suspendedRun = {
    wave: wave,
    hp: tower.hp, maxHp: tower.maxHp,
    dmg: tower.dmg, fireInterval: tower.fireInterval,
    bulletSpeed: tower.bulletSpeed, range: tower.range,
    level: level, xp: xp, xpNext: xpNext,
    coins: coins, kills: kills, specialGauge: specialGauge,
    weapons: { subTurret: weapons.subTurret, pierce: weapons.pierce,
               attrFire: weapons.attrFire, attrIce: weapons.attrIce, attrLightning: weapons.attrLightning,
               orbital: weapons.orbital, explosion: weapons.explosion,
               satellite: weapons.satellite, field: weapons.field },
    fieldUsesLeft: fieldUsesLeft,
    specials: { railgunUnlocked: specials.railgun.unlocked, overdriveUnlocked: specials.overdrive.unlocked, beamUnlocked: specials.beam.unlocked },
    barrierCount: barrierCount,
    chosenElement: chosenElement,
    attrRangeMult: attrRangeMult,
    upgradeCounts: {
      rate: upgradeCounts.rate, dmg: upgradeCounts.dmg, range: upgradeCounts.range,
      speed: upgradeCounts.speed, barrier: upgradeCounts.barrier, heal: upgradeCounts.heal
    }
  };
  persistSave();

  STATE = 'title'; /* ループ停止 */
  hideScreen('scrPause');
  enemies = []; bullets = []; missiles = []; particles = []; floaters = []; healItems = []; rareItems = []; enemyBullets = [];
  orbitals = []; lightningFlashes = []; explosionFlashes = [];
  satellites = []; fields = []; fieldCooldown = 0; fieldUsesLeft = 0;
  missileTimer = 0;
  boss = null; warningTimer = 0; bossSpawnFn = null; newEnemyAlert = null; hideBossBar();
  document.getElementById('hudEl').style.display = 'none';
  document.getElementById('specialArea').style.display = 'none';
  showScreen('scrTitle');
  updateTitleScreen();
}

function resumeRun(){
  var sr = saveData.suspendedRun;
  if(!sr) return;

  /* 戦闘状態リセット */
  enemies = []; bullets = []; missiles = []; particles = []; floaters = []; healItems = []; rareItems = []; enemyBullets = [];
  missileTimer = 0;
  boss = null; warningTimer = 0; bossSpawnFn = null; newEnemyAlert = null;
  subTurretAngles = [0, 0, 0, 0]; subTurretFireTimers = [0, 0, 0, 0];
  pendingLevelUps = 0; pendingSteps = 0;
  flashTimer = 0; shakeTimer = 0; hideBossBar();

  /* セーブ状態を復元 */
  wave            = sr.wave;
  tower.hp        = sr.hp;
  tower.maxHp     = sr.maxHp;
  tower.dmg       = sr.dmg;
  tower.fireInterval = sr.fireInterval;
  tower.bulletSpeed  = sr.bulletSpeed;
  tower.range     = sr.range;
  level           = sr.level;
  xp              = sr.xp;
  xpNext          = sr.xpNext || xpRequiredForLevel(level);
  coins           = sr.coins;
  kills           = sr.kills;
  specialGauge    = sr.specialGauge || 0;
  specials.pulse.cd    = 0; specials.railgun.cd    = 0; specials.overdrive.cd    = 0;
  specials.pulse.unlocked    = true;
  specials.railgun.unlocked  = sr.specials ? !!sr.specials.railgunUnlocked  : false;
  specials.overdrive.unlocked= sr.specials ? !!sr.specials.overdriveUnlocked : false;
  specials.beam.unlocked     = sr.specials ? !!sr.specials.beamUnlocked      : false;
  specials.beam.cd = 0;
  overdriveTimer = 0; beamTimer = 0; railgunCharge = null; railgunBeam = null;
  weapons         = { subTurret: sr.weapons.subTurret, pierce: sr.weapons.pierce,
                      attrFire: sr.weapons.attrFire || 0, attrIce: sr.weapons.attrIce || 0,
                      attrLightning: sr.weapons.attrLightning || 0,
                      orbital: sr.weapons.orbital || 0, explosion: sr.weapons.explosion || 0,
                      satellite: sr.weapons.satellite || 0, field: sr.weapons.field || 0 };
  orbitals = []; lightningFlashes = []; explosionFlashes = [];
  satellites = []; fields = []; fieldCooldown = 0; fieldUsesLeft = sr.fieldUsesLeft || 0;
  rebuildOrbitals();
  rebuildSatellites();
  barrierCount    = sr.barrierCount || 0;
  chosenElement   = sr.chosenElement || null;
  attrRangeMult   = sr.attrRangeMult || 1.0;
  barrierBreakTimer = 0;
  applyPermGlobals();
  upgradeCounts   = {
    rate: sr.upgradeCounts.rate, dmg: sr.upgradeCounts.dmg, range: sr.upgradeCounts.range,
    speed: sr.upgradeCounts.speed, barrier: sr.upgradeCounts.barrier || 0, heal: sr.upgradeCounts.heal
  };
  turretAngle = 0; fireTimer = 0;

  /* 中断セーブをクリア */
  saveData.suspendedRun = null;
  persistSave();

  /* HUD更新 */
  updateXPHud(); updateCoinHud(); updateSpecialHud();
  document.getElementById('waveNum').textContent = String(wave);
  document.getElementById('waveTotal').textContent = ' / ' + CFG.MAX_WAVE;

  startWave();
  STATE = 'play';
}

/* =====================================================================
   恒久強化
===================================================================== */
var PERM_DEFS = [
  { id:'dmg',          max:999, icon:'&#128165;', name:'初期ダメージ',    suffix:'+20%(6:+30%, 11:+8%)' },
  { id:'rate',         max:999, icon:'&#9889;',   name:'初期連射速度',    suffix:'-15%(6:-20%, 11:-5%)' },
  { id:'hp',           max:999, icon:'&#10010;',  name:'初期HP',          suffix:'+25HP(6:+50, 11:+15)' },
  { id:'range',        max:999, icon:'&#127919;', name:'初期射程',         suffix:'+10%(6:+15%, 11:+4%)' },
  { id:'coinGain',     max:999, icon:'&#9670;',   name:'コイン獲得量',    suffix:'+18%(6:+25%, 11:+8%)' },
  { id:'barriersStart',max:3,   icon:'&#11035;',  name:'初期バリア',       suffix:'開始時バリア+1' },
  { id:'gaugeRate',    max:5,   icon:'&#9654;',   name:'必殺ゲージ効率',  suffix:'+20%蓄積速度/LV' },
  { id:'elemStart',    max:2,   icon:'&#9733;',   name:'初期属性Lv',       suffix:'選択属性+1Lv開始' }
];

function getPermPrice(id, currentLv){
  var i, price;
  if(id === 'barriersStart'){
    price = CFG.PERM_BARRIER_BASE;
    for(i = 0; i < currentLv; i++) price = price * CFG.PERM_BARRIER_SCALE;
    return Math.floor(price);
  }
  if(id === 'gaugeRate' || id === 'elemStart'){
    price = CFG.PERM_BASE_PRICE;
    for(i = 0; i < currentLv; i++) price = price * CFG.PERM_PRICE_SCALE;
    return Math.floor(price);
  }
  /* 主要5系統: Lv1〜5は通常価格、Lv6〜は後半価格(上限なしで逓増継続) */
  var brk = CFG.PERM_LEVEL_BREAK;
  if(currentLv < brk){
    price = CFG.PERM_BASE_PRICE;
    for(i = 0; i < currentLv; i++) price = price * CFG.PERM_PRICE_SCALE;
  } else {
    price = CFG.PERM_BASE_LATE;
    for(i = 0; i < (currentLv - brk); i++) price = price * CFG.PERM_PRICE_SCALE_LATE;
  }
  return Math.floor(price);
}

function applyPermLvMult(lv, earlyPer, latePer, ultraPer){
  var m = 1, brk = CFG.PERM_LEVEL_BREAK, ultra = CFG.PERM_LEVEL_ULTRA, i;
  var earlyCount = lv < brk ? lv : brk;
  var lateMax    = ultra - brk;
  var lateRaw    = lv > brk ? lv - brk : 0;
  var lateCount  = lateRaw < lateMax ? lateRaw : lateMax;
  var ultraCount = lv > ultra ? lv - ultra : 0;
  for(i = 0; i < earlyCount; i++) m *= (1 + earlyPer);
  for(i = 0; i < lateCount;  i++) m *= (1 + latePer);
  if(ultraPer !== undefined){
    for(i = 0; i < ultraCount; i++) m *= (1 + ultraPer);
  }
  return m;
}

/* グローバル倍率のみを恒久強化から再計算(resumeRun でも呼ぶ) */
function applyPermGlobals(){
  var pu = saveData.permanentUpgrades;
  var i;
  coinGainMult = applyPermLvMult(pu.coinGain, CFG.PERM_COIN_GAIN_PER_LV, CFG.PERM_COIN_GAIN_PER_LV_LATE, CFG.PERM_COIN_GAIN_PER_LV_ULTRA);
  gaugeRateMult = 1;
  for(i = 0; i < (pu.gaugeRate || 0); i++) gaugeRateMult *= (1 + CFG.PERM_GAUGE_RATE_PER_LV);
  elemStartBonus = pu.elemStart || 0;
}

function applyPermanentUpgrades(){
  var pu = saveData.permanentUpgrades;
  var i, brk = CFG.PERM_LEVEL_BREAK, ultra = CFG.PERM_LEVEL_ULTRA;

  /* ダメージ */
  tower.dmg *= applyPermLvMult(pu.dmg, CFG.PERM_DMG_PER_LV, CFG.PERM_DMG_PER_LV_LATE, CFG.PERM_DMG_PER_LV_ULTRA);

  /* 発射間隔(rate系は減少なのでultraはマイナス) */
  var rateMult = 1;
  var rateEarly = pu.rate < brk ? pu.rate : brk;
  var rateLateMax = ultra - brk;
  var rateLateRaw = pu.rate > brk ? pu.rate - brk : 0;
  var rateLate  = rateLateRaw < rateLateMax ? rateLateRaw : rateLateMax;
  var rateUltra = pu.rate > ultra ? pu.rate - ultra : 0;
  for(i = 0; i < rateEarly; i++) rateMult *= (1 - CFG.PERM_RATE_PER_LV);
  for(i = 0; i < rateLate;  i++) rateMult *= (1 - CFG.PERM_RATE_PER_LV_LATE);
  for(i = 0; i < rateUltra; i++) rateMult *= (1 - CFG.PERM_RATE_PER_LV_ULTRA);
  tower.fireInterval *= rateMult;

  /* HP(加算) */
  var hpEarly = pu.hp < brk ? pu.hp : brk;
  var hpLateMax = ultra - brk;
  var hpLateRaw = pu.hp > brk ? pu.hp - brk : 0;
  var hpLate  = hpLateRaw < hpLateMax ? hpLateRaw : hpLateMax;
  var hpUltra = pu.hp > ultra ? pu.hp - ultra : 0;
  tower.maxHp += hpEarly * CFG.PERM_HP_PER_LV + hpLate * CFG.PERM_HP_PER_LV_LATE + hpUltra * CFG.PERM_HP_PER_LV_ULTRA;
  tower.hp = tower.maxHp;

  /* 射程 */
  tower.range *= applyPermLvMult(pu.range, CFG.PERM_RANGE_PER_LV, CFG.PERM_RANGE_PER_LV_LATE, CFG.PERM_RANGE_PER_LV_ULTRA);

  /* 初期バリア */
  barrierCount = Math.min(pu.barriersStart || 0, CFG.PERM_BARRIER_MAX);

  applyPermGlobals();
}

function renderPermaScreen(){
  var container = document.getElementById('permaItems');
  container.innerHTML = '';
  document.getElementById('permaCoinNum').textContent = String(saveData.metaCoins);

  var brk = CFG.PERM_LEVEL_BREAK;
  var pipMax = CFG.PERM_MAX_LEVEL; /* ピップは10段まで */
  for(var d = 0; d < PERM_DEFS.length; d++){
    var def = PERM_DEFS[d];
    var lv    = saveData.permanentUpgrades[def.id] || 0;
    var unlimited = (def.max === 999);
    var maxed = !unlimited && lv >= def.max;
    var price = maxed ? 0 : getPermPrice(def.id, lv);
    var canAfford = !maxed && saveData.metaCoins >= price;

    var div = document.createElement('div');
    var cls = 'perma-row';
    if(maxed) cls += ' maxed';
    else if(!canAfford) cls += ' cant-afford';
    div.className = cls;

    /* ピップ: 最大10個まで描画。前半=シアン、後半(Lv6〜)=ゴールド */
    var pipCount = unlimited ? pipMax : def.max;
    var pipsHtml = '<div class="perma-pips">';
    for(var pi = 0; pi < pipCount; pi++){
      var isLate = (pi >= brk);
      var pipCls = 'perma-pip';
      if(pi < lv) pipCls += isLate ? ' on-late' : ' on';
      pipsHtml += '<div class="' + pipCls + '"></div>';
    }
    /* Lv11〜: 数値バッジを追加 */
    if(unlimited && lv > pipMax){
      pipsHtml += '<span class="perma-lv-badge">Lv' + lv + '</span>';
    }
    pipsHtml += '</div>';

    var priceHtml = maxed
      ? '<span style="color:rgba(77,243,255,0.55);font-size:11px;letter-spacing:2px">MAX</span>'
      : ('<div class="perma-price-col">' +
         '<span class="chex" style="width:10px;height:10px;background:#ffd257"></span>' +
         price + '</div>');

    div.innerHTML =
      '<div class="perma-icon">' + def.icon + '</div>' +
      '<div class="perma-body">' +
        '<div class="perma-name">' + def.name +
          ' <span style="color:rgba(77,243,255,0.55);font-size:10px">' + def.suffix + '</span>' +
        '</div>' +
        pipsHtml +
      '</div>' +
      priceHtml;

    if(!maxed && canAfford){
      div.setAttribute('data-perm', def.id);
      div.addEventListener('click', onPermBuy);
    }
    container.appendChild(div);
  }
}

function onPermBuy(){
  var id  = this.getAttribute('data-perm');
  var def = null;
  for(var di = 0; di < PERM_DEFS.length; di++){ if(PERM_DEFS[di].id === id){ def = PERM_DEFS[di]; break; } }
  if(!def) return;
  var lv  = saveData.permanentUpgrades[id] || 0;
  if(lv >= def.max) return;
  var price = getPermPrice(id, lv);
  if(saveData.metaCoins < price) return;
  saveData.metaCoins -= price;
  saveData.permanentUpgrades[id] = lv + 1;
  persistSave();
  renderPermaScreen();
}

function openPermaScreen(){
  renderPermaScreen();
  showScreen('scrPerma');
}

function closePermaScreen(){
  hideScreen('scrPerma');
  updateTitleScreen();
}

function updateTitleScreen(){
  document.getElementById('bestWaveDisp').textContent = bestWave > 0 ? 'W.' + bestWave : '—';
  document.getElementById('metaCoinDisp').textContent = String(saveData.metaCoins);
  document.getElementById('continueBtn').style.display  = saveData.suspendedRun ? 'block' : 'none';
  document.getElementById('checkpointBtn').style.display = saveData.unlockedCheckpoints.length > 1 ? 'block' : 'none';
}

/* =====================================================================
   ゲーム終了
===================================================================== */
function endGame(win){
  STATE = 'result';

  /* ベストウェーブ更新 */
  if(wave > bestWave){ bestWave = wave; }

  /* トータルキル累積 */
  saveData.totalKills += kills;

  /* メタコイン変換 */
  var metaEarned = Math.floor(coins * CFG.META_COIN_RATE);
  saveData.metaCoins += metaEarned;

  /* 中断セーブをクリア */
  saveData.suspendedRun = null;

  persistSave();

  var titleEl = document.getElementById('resTitle');
  titleEl.textContent = win ? 'VICTORY' : 'GAME OVER';
  titleEl.className   = 'res-title ' + (win ? 'win' : 'lose');
  document.getElementById('resWave').textContent  = wave + ' / ' + CFG.MAX_WAVE;
  document.getElementById('resKills').textContent = String(kills);
  document.getElementById('resLevel').textContent = String(level);
  document.getElementById('resCoins').textContent = String(Math.floor(coins));

  /* メタコイン獲得表示 */
  var metaEl = document.getElementById('resMetaEarned');
  if(metaEarned > 0){
    metaEl.style.display = 'block';
    metaEl.textContent = '+' + metaEarned + ' META COINS EARNED';
  } else {
    metaEl.style.display = 'none';
  }

  /* UPGRADE ボタン: 敗北時のみ表示 */
  document.getElementById('upgradeFromResultBtn').style.display = win ? 'none' : 'inline-block';

  showScreen('scrResult');
}

  btn.textContent = 'x' + mult;

    btn.textContent = 'MUTE';

  saveSettings();
  resumeAudio();

updateSpeedBtn();

/* フィールド設置タップ */
function tryPlaceField(px, py){
  if(STATE !== 'play') return;
  if(weapons.field === 0) return;
  if(fieldUsesLeft <= 0) return;
  if(fields.length > 0) return;   /* 同時設置は1枚まで(範囲が広いため) */
  var lv = Math.min(weapons.field - 1, CFG.FIELD_RADIUS.length - 1);
  fields.push({
    x: px, y: py,
    timer: CFG.FIELD_DURATION, maxTimer: CFG.FIELD_DURATION,
    radius: CFG.FIELD_RADIUS[lv],
    dmgPerSec: CFG.FIELD_DMG_PER_SEC[lv],
    slowMult: CFG.FIELD_SLOW_MULT
  });
  fieldUsesLeft--;
  burst(px, py, '#aa44ff', 10);
  playSound('button');
}
/* BEAMアクティブ中: タッチ/ドラッグでビーム方向を更新 */
function updateBeamAngleFromPos(px, py){
  var adx = px - cx(), ady = py - cy();
  if(Math.abs(adx) > 1 || Math.abs(ady) > 1){
    beamAngle = Math.atan2(ady, adx);
  }
}

canvas.addEventListener('touchstart', function(e){
  if(STATE !== 'play') return;
  var rect = canvas.getBoundingClientRect();
  var t = e.changedTouches[0];
  var px = t.clientX - rect.left, py = t.clientY - rect.top;
  if(beamTimer > 0){
    /* BEAMアクティブ: ドラッグで向きを操作 */
    e.preventDefault();
    updateBeamAngleFromPos(px, py);
    return;
  }
  /* BEAM非アクティブ: フィールド設置 */
  if(weapons.field === 0) return;
  e.preventDefault();
  tryPlaceField(px, py);
}, { passive: false });

canvas.addEventListener('touchmove', function(e){
  if(STATE !== 'play' || beamTimer <= 0) return;
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  var t = e.changedTouches[0];
  updateBeamAngleFromPos(t.clientX - rect.left, t.clientY - rect.top);
}, { passive: false });

canvas.addEventListener('click', function(e){
  if(STATE !== 'play') return;
  var rect = canvas.getBoundingClientRect();
  if(beamTimer > 0){
    updateBeamAngleFromPos(e.clientX - rect.left, e.clientY - rect.top);
    return;
  }
  if(weapons.field === 0) return;
  tryPlaceField(e.clientX - rect.left, e.clientY - rect.top);
});

canvas.addEventListener('mousemove', function(e){
  if(STATE !== 'play' || beamTimer <= 0) return;
  var rect = canvas.getBoundingClientRect();
  updateBeamAngleFromPos(e.clientX - rect.left, e.clientY - rect.top);
});

/* =====================================================================
   ゲームループ開始
===================================================================== */
requestAnimationFrame(loop);

})();
