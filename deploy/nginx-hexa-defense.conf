# nginx キャッシュ制御設定 — hexa.ea-journey.com
#
# 適用場所: /etc/nginx/sites-available/hexa-defense の server {} ブロック内に
#           include /path/to/deploy/nginx-hexa-defense.conf; で読み込むか、
#           server {} ブロックに直接 location ブロックを貼り付ける。
#
# index.html と manifest.json はデプロイ即時反映のため no-cache。
# 画像・アイコン類はハッシュなしだが変更頻度が低いため長期キャッシュ。

# --- デプロイ頻度が高いファイル: 毎回再検証 ---
location = /index.html {
    root /var/www/hexa-defense;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Pragma "no-cache";
}

location = /manifest.json {
    root /var/www/hexa-defense;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Pragma "no-cache";
}

# --- 静的アセット: 1年キャッシュ (immutable) ---
# ファイル名が変わらない場合でも deploy.sh が上書きするので
# 長期キャッシュが問題になるのは画像を差し替えた場合のみ。
# 差し替え時はファイル名にバージョンを付けること。
location ~* \.(png|svg|ico)$ {
    root /var/www/hexa-defense;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# --- その他ファイル: 1時間キャッシュ ---
location / {
    root /var/www/hexa-defense;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri $uri/ =404;
}
